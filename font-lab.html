<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("miraz-theme") || "dark");</script>
<title>Font Lab — Miraz Hossain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Spline+Sans+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=30">
<style>
  body { padding-top: 0; }
  .fl-head { max-width: 920px; margin: 0 auto; padding: 3rem 2rem 1rem; }
  .fl-head h1 { font-family: 'DM Serif Display', serif; font-size: 30px; color: var(--text); }
  .fl-head p { color: var(--text2); margin-top: .5rem; max-width: 60ch; }
  .fontset { max-width: 920px; margin: 0 auto; padding: 3rem 2rem; border-top: 1px solid var(--border2); }
  .fl-tag { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .08em; color: var(--accent-teal); margin-bottom: 1.75rem; text-transform: uppercase; }
  .fontset .hero-name-big { font-size: 60px; margin-bottom: .4rem; animation: none; }
  .fontset .hero-name-big .last::after { animation: none; }
  .fontset .hero-tagline { animation: none; margin-top: .6rem; }
  .fontset .hero-statement { animation: none; margin-top: 1.25rem; }
  .fl-section { margin-top: 2rem; }
  .fl-body { color: var(--text2); margin: .75rem 0 0; max-width: 62ch; line-height: 1.7; }
  .fl-stats { display: flex; gap: 2.75rem; margin-top: 1.75rem; flex-wrap: wrap; }
  .fl-stats .lg-n { display: block; font-family: 'DM Serif Display', serif; font-size: 46px; line-height: 1; color: var(--text); }
  .fl-stats .lg-n.accent { color: var(--accent-teal); }
  .fl-stats .lg-l { display: block; font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin-top: .4rem; }

  /* ===== A · Spectral / Public Sans / JetBrains Mono ===== */
  .fontset-a { font-family: 'Public Sans', sans-serif; }
  .fontset-a .hero-statement, .fontset-a .fl-body { font-family: 'Public Sans', sans-serif; }
  .fontset-a .hero-name-big, .fontset-a .section-title, .fontset-a .lg-n { font-family: 'Spectral', serif; }
  .fontset-a .hero-tagline, .fontset-a .section-meta, .fontset-a .lg-l { font-family: 'JetBrains Mono', monospace; }

  /* ===== B · Bricolage Grotesque / Source Serif 4 / Spline Sans Mono ===== */
  .fontset-b { font-family: 'Source Serif 4', serif; }
  .fontset-b .hero-statement, .fontset-b .fl-body { font-family: 'Source Serif 4', serif; }
  .fontset-b .hero-name-big, .fontset-b .section-title, .fontset-b .lg-n { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; }
  .fontset-b .hero-name-big .last { font-style: normal; }
  .fontset-b .hero-tagline, .fontset-b .section-meta, .fontset-b .lg-l { font-family: 'Spline Sans Mono', monospace; }

  /* ===== C · Literata (one family) / JetBrains Mono ===== */
  .fontset-c { font-family: 'Literata', serif; }
  .fontset-c .hero-statement, .fontset-c .fl-body { font-family: 'Literata', serif; }
  .fontset-c .hero-name-big, .fontset-c .section-title, .fontset-c .lg-n { font-family: 'Literata', serif; }
  .fontset-c .hero-tagline, .fontset-c .section-meta, .fontset-c .lg-l { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body data-page="home">

<div class="fl-head">
  <h1>Font Lab</h1>
  <p>The same slice of your site, four ways. Current fonts first, then the three non-reflex directions. Compare the name, the section heading, the serif numerals, and the mono labels.</p>
</div>

<div id="fl-current" class="fontset"></div>
<div id="fl-a" class="fontset fontset-a"></div>
<div id="fl-b" class="fontset fontset-b"></div>
<div id="fl-c" class="fontset fontset-c"></div>

<script>
const tmpl = (tag) => `
  <p class="fl-tag">${tag}</p>
  <h2 class="hero-name-big"><span class="first">Miraz</span><span class="last">Hossain</span></h2>
  <p class="hero-tagline">Researcher · Journalist · Educator</p>
  <p class="hero-bio-new hero-statement">I study how algorithms reshape truth, trust, and public knowledge, with a focus on South Asia's digital information ecosystems. And I intervene.</p>
  <div class="fl-section">
    <div class="section-header">
      <h3 class="section-title">Current research</h3>
      <span class="section-meta">two threads · pre-registered</span>
    </div>
    <p class="fl-body">Two linked questions, two pre-registered studies: how readers learn from algorithmic feeds, and what students lose when writing is outsourced to AI.</p>
  </div>
  <div class="fl-stats">
    <div><span class="lg-n accent">3.99</span><span class="lg-l">CGPA · 4.00 scale</span></div>
    <div><span class="lg-n">27</span><span class="lg-l">Courses graded</span></div>
    <div><span class="lg-n accent">9</span><span class="lg-l">A+ grades</span></div>
    <div><span class="lg-n accent">100%</span><span class="lg-l">A-range results</span></div>
  </div>
`;
document.getElementById('fl-current').innerHTML = tmpl('Current · Cormorant Garamond / DM Serif Display / Instrument Sans / DM Mono');
document.getElementById('fl-a').innerHTML = tmpl('A · Investigative serif — Spectral / Public Sans / JetBrains Mono');
document.getElementById('fl-b').innerHTML = tmpl('B · Newsroom grotesque — Bricolage Grotesque / Source Serif 4 / Spline Sans Mono');
document.getElementById('fl-c').innerHTML = tmpl('C · Scholarly monolith — Literata / JetBrains Mono');

// ?only=current|a|b|c renders just that variant at the top (for clean previews)
const only = new URLSearchParams(location.search).get('only');
if (only) {
  const head = document.querySelector('.fl-head'); if (head) head.style.display = 'none';
  ['current','a','b','c'].forEach(k => { if (k !== only) { const el = document.getElementById('fl-'+k); if (el) el.style.display = 'none'; } });
}
</script>
</body>
</html>
