th the girls, or both girls."},{"id":"AR484","lv":"D","c":"A","p":"quantifiers","q":"All ___ students in my class passed the test.","a":["the"],"x":"\"All the + noun\" refers to a specific group.","t":"All the + a specific group."},{"id":"AR485","lv":"D","c":"A","p":"quantifiers","q":"All ___ children need love and attention.","a":["-"],"x":"\"All + plural noun\" (in general) takes no article.","t":"All + plural noun in general: no article."},{"id":"AR486","lv":"D","c":"A","p":"quantifiers","q":"Half ___ class was absent because of the flu.","a":["the"],"x":"\"Half the + noun\" (also \"half of the\").","t":"Half the + noun."},{"id":"AR487","lv":"D","c":"A","p":"quantifiers","q":"The kids ate ___ whole pizza in ten minutes.","a":["the"],"x":"\"The whole + singular noun\" means all of it.","t":"The whole + noun means all of it."},{"id":"AR488","lv":"D","c":"A","p":"quantifiers","q":"He ate ___ whole chicken by himself!","a":["a"],"x":"\"A whole + singular noun\" means one complete one.","t":"A whole + noun means one complete one."},{"id":"AR489","lv":"D","c":"A","p":"the-adj-abstract","q":"___ impossible just takes a little longer.","a":["the"],"x":"\"The + adjective\" can mean an abstract idea: the impossible, the unknown.","t":"The + adjective can mean an abstract idea."},{"id":"AR490","lv":"D","c":"A","p":"the-adj-abstract","q":"Many people fear ___ unknown.","a":["the"],"x":"\"The unknown\" means things we don't know.","t":"The unknown means what we don't know."},{"id":"AR491","lv":"D","c":"A","p":"nationality","q":"___ French have a word for that feeling.","a":["the"],"x":"\"The French\" means the French people.","t":"The French means the French people."},{"id":"AR492","lv":"D","c":"A","p":"nationality","q":"Her husband is ___ Frenchman from Lyon.","a":["a"],"x":"\"A Frenchman / Englishman / Dutchman\" for one person.","t":"One person: a Frenchman."},{"id":"AR493","lv":"D","c":"A","p":"features","q":"She has ___ beautiful singing voice.","a":["a"],"x":"A countable noun describing a quality takes \"a\".","t":"A countable quality: a beautiful voice."},{"id":"AR494","lv":"D","c":"A","p":"body-part","q":"At the end of the match, the players shook ___ hands.","a":["-"],"x":"\"Shake hands\" has no article.","t":"Shake hands: no article."},{"id":"AR495","lv":"D","c":"A","p":"body-part","q":"The minister shook me by ___ hand.","a":["the"],"x":"\"Shake someone by the hand\" uses \"the\".","t":"Shake someone by the hand: the."},{"id":"AR496","lv":"H","c":"A","p":"names-special","q":"This isn't ___ Dhaka I grew up in; everything has changed.","a":["the"],"x":"\"The + city + clause\" refers to the city as it was at a certain time.","t":"The + place + clause: the place at a certain time."},{"id":"AR497","lv":"H","c":"A","p":"titles","q":"She met ___ then Prime Minister at a reception in 1995.","a":["the"],"x":"\"The then + title\" means the person who held that title at that time.","t":"The then + title: who held it at the time."},{"id":"AR498","lv":"H","c":"A","p":"the-adj","q":"___ accused denied all the charges against him.","a":["the"],"x":"\"The accused\" can refer to one person; it takes \"the\" and works like a noun.","t":"The accused can mean one person."},{"id":"AR499","lv":"H","c":"A","p":"roles","q":"She was made ___ Head of Department last year.","a":["-"],"x":"A unique role after \"make\": no article.","t":"Made + unique role: no article."},{"id":"AR500","lv":"H","c":"A","p":"names-special","q":"I'm not ___ Shakespeare, but I can write a decent birthday poem.","a":["a"],"x":"\"A Shakespeare\" means someone like Shakespeare, a great writer.","t":"A Shakespeare means someone like Shakespeare."}];
const BY = Object.fromEntries(BANK.map(b => [b.id, b]));
const LV = {C:"Common", D:"Difficult", H:"Hardest"};
const CAT = {Z:"No article", S:"a or an", M:"Mention and reference", G:"Generic and abstract", U:"Countable and uncountable", R:"Unique, superlative, ordinal", P:"Names and places", I:"Institutions and time", F:"Fixed phrases", Q:"Quantity and intensifiers", A:"Advanced structures"};
const DAY = 86400000, INT = [3, 10, 30];
const KEY = "articles-500-v2";
const DEFAULTS = {need:3, reset:true, level:"all", style:"choice", focus:"all"};
const fresh = () => ({v:1, upd:0, settings:{...DEFAULTS}, q:{}, mocks:[]});

/* ---------- storage ---------- */
function normalize(s){
  if(!s || s.v !== 1 || typeof s.q !== "object") return fresh();
  s.settings = {...DEFAULTS, ...(s.settings||{})};
  delete s.settings.set; delete s.settings.order;
  if(!Array.isArray(s.mocks)) s.mocks = [];
  for(const id in s.q){
    const r = s.q[id];
    if(r.st === "fixed" && r.stage === undefined && r.due === undefined){ r.stage = 0; r.due = (r.fixedAt || Date.now()) + INT[0]*DAY; }
  }
  return s;
}
function loadLocal(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return fresh();
}
let state = loadLocal();
const remote = {doc:null, busy:false, dirty:false, timer:null, status:"Saved on this device only"};
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function persist(){
  state.upd = Date.now();
  saveLocal();
  if(remote.doc){ remote.dirty = true; clearTimeout(remote.timer); remote.timer = setTimeout(flush, 1200); }
}
async function flush(){
  if(!remote.doc) return;
  if(remote.busy){ remote.dirty = true; return; }
  remote.busy = true; remote.dirty = false;
  try{
    await remote.doc.set({json: JSON.stringify(state), upd: state.upd});
    setStatus("Synced to your account");
  }catch(e){ setStatus("Account sync failed; saved on this device"); }
  remote.busy = false;
  if(remote.dirty){ clearTimeout(remote.timer); remote.timer = setTimeout(flush, 1200); }
}
function setStatus(t){ remote.status = t; const f = document.getElementById("remoteStatus") || document.getElementById("foot"); if(f) f.textContent = t; }
(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    remote.doc = db.collection("data/users/" + id).doc("progress");
    const snap = await remote.doc.get();
    if(snap.exists){
      const d = snap.data() || {};
      let rs = null;
      try{ rs = normalize(JSON.parse(d.json)); }catch(e){}
      if(rs && (rs.upd||0) > (state.upd||0)){ state = rs; saveLocal(); cur = null; render(); }
      else if((state.upd||0) > ((rs && rs.upd)||0)){ flush(); }
    }else if((state.upd||0) > 0){ flush(); }
    setStatus("Synced to your account");
  }catch(e){ setStatus("Account sync unavailable; saved on this device only"); }
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* "-" is the stored form of "no article"; these typed forms all mean it */
const ZERO_TYPED = ["-","–","—","0","ø","∅","x","no","none","zero","no article","nothing","nil"];
const norm = s => { const t = String(s||"").toLowerCase().replace(/\s+/g," ").trim(); if(ZERO_TYPED.includes(t)) return "-"; return t.replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); };
const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = rand(i+1); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "";
const rel = ts => { if(!ts) return ""; const d=Date.now()-ts; if(d<60000) return "just now"; if(d<3600000){ const m=Math.floor(d/60000); return m+(m===1?" min ago":" mins ago"); } const h=Math.floor(d/3600000); if(h<24) return h+(h===1?" hour ago":" hours ago"); const dd=Math.floor(d/86400000); if(dd===1) return "yesterday"; if(dd<30) return dd+" days ago"; return "on "+fmtDate(ts); };
const need = () => state.settings.need;
const inLevel = b => { const l = state.settings.level; return l==="all" || (l==="C" && b.lv==="C") || (l==="D" && b.lv!=="C") || (l==="H" && b.lv==="H"); };
const inFocus = b => state.settings.focus==="all" || b.c === state.settings.focus;
const ZERO = "-";
const L = t => t===ZERO ? "no article" : t;
const capFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const atStart = q => q.indexOf("___") === 0;
/* an answer as shown inside a sentence: the empty-set mark stands for "no article"; capitalised when it opens the sentence */
const word = (t, q) => t===ZERO ? '<span class="zero" title="no article">∅</span>' : esc(atStart(q) ? capFirst(t) : t);
const optLabel = (t, q) => atStart(q) ? capFirst(L(t)) : L(t);
const fillHTML = (q, t) => { const [pre, post] = q.split("___"); const p2 = (t===ZERO && atStart(q)) ? " "+capFirst(post.trim()) : post; return esc(pre) + (t===ZERO ? '<b class="zero" title="no article">∅</b>' : "<b>"+word(t, q)+"</b>") + esc(p2); };
const fillText = (q, t) => t===ZERO ? (atStart(q) ? capFirst(q.slice(3).trim()) : q.replace(/\s*___\s*/, " ")) : q.replace("___", t.toUpperCase());
const sentenceFilled = b => fillHTML(b.q, b.a[0]);
/* Difficult and Hardest items carry a one-line rule, shown straight after the answer */
const rule1 = b => b.t ? '<p class="rule1"><span>Rule:</span> '+esc(b.t)+'</p>' : "";
/* a very short "Why" would only restate the one-line rule, so it is left out */
const needWhy = b => !(b.t && b.x.split(" ").length <= 7);
/* the PDF writer is Latin-1 only, so IPA in explanations is printed as a plain respelling */
const PDF_IPA = {"/aʊ/":"/ow/", "/ˈjuːs-/":"/yoos-/", "/juːˈnæn-/":"/yoo-NAN-/", "/juː/":"/yoo/", "/ʌn/":"/un/", "/ʌ/":"/uh/", "/jʊə/":"/yoor/", "/wʌn/":"/wun/", "/eɪ/":"/ay/"};
const pdfIpa = s => { let o = String(s); for(const k in PDF_IPA) o = o.split(k).join(PDF_IPA[k]); return o; };
const pips = n => '<span class="pips" aria-hidden="true">' + Array.from({length:need()},(_,i)=>'<span class="pip'+(i<n?' on':'')+'"></span>').join("") + "</span>";
const tag = b => '<span class="tag '+b.lv+'">'+LV[b.lv]+'</span>';
const isDue = r => r && r.st==="fixed" && r.due && r.due <= Date.now();

const poolPractice = () => BANK.filter(b => inLevel(b) && inFocus(b) && !state.q[b.id]);
const poolReview   = () => BANK.filter(b => inLevel(b) && inFocus(b) && state.q[b.id] && state.q[b.id].st !== "err");
const poolErr      = () => BANK.filter(b => state.q[b.id] && state.q[b.id].st === "err");
const poolDue      = () => BANK.filter(b => isDue(state.q[b.id]));
const poolFix      = () => poolErr().concat(poolDue());

/* ---------- options: always the same four, in a fixed order (keys 1-4) ---------- */
const OPTS = ["a", "an", "the", ZERO];
function makeOptions(){ return OPTS.slice(); }

/* ---------- same rule, different sentence: the two nearest items in the same rule group ---------- */
function pickVariant(b, r){
  const vs = [{k:"o", q:b.q, a:b.a}];
  const at = BANK.indexOf(b);
  BANK.map((s, i) => ({s, d:Math.abs(i - at)})).filter(o => o.s.id !== b.id && o.s.p === b.p)
    .sort((x, y) => x.d - y.d).slice(0, 2).forEach(o => vs.push({k:o.s.id, q:o.s.q, a:o.s.a}));
  const last = (r && r.lastV) || "o";
  const pool = vs.filter(v => v.k !== last);
  const list = pool.length ? pool : vs;
  return list[rand(list.length)];
}

/* ---------- session ---------- */
let tab = "practice";
let cur = null;               // {mode,id,phase,q,a,vk,options,typed,ok,retired,passed,skipped,guessed}
let lastSnap = null;
let lastFixId = null;
let reviewMode = false;
let mock = {phase:"start", style:null};
let ui = {settings:false, backup:false, restore:false, confirmReset:false};

function pickNext(){
  if(tab === "fix"){
    let p = poolFix(); if(!p.length) return null;
    if(p.length > 1) p = p.filter(b => b.id !== lastFixId);
    const b = p[rand(p.length)], r = state.q[b.id], v = pickVariant(b, r);
    return {mode: r.st==="err" ? "fix" : "recheck", id:b.id, phase:"ask", q:v.q, a:v.a, vk:v.k};   // recall: always typed
  }
  if(tab === "practice"){
    const p = reviewMode ? poolReview() : poolPractice();
    if(!p.length) return null;
    const b = p[rand(p.length)];                      // always random: no order by set, level or topic
    const c = {mode:reviewMode?"review":"practice", id:b.id, phase:"ask", q:b.q, a:b.a, vk:"o"};
    if(state.settings.style === "choice") c.options = makeOptions(b.a);
    return c;
  }
  return null;
}

/* record an answer on an item; shared by practice, fix, recheck and mock */
function applyResult(b, ok, t, skipped, mode){
  let r = state.q[b.id];
  if(!r) r = state.q[b.id] = {st:"ok", att:0, miss:0, first:ok, streak:0, wrong:[]};
  r.att++; state.lastSeen = Date.now();
  const out = {retired:false, passed:false};
  if(ok){
    if(r.st === "err" && mode === "fix"){
      r.streak++;
      if(r.streak >= need()){ r.st = "fixed"; r.fixedAt = Date.now(); r.stage = 0; r.due = Date.now() + INT[0]*DAY; delete r.shaky; out.retired = true; }
    }else if(r.st === "fixed" && mode === "recheck"){
      r.stage = (r.stage||0) + 1;
      r.due = r.stage < INT.length ? Date.now() + INT[r.stage]*DAY : null;
      out.passed = true;
    }
  }else{
    r.miss++; r.lastMiss = Date.now();
    if(t && !skipped && !r.wrong.includes(t)) r.wrong.push(t);
    if(r.st === "fixed") r.relapses = (r.relapses||0) + 1;
    r.st = "err"; delete r.due; delete r.stage;
    if(state.settings.reset || mode !== "fix") r.streak = 0;
  }
  return out;
}
function submit(typed, skipped){
  if(!cur || cur.phase !== "ask") return;
  if(cur.mode === "mock") return mockAnswer(typed, skipped);
  const b = BY[cur.id];
  const t = norm(typed);
  const ok = !skipped && cur.a.includes(t);
  lastSnap = {id:b.id, prev: state.q[b.id] ? JSON.parse(JSON.stringify(state.q[b.id])) : null};
  const res = applyResult(b, ok, t, skipped, cur.mode);
  const r = state.q[b.id];
  if(cur.mode === "fix" || cur.mode === "recheck"){ r.lastV = cur.vk; lastFixId = b.id; }
  cur.phase = "done"; cur.ok = ok; cur.typed = t; cur.skipped = !!skipped; cur.retired = res.retired; cur.passed = res.passed;
  persist(); render();
}
function undo(){
  if(!lastSnap) return;
  if(lastSnap.prev) state.q[lastSnap.id] = lastSnap.prev; else delete state.q[lastSnap.id];
  const c = {mode:cur.mode, id:cur.id, phase:"ask", q:cur.q, a:cur.a, vk:cur.vk};
  if(cur.options) c.options = makeOptions(cur.a);
  cur = c; lastSnap = null; persist(); render();
}
function markGuess(){
  if(!cur || !cur.ok || cur.guessed || !lastSnap) return;
  const id = cur.id;
  if(lastSnap.prev) state.q[id] = lastSnap.prev; else delete state.q[id];
  let r = state.q[id];
  if(!r){
    r = state.q[id] = {st:"err", att:1, miss:0, first:false, streak:Math.min(1, need()-1), wrong:[], shaky:true, lastMiss:Date.now()};
  }else{
    r.att++;
    if(cur.mode === "fix"){ r.shaky = true; }
    else if(cur.mode === "recheck"){ r.due = Date.now() + DAY; }
    else if(r.st !== "err"){ r.st = "err"; r.streak = Math.min(1, need()-1); r.shaky = true; r.lastMiss = Date.now(); delete r.due; delete r.stage; }
  }
  if(cur.mode === "fix" || cur.mode === "recheck") r.lastV = cur.vk;
  cur.guessed = true; cur.retired = false; cur.passed = false; lastSnap = null;
  persist(); render();
}
function next(){ cur = pickNext(); render(); }

/* ---------- mock test ---------- */
function startMock(){
  const pick = (lv, n) => shuffle(BANK.filter(b => b.lv === lv)).slice(0, n);
  const style = mock.style || state.settings.style;
  const qs = shuffle([...pick("C",12), ...pick("D",10), ...pick("H",3)]);
  mock = {phase:"run", style, i:0, ans:[], qs: qs.map(b => ({id:b.id, options: style==="choice" ? makeOptions(b.a) : null}))};
  mockCur(); render();
}
function mockCur(){
  const m = mock.qs[mock.i], b = BY[m.id];
  cur = {mode:"mock", id:b.id, phase:"ask", q:b.q, a:b.a, vk:"o", options:m.options || undefined};
}
function mockAnswer(typed, skipped){
  mock.ans.push({typed:norm(typed), skipped:!!skipped});
  mock.i++;
  if(mock.i >= mock.qs.length) finishMock(); else mockCur();
  render();
}
function finishMock(){
  let score = 0; const byLv = {}, byCat = {}, missed = [];
  mock.qs.forEach((m, i) => {
    const b = BY[m.id], a = mock.ans[i];
    const ok = !a.skipped && b.a.includes(a.typed);
    applyResult(b, ok, a.typed, a.skipped, "mock");
    if(ok) score++; else missed.push({b, typed:a.typed, skipped:a.skipped});
    [[byLv,b.lv],[byCat,b.c]].forEach(([o,k]) => { o[k] = o[k] || {n:0, ok:0}; o[k].n++; if(ok) o[k].ok++; });
  });
  state.mocks.push({ts:Date.now(), score, total:mock.qs.length});
  state.mocks = state.mocks.slice(-20);
  persist();
  mock.phase = "done"; mock.result = {score, total:mock.qs.length, byLv, byCat, missed};
  cur = null;
}

/* ---------- views ---------- */
function renderOverview(){
  const total = BANK.length;
  let ok=0, err=0, fix=0, first=0, answered=0;
  for(const id in state.q){
    const r = state.q[id]; if(!BY[id]) continue;
    answered++; if(r.first) first++;
    if(r.st==="ok") ok++; else if(r.st==="err") err++; else if(r.st==="fixed") fix++;
  }
  const due = poolDue().length;
  const unseen = total - answered;
  const pct = n => (n/total*100).toFixed(2) + "%";
  const acc = answered ? Math.round(first/answered*100) : null;
  $("#overview").innerHTML =
    '<div class="strip" role="img" aria-label="'+answered+' of '+total+' questions answered, '+err+' open errors, '+fix+' fixed">' +
      '<i class="s-fix" style="width:'+pct(fix)+'"></i><i class="s-ok" style="width:'+pct(ok)+'"></i><i class="s-err" style="width:'+pct(err)+'"></i></div>' +
    '<p class="legend">' +
      '<span><span class="dot" style="background:var(--green)"></span><b>'+fix+'</b> fixed</span>' +
      '<span><span class="dot" style="background:var(--ink2)"></span><b>'+ok+'</b> right first time</span>' +
      '<span><span class="dot" style="background:var(--red)"></span><b>'+err+'</b> open errors</span>' +
      '<span><span class="dot" style="background:var(--line)"></span><b>'+unseen+'</b> not yet asked</span>' +
      (due ? '<span><b>'+due+'</b> due for recheck</span>' : '') +
      (acc!==null ? '<span>First-try accuracy <b>'+acc+'%</b></span>' : '') +
      (state.lastSeen ? '<span>Last practised <b>'+rel(state.lastSeen)+'</b></span>' : '') +
    '</p>';
  return {fixN: err + due, fix};
}
function renderTabs(c){
  const t = [["practice","Practice",0,""],["fix","Fix errors",c.fixN,""],["log","Error log",0,""],["fixed","Fixed list",c.fix,"green"],["insights","Insights",0,""],["mock","Mock test",0,""]];
  $("#tabs").innerHTML = t.map(([k,l,n,cl]) =>
    '<button data-tab="'+k+'"'+(tab===k?' aria-current="true"':'')+'>'+l+(n?'<span class="badge '+cl+'">'+n+'</span>':'')+'</button>').join("");
}
const MODE_LABEL = {practice:"Practice", review:"Review", fix:"Fix errors", recheck:"Recheck", mock:"Mock test"};
function questionCard(){
  const b = BY[cur.id], r = state.q[b.id];
  const [pre, post0] = cur.q.split("___");
  const post = (cur.phase==="done" && atStart(cur.q) && cur.a[0]===ZERO) ? " "+capFirst(post0.trim()) : post0;
  let left = "";
  if(cur.mode==="practice") left = poolPractice().length + " not yet asked in this pool";
  if(cur.mode==="fix" || cur.mode==="recheck"){ const n = poolErr().length, d = poolDue().length; left = n + " open " + (n===1?"error":"errors") + (d ? ", " + d + " to recheck" : ""); }
  if(cur.mode==="mock") left = "Question " + (mock.i+1) + " of " + mock.qs.length;
  let extraMeta = "";
  if((cur.mode==="fix" || cur.mode==="recheck") && cur.vk !== "o") extraMeta += '<span>Same rule, new sentence</span>';
  if((cur.mode==="practice" || cur.mode==="review") && state.settings.focus !== "all") extraMeta += '<span>Focus: '+esc(CAT[state.settings.focus])+' <button class="link" data-clearfocus="1" style="min-height:0;padding:0">clear</button></span>';
  const lvl = cur.phase==="done" ? tag(b) : "";
  const choice = cur.phase==="ask" && cur.options;
  let slot;
  if(cur.phase==="ask"){
    slot = choice
      ? '<span class="slot"><span style="display:inline-block;width:3.2ch;border-bottom:3px solid var(--ink)">&nbsp;</span></span>'
      : '<span class="slot"><input class="blank" id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer: a, an, the, or 0 for no article"></span>';
  }else if(cur.ok){
    slot = '<span class="slot ok">'+word(cur.typed, cur.q)+'</span>';
  }else if(cur.skipped || !cur.typed){
    slot = '<span class="slot bad solo"><ins>'+word(cur.a[0], cur.q)+'</ins></span>';
  }else{
    slot = '<span class="slot bad"><del>'+word(cur.typed, cur.q)+'</del><ins>'+word(cur.a[0], cur.q)+'</ins></span>';
  }
  let fb = "";
  if(cur.phase==="done"){
    const alts = cur.a.slice(1);
    const altLine = alts.length ? '<p>Also accepted: '+alts.map(t => esc(L(t))).join(", ")+'.</p>' : "";
    const shown = (cur.vk && cur.vk !== "o" && BY[cur.vk]) ? BY[cur.vk] : b;
    const why = rule1(shown) + (needWhy(shown) ? '<p class="why"><span>Why:</span> '+esc(shown.x)+'</p>' : '');
    if(cur.ok){
      const gave = cur.a.indexOf(cur.typed) > 0 ? '<p>Your answer works; the main one is <strong>'+esc(L(cur.a[0]))+'</strong>.</p>' : "";
      let extra = "";
      if(cur.guessed) extra = '<p>Marked as a guess, so it does not count as known.'+(cur.mode==="recheck"?' You will see it again tomorrow.':(cur.mode==="fix"?' No credit toward fixing this one.':' It is in your error log with a head start of '+state.q[b.id].streak+' of '+need()+'.'))+'</p>';
      else if(cur.mode==="fix") extra = cur.retired
        ? '<p class="celebrate">Fixed. It moves to your fixed list and comes back for a recheck on '+fmtDate(r.due)+'.</p>'
        : '<p>'+pips(r.streak)+' &nbsp;'+r.streak+' of '+need()+' correct toward fixing this one.</p>';
      else if(cur.mode==="recheck") extra = r.due
        ? '<p class="celebrate">Recheck passed. Next one on '+fmtDate(r.due)+'.</p>'
        : '<p class="celebrate">Recheck passed. All rechecks done: this one is mastered.</p>';
      fb = '<div class="fb ok" role="status"><p><strong>'+(cur.guessed?'Correct, but a guess.':'Correct.')+'</strong></p>'+gave+why+extra+'</div>';
    }else{
      const extra = cur.mode==="fix"
        ? '<p>'+pips(r.streak)+' &nbsp;'+(state.settings.reset?'Count reset to 0 of '+need()+'.':r.streak+' of '+need()+' correct so far.')+'</p>'
        : cur.mode==="recheck" ? '<p>Back in your error log, so you can fix it again.</p>' : '<p>Added to your error log.</p>';
      fb = '<div class="fb bad" role="status"><p><strong>Not quite.</strong> The answer is <strong>'+esc(L(cur.a[0]))+'</strong>.</p>'+altLine+why+extra+'</div>';
    }
  }
  let body;
  if(choice){
    body = '<div class="opts" role="group" aria-label="Choose the article">' +
      cur.options.map((o,i) => '<button class="opt" data-opt="'+i+'"><kbd>'+(i+1)+'</kbd>'+esc(optLabel(o, cur.q))+'</button>').join("") +
      '</div><div class="actions" style="margin-top:14px"><button class="link" id="skip">I don’t know</button></div>';
  }else if(cur.phase==="ask"){
    body = '<div class="actions"><button class="btn" id="check">'+(cur.mode==="mock"?"Next":"Check")+'</button><button class="link" id="skip">I don’t know</button></div>';
  }else{
    body = '<div class="actions"><button class="btn" id="nextBtn">Next question</button>' +
      (cur.ok && !cur.guessed && lastSnap ? '<button class="link" id="guess">I guessed this</button>' : '') +
      (!cur.ok && !cur.skipped && cur.typed && lastSnap ? '<button class="link" id="undo">That was a slip, undo</button>' : '') + '</div>';
  }
  const prog = cur.mode==="mock" ? '<div class="prog" aria-hidden="true"><i style="width:'+(mock.i/mock.qs.length*100)+'%"></i></div><p class="hint" style="margin:0 0 10px"><button class="link" data-reset="quitmock" style="min-height:0;padding:0">Quit this mock test</button></p>' : "";
  return prog + '<section class="card" aria-live="polite">' +
    '<p class="meta"><span>'+MODE_LABEL[cur.mode]+'</span><span>'+left+'</span>'+extraMeta+(lvl?lvl:'')+'</p>' +
    '<p class="sentence">'+esc(pre)+slot+esc(post)+'</p>' +
    (cur.phase==="ask" && !cur.options ? '<p class="typehint">Type a, an or the. For no article, type 0 or a dash.</p>' : '') +
    fb + body + '</section>';
}
function emptyBlock(h, p, btns){ return '<section class="empty"><h2>'+h+'</h2><p>'+p+'</p>'+(btns||"")+'</section>'; }
function viewPractice(){
  if(!cur){
    if(reviewMode) return emptyBlock("No review questions yet","Answer some new questions first, then come back to repeat the ones you got right.",'<button class="btn" data-act="newq">Back to new questions</button>');
    const seen = BANK.filter(b => inLevel(b) && inFocus(b) && state.q[b.id]).length;
    const hasReview = poolReview().length > 0;
    return emptyBlock("Every question in this pool has been asked",
      seen ? "Open errors are waiting in Fix errors. You can also repeat questions you got right, or change the level or focus in Settings." : "There are no questions with this level and focus.",
      '<div class="actions" style="margin-top:0"><button class="btn" data-tab="fix">Go to Fix errors</button>'+(hasReview?'<button class="link" data-act="review">Review questions I got right</button>':'')+(BANK.some(b=>inLevel(b)&&inFocus(b)&&state.q[b.id]&&state.q[b.id].st==="ok")?'<button class="warnbtn" data-reset="poolround">Start a new round</button>':'')+'</div>');
  }
  return questionCard();
}
function viewFix(){
  if(!cur) return emptyBlock("Nothing to fix or recheck right now","Questions you miss land here. Get one right "+need()+" times and it moves to the fixed list, then returns for rechecks after "+INT.join(", ")+" days.",'<button class="btn" data-tab="practice">Go to Practice</button>');
  return questionCard();
}
function viewLog(){
  const items = poolErr().sort((a,b) => (state.q[b.id].lastMiss||0) - (state.q[a.id].lastMiss||0));
  if(!items.length) return emptyBlock("The error log is empty","Every miss is recorded here with the wrong answers you tried, until you fix it.");
  const tally = {};
  BANK.forEach(b => { const r = state.q[b.id]; if(r && r.miss) tally[CAT[b.c]] = (tally[CAT[b.c]]||0) + r.miss; });
  const top = Object.entries(tally).sort((a,b) => b[1]-a[1]).slice(0,6).map(([k,v]) => '<b>'+esc(k)+'</b> ('+v+')').join(", ");
  return '<div class="toolbar"><button class="btn" id="pdfBtn">Download PDF worksheet</button><button class="warnbtn" data-reset="errors">Clear error log</button><span class="hint" id="pdfMsg">'+items.length+(items.length===1?' question':' questions')+', sentences first, answer key with explanations after.</span></div>' +
    (top ? '<p class="chips">Rule areas you miss most, counting every miss: '+top+'.</p>' : '') +
    '<ul class="items">'+items.map(b => {
      const r = state.q[b.id];
      const wrong = r.wrong.length ? 'You wrote: '+r.wrong.map(w=>'<span class="w">'+esc(L(w))+'</span>').join(", ") : (r.shaky ? 'Marked as a guess' : 'Skipped');
      return '<li class="item"><p class="q">'+sentenceFilled(b)+'</p><div class="m"><span>'+wrong+'</span>'+(r.miss?'<span>Missed '+r.miss+(r.miss===1?' time':' times')+'</span>':'')+(r.lastMiss?'<span>last '+rel(r.lastMiss)+'</span>':'')+'<span>'+pips(r.streak)+' '+r.streak+' of '+need()+'</span>'+tag(b)+'<span class="tag">'+esc(CAT[b.c])+'</span></div>'+rule1(b)+(needWhy(b) ? '<p class="x">'+esc(b.x)+'</p>' : '')+'</li>';
    }).join("")+'</ul>';
}
function viewFixed(){
  const items = BANK.filter(b => state.q[b.id] && state.q[b.id].st==="fixed").sort((a,b) => state.q[b.id].fixedAt - state.q[a.id].fixedAt);
  if(!items.length) return emptyBlock("No fixed questions yet","A question lands here after you answer it correctly "+need()+" times in Fix errors. It then returns for rechecks after "+INT.join(", ")+" days.");
  return '<div class="toolbar"><button class="warnbtn" data-reset="fixed">Clear fixed list</button></div><ul class="items">'+items.map(b => {
    const r = state.q[b.id];
    const rc = r.due ? (r.due <= Date.now() ? '<span><b>Recheck due now</b></span>' : '<span>Next recheck '+fmtDate(r.due)+'</span>') : '<span>Mastered: all rechecks passed</span>';
    return '<li class="item"><p class="q">'+sentenceFilled(b)+'</p><div class="m"><span>Fixed '+fmtDate(r.fixedAt)+'</span>'+rc+(r.relapses?'<span>Slipped back '+r.relapses+'×</span>':'')+tag(b)+'<button class="link" data-reopen="'+b.id+'" style="min-height:0;padding:0">Move back to error log</button></div>'+rule1(b)+(needWhy(b) ? '<p class="x">'+esc(b.x)+'</p>' : '')+'</li>';
  }).join("")+'</ul>';
}
function viewInsights(){
  const cat = {}, lv = {};
  let answered = 0;
  for(const id in state.q){
    const r = state.q[id], b = BY[id]; if(!b) continue;
    answered++;
    [[cat,b.c],[lv,b.lv]].forEach(([o,k]) => { const x = o[k] = o[k] || {items:0, att:0, miss:0, open:0}; x.items++; x.att += r.att; x.miss += r.miss; if(r.st==="err") x.open++; });
  }
  if(!answered) return emptyBlock("Nothing to show yet","Answer some questions in Practice and this page will show which article rules you get right and which need work.",'<button class="btn" data-tab="practice">Go to Practice</button>');
  const acc = x => x && x.att ? Math.round((x.att - x.miss)/x.att*100) : null;
  let weakK = null, weakV = 101;
  Object.keys(CAT).forEach(k => { const x = cat[k]; if(x && x.att >= 5){ const a = acc(x); if(a < weakV){ weakV = a; weakK = k; } } });
  const row = (label, x, weak) => {
    const a = acc(x);
    return '<div class="bar-row"><div>'+label+'<small>'+(x ? x.att+' attempts, '+x.open+' open '+(x.open===1?'error':'errors') : 'not started')+'</small></div>' +
      '<div class="bar'+(weak?' weak':'')+'" role="img" aria-label="'+(a===null?'no data':a+' percent correct')+'"><i style="width:'+(a===null?0:a)+'%"></i></div><div class="num">'+(a===null?'–':a+'%')+'</div></div>';
  };
  let out = "";
  if(weakK && weakV < 100) out += '<div class="callout"><p><strong>Weakest area so far: '+esc(CAT[weakK])+'</strong> ('+weakV+'% correct). Practice stays random; this limits it to that area until you clear the filter.</p><button class="btn" data-focus="'+weakK+'">Drill this area</button></div>';
  else if(answered < 15) out += '<p class="section-note">A clearer picture appears after about 15 answers.</p>';
  out += '<section class="panel"><h2>By rule area</h2>' + Object.keys(CAT).map(k => row(esc(CAT[k]), cat[k], k===weakK && weakV<100)).join("") + '</section>';
  out += '<section class="panel"><h2>By level</h2>' + ["C","D","H"].map(k => row(LV[k], lv[k], false)).join("") + '</section>';
  if(state.mocks.length) out += '<section class="panel"><h2>Mock test scores</h2><p class="small" style="margin:0 0 8px">Last mock '+rel(state.mocks[state.mocks.length-1].ts)+'</p><ul class="hist">'+state.mocks.slice(-6).reverse().map(m => '<li>'+fmtDate(m.ts)+': <b>'+m.score+' of '+m.total+'</b> ('+Math.round(m.score/m.total*100)+'%)</li>').join("")+'</ul></section>';
  out += '<p class="small">Accuracy counts every attempt, including rechecks. A level or kind needs a few attempts before the percentage means much.</p>';
  return out;
}
function viewMock(){
  if(mock.phase === "start"){
    const sel = mock.style || state.settings.style;
    const hist = state.mocks.length ? '<ul class="hist" style="margin:14px 0 0">'+state.mocks.slice(-3).reverse().map(m => '<li>Last scores: '+fmtDate(m.ts)+', '+m.score+' of '+m.total+'</li>').join("")+'</ul>' : "";
    return '<section class="panel"><h2>Mock test</h2><p class="small">25 mixed questions: 12 common, 10 difficult and 3 of the hardest 50. No feedback until the end, then a score, a breakdown and every miss explained. Misses go into your error log. Level and focus settings do not apply here.</p>' +
      '<div class="row"><label for="mockStyleSel">Format</label><select id="mockStyleSel"><option value="choice"'+(sel==="choice"?" selected":"")+'>Choose from 4 options</option><option value="type"'+(sel==="type"?" selected":"")+'>Type the article</option></select></div>' +
      '<div class="actions" style="margin-top:6px"><button class="btn" id="startMock">Start mock test</button>'+(state.mocks.length?'<button class="warnbtn" data-reset="mocks">Clear saved scores</button>':'')+'</div>'+hist+'</section>';
  }
  if(mock.phase === "run"){ if(!cur || cur.mode !== "mock") mockCur(); return questionCard(); }
  const R = mock.result, pct = Math.round(R.score/R.total*100);
  const part = (o, names) => Object.keys(names).filter(k => o[k]).map(k => names[k]+' '+o[k].ok+'/'+o[k].n).join(" · ");
  return '<section class="panel"><h2>Mock test result</h2><p class="score">'+R.score+' / '+R.total+'</p><p class="small" style="margin-bottom:12px">'+pct+'% correct</p>' +
    '<p class="small">By level: '+part(R.byLv, LV)+'</p><p class="small">By area: '+part(R.byCat, CAT)+'</p>' +
    '<div class="actions" style="margin-top:6px"><button class="btn" id="againMock">Take another mock test</button>'+(R.missed.length?'<button class="link" data-tab="fix">Fix the '+R.missed.length+' misses</button>':'')+'</div></section>' +
    (R.missed.length ? '<ul class="items">'+R.missed.map(m => {
      const b = m.b, [pre, post] = b.q.split("___");
      const mark = (m.skipped || !m.typed) ? '<span class="slot bad solo"><ins>'+word(b.a[0], b.q)+'</ins></span>' : '<span class="slot bad"><del>'+word(m.typed, b.q)+'</del><ins>'+word(b.a[0], b.q)+'</ins></span>';
      return '<li class="item"><p class="q" style="line-height:2.1">'+esc(pre)+mark+esc(post)+'</p><div class="m">'+tag(b)+(b.a.length>1?'<span>Also accepted: '+b.a.slice(1).map(t => esc(L(t))).join(", ")+'</span>':'')+'</div>'+rule1(b)+(needWhy(b) ? '<p class="x">'+esc(b.x)+'</p>' : '')+'</li>';
    }).join("")+'</ul>' : '<p class="section-note">No misses. Nothing to add to the error log.</p>');
}

function viewInfo(){
  return '<section class="panel">' +
    '<h2>How the drill works</h2>' +
    '<p class="info-lead">Every question has one gap and the same four choices: <b>a</b>, <b>an</b>, <b>the</b> or <b>no article</b>.</p>' +
    '<div class="info-grid">' +
      '<div class="info-card"><h3>The question bank</h3><p>500 sentences across <strong>Common</strong>, <strong>Difficult</strong> and the <strong>Hardest 50</strong>, covering eleven rule areas, with the most weight on when to use no article at all: no article, a or an, mention and reference, generic and abstract nouns, countable and uncountable, unique things and superlatives, names and places, institutions and time, fixed phrases, quantity words, and advanced structures. Where British and American English differ, both answers are accepted.</p></div>' +
      '<div class="info-card"><h3>Answering</h3><p>Pick an option or press 1 to 4 for a, an, the, no article. When typing, enter a, an or the, or 0 or a dash for no article. Wrong answers are marked copy-editor style, and &empty; means no article belongs there. Difficult and Hardest items add a one-line rule right after the answer.</p></div>' +
      '<div class="info-card"><h3>Fix &amp; recover</h3><p>Miss one and it returns, sometimes in a different sentence that tests the same rule, until you type it right '+need()+' times. Then it comes back for rechecks at 3, 10 and 30 days before it counts as mastered.</p></div>' +
      '<div class="info-card"><h3>Insights &amp; mock test</h3><p>See which rule areas you miss most, drill the weakest one, and take a 25-question mock test with blind scoring. Your error log prints as a worksheet with an answer key.</p></div>' +
    '</div>' +
    '<div class="actions" style="margin-top:20px"><button class="btn" data-tab="practice">Start practice</button><button class="ghost" data-tab="mock">Take a mock test</button></div>' +
  '</section>';
}

function viewSettings(){
  const s = state.settings;
  const opt = (v, c, l) => '<option value="'+v+'"'+(String(c)===String(v)?' selected':'')+'>'+l+'</option>';
  const cnt = f => BANK.filter(f).length;
  return '<section class="panel"><h2>Settings</h2>' +
    '<div class="row"><label for="styleSel">Answer style in Practice</label><select id="styleSel">'+opt("choice",s.style,"Choose from 4 options")+opt("type",s.style,"Type the article")+'</select></div>' +
    '<div class="row"><label for="lvSel">Level</label><select id="lvSel">'+opt("all",s.level,"Mixed, all "+BANK.length)+opt("C",s.level,"Common only ("+cnt(b=>b.lv==="C")+")")+opt("D",s.level,"Difficult, includes the hardest 50 ("+cnt(b=>b.lv!=="C")+")")+opt("H",s.level,"Hardest 50 only")+'</select></div>' +
    '<div class="row"><label for="focusSel">Focus area</label><select id="focusSel">'+opt("all",s.focus,"All rule areas")+Object.keys(CAT).map(k=>opt(k,s.focus,CAT[k]+" ("+cnt(b=>b.c===k)+")")).join("")+'</select></div>' +
    '<div class="row"><label for="needSel">Fix an error after</label><select id="needSel">'+[2,3,4,5].map(k=>opt(k,s.need,k+" correct answers")).join("")+'</select></div>' +
    '<div class="row"><label for="resetChk">A miss resets the count</label><input type="checkbox" id="resetChk"'+(s.reset?' checked':'')+'> <span class="hint">On: the correct answers must come in a row.</span></div>' +
    '<p class="small">Questions always come in random order. Fix errors and rechecks always ask you to type the answer, whatever the style above, and they rotate through different sentences that test the same rule. Fixed items return for a recheck after '+INT.join(", ")+' days.</p>' +
    '<hr><p class="small">Your progress is saved in this browser and, when you are signed in, to your account.</p>' +
    '<div class="row"><button class="ghost" id="showBackup">'+(ui.backup?'Hide backup':'Show backup text')+'</button><button class="ghost" id="showRestore">'+(ui.restore?'Hide restore':'Restore from backup')+'</button></div>' +
    (ui.backup?'<textarea id="backupTxt" readonly aria-label="Backup text">'+esc(JSON.stringify(state))+'</textarea><div class="row"><button class="ghost" id="copyBackup">Copy backup</button></div>':'') +
    (ui.restore?'<textarea id="restoreTxt" placeholder="Paste backup text here" aria-label="Paste backup text"></textarea><div class="row"><button class="ghost" id="doRestore">Restore this backup</button><span class="hint" id="restoreMsg"></span></div>':'') +
    '<hr><h2 style="font-size:19px;margin-top:4px">Start over</h2><p class="small">Each button needs a second tap to confirm and only touches what it says. Tip: use Show backup text above first if you might want your progress back.</p>' + resetPanel() + '</section>';
}
function render(){
  const c = renderOverview();
  renderTabs(c);
  if(!cur && (tab==="practice" || tab==="fix")) cur = pickNext();
  if(tab==="practice") $("#main").innerHTML = viewPractice();
  else if(tab==="fix") $("#main").innerHTML = viewFix();
  else if(tab==="log") $("#main").innerHTML = viewLog();
  else if(tab==="fixed") $("#main").innerHTML = viewFixed();
  else if(tab==="insights") $("#main").innerHTML = viewInsights();
  else if(tab==="info") $("#main").innerHTML = viewInfo();
  else $("#main").innerHTML = viewMock();
  const sp = $("#settings"); sp.hidden = !ui.settings; sp.innerHTML = ui.settings ? viewSettings() : "";
  $("#btnSettings").setAttribute("aria-expanded", ui.settings);
  const _st = $("#remoteStatus") || $("#foot"); if(_st) _st.textContent = remote.status;
  const inp = $("#ans"), nb = $("#nextBtn");
  if(inp) inp.focus({preventScroll:true}); else if(nb) nb.focus({preventScroll:true});
}

/* ---------- PDF worksheet ---------- */

function pdfBytes(items, dateStr){
  const W = 595, H = 842, M = 56, CONTENT = W - 2*M;
  const pages = []; let page, y;
  const newPage = () => { page = []; pages.push(page); y = H - M; };
  const MAP = {"’":146,"‘":145,"“":147,"”":148,"–":150,"—":151,"…":133,"•":149};
  const enc = s => { let o = ""; for(const ch of String(s)){ let c = ch.codePointAt(0); if(MAP[ch]) c = MAP[ch]; else if(c > 255) c = 63; const x = String.fromCharCode(c); o += (x==="("||x===")"||x==="\\") ? "\\"+x : x; } return o; };
  const wrap = (s, size, indent) => {
    const max = Math.max(10, Math.floor((CONTENT - indent) / (size*0.54)));
    const words = String(s).split(/\s+/), lines = []; let line = "";
    for(const w of words){
      if((line + " " + w).trim().length > max){ if(line) lines.push(line); line = w; } else line = (line + " " + w).trim();
    }
    if(line) lines.push(line); return lines;
  };
  function put(s, o){
    o = o || {}; const size = o.size||11, bold = !!o.bold, indent = o.indent||0, gap = o.gap||0, first = o.first;
    const lines = wrap(s, size, indent), lh = size*1.5;
    lines.forEach((ln, i) => {
      if(y - lh < M + 20) newPage();
      y -= lh;
      const x = M + indent;
      if(i === 0 && first != null) page.push({x:M, y, size, bold, s:first});
      page.push({x, y, size, bold, s:ln});
    });
    y -= gap;
  }
  newPage();
  put("Article error log", {size:22, bold:true, gap:2});
  put(items.length + (items.length===1?" question":" questions") + " to practise" + (dateStr?(" · "+dateStr):""), {size:10.5, gap:10});
  put("Write a, an or the in each blank, or a dash (–) where no article is needed. The answer key, with a short explanation for each sentence, starts on a new page.", {size:10.5, gap:14});
  items.forEach((b, i) => put(b.q.replace("___","________"), {size:12.5, indent:26, first:(i+1)+".", gap:9}));
  newPage();
  put("Answer key", {size:20, bold:true, gap:10});
  items.forEach((b, i) => {
    const alts = b.a.slice(1);
    put(L(b.a[0]) + (alts.length ? "  (also: " + alts.map(L).join(", ") + ")" : ""), {size:11.5, bold:true, indent:26, first:(i+1)+"."});
    if(b.t) put("Rule: " + b.t, {size:10.5, indent:26});
    put(fillText(b.q, b.a[0]), {size:10.5, indent:26, gap: needWhy(b) ? 0 : 9});
    if(needWhy(b)) put(pdfIpa(b.x), {size:10.5, indent:26, gap:9});
  });
  const objs = [null];
  const nPages = pages.length, kids = [];
  const content = [];
  pages.forEach((pg, i) => {
    const foot = {x:W/2-30, y:M-18, size:9, bold:false, s:"Page "+(i+1)+" of "+nPages};
    const all = pg.concat([foot]);
    let st = ""; all.forEach(l => { st += "BT /"+(l.bold?"F2":"F1")+" "+l.size+" Tf "+l.x.toFixed(1)+" "+l.y.toFixed(1)+" Td ("+enc(l.s)+") Tj ET\n"; });
    content.push(st);
    kids.push((6 + 2*i) + " 0 R");
  });
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[2] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + nPages + " >>";
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>";
  objs[5] = null;
  pages.forEach((pg, i) => {
    objs[5 + 2*i] = "<< /Length " + content[i].length + " >>\nstream\n" + content[i] + "endstream";
    objs[6 + 2*i] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + (5 + 2*i) + " 0 R >>";
  });
  // content objects are numbered 5,7,9...; page objects 6,8,10...
  let out = "%PDF-1.4\n"; const offs = [];
  const total = 5 + 2*nPages;
  const objAt = n => n <= 4 ? objs[n] : objs[n];
  for(let n = 1; n < total; n++){ offs[n] = out.length; out += n + " 0 obj\n" + objAt(n) + "\nendobj\n"; }
  const xref = out.length;
  out += "xref\n0 " + total + "\n0000000000 65535 f \n";
  for(let n = 1; n < total; n++) out += String(offs[n]).padStart(10,"0") + " 00000 n \n";
  out += "trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  const bytes = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
}
async function downloadPdf(){
  const msg = $("#pdfMsg");
  const items = BANK.filter(b => state.q[b.id] && state.q[b.id].st==="err");
  if(!items.length){ msg.textContent = "The error log is empty."; return; }
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const filename = "articles-error-log-" + stamp + ".pdf";
  let bytes;
  try{ bytes = pdfBytes(items, d.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})); }
  catch(e){ msg.textContent = "Could not build the PDF."; return; }
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename, data:bytes}); msg.textContent = "PDF ready: " + filename; }
    catch(e){ msg.textContent = (e && e.code==="declined") ? "Download cancelled." : "This page could not save the file here."; }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    msg.textContent = "PDF ready: " + filename;
  }catch(e){ msg.textContent = "Your browser blocked the download."; }
}


/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-tab]"); if(!t) return;
  if(t.dataset.opt !== undefined){ if(cur && cur.options) submit(cur.options[+t.dataset.opt], false); return; }
  if(t.dataset.tab){ tab = t.dataset.tab; cur = null; reviewMode = false; render(); return; }
  if(t.dataset.reopen){ const r = state.q[t.dataset.reopen]; if(r){ r.st="err"; r.streak=0; r.lastMiss=Date.now(); delete r.due; delete r.stage; persist(); render(); } return; }
  if(t.dataset.focus){ state.settings.focus = t.dataset.focus; persist(); tab = "practice"; cur = null; reviewMode = false; render(); return; }
  if(t.dataset.clearfocus){ state.settings.focus = "all"; persist(); cur = null; render(); return; }
  if(t.dataset.act==="review"){ reviewMode = true; cur = null; render(); return; }
  if(t.dataset.act==="newq"){ reviewMode = false; cur = null; render(); return; }
  switch(t.id){
    case "btnSettings": ui.settings = !ui.settings; ui.confirmReset = false; render(); break;
    case "btnInfo": tab = "info"; cur = null; ui.settings = false; render(); break;
    case "check": { const i = $("#ans"); const v = i ? i.value : ""; if(norm(v)) submit(v,false); else if(i) i.focus(); break; }
    case "skip": submit("", true); break;
    case "nextBtn": next(); break;
    case "undo": undo(); break;
    case "guess": markGuess(); break;
    case "startMock": startMock(); break;
    case "againMock": mock = {phase:"start", style:mock.style}; cur = null; render(); break;
    case "pdfBtn": downloadPdf(); break;
    case "showBackup": ui.backup = !ui.backup; render(); break;
    case "showRestore": ui.restore = !ui.restore; render(); break;
    case "copyBackup": {
      const ta = $("#backupTxt"); ta.select();
      (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(()=>{t.textContent="Copied";}).catch(()=>{ try{document.execCommand("copy"); t.textContent="Copied";}catch(_){ t.textContent="Select and copy manually"; } });
      break; }
    case "doRestore": {
      const msg = $("#restoreMsg");
      try{
        const s = JSON.parse($("#restoreTxt").value.trim());
        if(!s || s.v!==1 || typeof s.q!=="object") throw 0;
        state = normalize(s); persist(); cur = null; ui.restore = false; render();
      }catch(_){ msg.textContent = "That text is not a valid backup."; }
      break; }
    case "resetAll":
      if(!ui.confirmReset){ ui.confirmReset = true; render(); }
      else { state = fresh(); persist(); cur = null; lastSnap = null; mock = {phase:"start", style:null}; ui = {settings:false,backup:false,restore:false,confirmReset:false}; render(); }
      break;
  }
});
document.addEventListener("change", e => {
  const id = e.target.id, s = state.settings;
  if(id==="mockStyleSel"){ mock.style = e.target.value; return; }
  if(id==="styleSel") s.style = e.target.value;
  else if(id==="lvSel") s.level = e.target.value;
  else if(id==="focusSel") s.focus = e.target.value;
  else if(id==="needSel") s.need = parseInt(e.target.value,10);
  else if(id==="resetChk") s.reset = e.target.checked;
  else return;
  persist(); cur = null; render();
});
document.addEventListener("keydown", e => {
  const tg = e.target;
  if(e.key==="Enter" && tg && tg.id==="ans"){ e.preventDefault(); const v = tg.value; if(norm(v)) submit(v,false); return; }
  if(cur && cur.phase==="ask" && cur.options && /^[1-4]$/.test(e.key) && !/INPUT|TEXTAREA|SELECT/.test(tg.tagName||"")){
    const o = cur.options[+e.key - 1]; if(o) submit(o,false);
  }
});
document.addEventListener("input", e => {
  if(e.target && e.target.id==="ans"){ e.target.style.width = Math.max(5.5, e.target.value.length + 2) + "ch"; }
});

/* ---------- light / dark toggle: follows the device until you choose, then remembers your choice ---------- */
const THEME_KEY = "articles-500-theme";
function themeNow(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t === "dark" || t === "light") return t;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function themePaint(){
  const b = document.getElementById("btnTheme"); if(!b) return;
  const dark = themeNow() === "dark";
  b.textContent = dark ? "Light mode" : "Dark mode";
  b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
function themeSet(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  themePaint();
}
document.addEventListener("click", e => { if(e.target.closest("#btnTheme")) themeSet(themeNow() === "dark" ? "light" : "dark"); });
themePaint();

/* ---------- resets: every button needs a second tap ---------- */
function resetCounts(){
  let ok = 0, err = 0, fixed = 0;
  for(const id in state.q){ const s = state.q[id].st; if(s==="ok") ok++; else if(s==="err") err++; else if(s==="fixed") fixed++; }
  return {ok, err, fixed};
}
function resetRow(kind, title, desc, label, enabled){
  return '<div class="reset-row"><p><b>'+title+'</b><span class="hint">'+desc+'</span></p><button class="warnbtn" data-reset="'+kind+'"'+(enabled?'':' disabled')+'>'+label+'</button></div>';
}
function resetPanel(){
  const c = resetCounts(), n = state.mocks.length;
  return resetRow("round","New practice round","Forget the "+c.ok+" questions you got right first time so they are asked again. Your error log and fixed list stay.","Start new round",c.ok>0) +
    resetRow("errors","Clear error log","Remove the "+c.err+" open errors. Those questions become unasked again.","Clear log",c.err>0) +
    resetRow("fixed","Clear fixed list","Remove the "+c.fixed+" fixed questions and their scheduled rechecks.","Clear list",c.fixed>0) +
    resetRow("mocks","Clear mock scores","Delete the "+n+" saved mock test "+(n===1?"score":"scores")+".","Clear scores",n>0) +
    resetRow("settings","Reset settings","Back to defaults: options, mixed level, all kinds, 3 correct answers to fix, a miss resets the count.","Reset settings",true) +
    resetRow("all","Erase everything","All answers, logs, fixed items, scores and settings. This cannot be undone.","Erase everything",true);
}
function doReset(kind){
  if(kind === "quitmock"){ mock = {phase:"start", style:mock.style}; cur = null; render(); return; }
  if(kind === "round"){ for(const id in state.q) if(state.q[id].st === "ok") delete state.q[id]; }
  else if(kind === "poolround"){ BANK.forEach(b => { const r = state.q[b.id]; if(r && r.st === "ok" && inLevel(b) && inFocus(b)) delete state.q[b.id]; }); }
  else if(kind === "errors"){ for(const id in state.q) if(state.q[id].st === "err") delete state.q[id]; }
  else if(kind === "fixed"){ for(const id in state.q) if(state.q[id].st === "fixed") delete state.q[id]; }
  else if(kind === "mocks"){ state.mocks = []; }
  else if(kind === "settings"){ state.settings = {...DEFAULTS}; }
  else if(kind === "all"){
    state = fresh(); mock = {phase:"start", style:null}; reviewMode = false;
    if(timer.on){ timer.base = 0; timer.startedAt = Date.now(); timerPaint(); }
  }
  lastSnap = null; cur = null; persist(); render();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-reset]"); if(!t || t.disabled) return;
  if(!t.dataset.armed){
    t.dataset.armed = "1"; t.dataset.label = t.textContent; t.textContent = "Tap again to confirm";
    setTimeout(() => { if(t.isConnected && t.dataset.armed){ delete t.dataset.armed; t.textContent = t.dataset.label; } }, 5000);
    return;
  }
  doReset(t.dataset.reset);
});

/* ---------- session timer: one stopwatch for the whole session, off by default ---------- */
const timer = {on:false, running:false, base:0, startedAt:0, tick:null};
const tElapsed = () => timer.base + (timer.running ? Date.now() - timer.startedAt : 0);
function fmtTime(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,"0");
  return (h ? h + ":" : "") + p(m) + ":" + p(x);
}
function timerPaint(){
  const bar = document.getElementById("timerBar"), btn = document.getElementById("btnTimer");
  bar.hidden = !timer.on;
  btn.setAttribute("aria-pressed", String(timer.on));
  btn.textContent = timer.on ? "Timer on" : "Timer";
  bar.classList.toggle("paused", timer.on && !timer.running);
  document.getElementById("timerNum").textContent = fmtTime(tElapsed());
  document.getElementById("timerPause").textContent = timer.running ? "Pause" : "Resume";
}
function timerSet(on){
  timer.on = on; timer.base = 0; timer.running = on; timer.startedAt = Date.now();
  clearInterval(timer.tick);
  if(on) timer.tick = setInterval(timerPaint, 250);
  timerPaint();
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.id === "btnTimer") timerSet(!timer.on);
  else if(t.id === "timerPause"){
    if(timer.running){ timer.base += Date.now() - timer.startedAt; timer.running = false; }
    else { timer.startedAt = Date.now(); timer.running = true; }
    timerPaint();
  }else if(t.id === "timerReset"){ timer.base = 0; timer.startedAt = Date.now(); timerPaint(); }
});

render();
</script>
