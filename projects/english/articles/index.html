<style>
:root{
  --paper:#EEF1F6; --card:#FFFFFF; --ink:#16213A; --ink2:#4B5775; --line:#D6DCE8;
  --red:#C41E3A; --redbg:#FCE9EC; --green:#0F7A5B; --greenbg:#E2F4EC; --mark:#FFE36B; --btn:#16213A; --btntext:#FFFFFF;
  --brand:#4D7C0F; --brand-bg:#F7FEE7; --brand-border:#BEF264; --brand-text:#FFFFFF;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1525; --card:#172038; --ink:#E9EDF7; --ink2:#9FAACB; --line:#2B3656;
    --red:#FF7487; --redbg:#3A1D28; --green:#52D0A5; --greenbg:#15332B; --mark:#6B5B00; --btn:#E9EDF7; --btntext:#0E1525;
  --brand:#A3E635; --brand-bg:#1A2E05; --brand-border:#4D7C0F; --brand-text:#0E1525;
    --brand:#A3E635; --brand-bg:#1A2E05; --brand-border:#4D7C0F; --brand-text:#0E1525;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1525; --card:#172038; --ink:#E9EDF7; --ink2:#9FAACB; --line:#2B3656;
  --red:#FF7487; --redbg:#3A1D28; --green:#52D0A5; --greenbg:#15332B; --mark:#6B5B00; --btn:#E9EDF7; --btntext:#0E1525;
  --brand:#A3E635; --brand-bg:#1A2E05; --brand-border:#4D7C0F; --brand-text:#0E1525;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink2)}
.ghost:hover{border-color:var(--ink2);color:var(--ink)}

/* progress strip */
.strip{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.strip i{display:block;height:100%}
.strip .s-ok{background:var(--ink2)} .strip .s-err{background:var(--red)} .strip .s-fix{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;font-size:14px;color:var(--ink2)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}

/* tabs */
nav.tabs{display:flex;gap:2px;margin:20px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--ink2);font-weight:500;white-space:nowrap;margin-bottom:-1px}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;line-height:22px;text-align:center}
.badge.green{background:var(--green)}
:root[data-theme="dark"] .badge{color:#0E1525}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0E1525}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

/* question card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px}
.meta{margin:0 0 18px;font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.sentence{font-family:var(--serif);font-size:clamp(25px,4.6vw,38px);line-height:1.95;margin:0;padding-top:6px;overflow-wrap:anywhere}
.slot{display:inline-block;position:relative;vertical-align:baseline;margin:0 .12em}
input.blank{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:3px solid var(--ink);border-radius:0;padding:0 .1em;width:5.5ch;min-width:4ch;max-width:100%;text-align:center;line-height:1.1;outline:none}
input.blank:focus{background:var(--mark);outline:none}
.slot.ok{color:var(--green);font-weight:500;border-bottom:3px solid var(--green);padding:0 .15em}
.slot.bad{padding:0 .15em;border-bottom:3px solid transparent}
.slot.bad del{color:var(--red);text-decoration:line-through;text-decoration-thickness:3px}
.slot.bad ins{position:absolute;left:50%;transform:translateX(-50%);top:-1.15em;font-size:.78em;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap;line-height:1}
.slot.bad ins::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:2px;border:5px solid transparent;border-top-color:var(--red);border-bottom:0}
.slot.bad.solo{border-bottom:3px dashed var(--red);min-width:3ch}
.slot.bad.solo ins{position:static;transform:none;font-size:1em;color:var(--ink)}
.slot.bad.solo ins::after{display:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.btn{background:var(--btn);color:var(--btntext);border:0;border-radius:9px;padding:11px 22px;font-weight:600;min-height:44px}
.btn:hover{opacity:.9}
.link{background:none;border:0;padding:8px 4px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.link:hover{color:var(--ink)}
.hint{font-size:14px;color:var(--ink2)}
.fb{margin-top:20px;padding:14px 16px;border-radius:10px;font-size:16px}
.fb.ok{background:var(--greenbg)} .fb.bad{background:var(--redbg)}
.fb p{margin:0 0 4px} .fb p:last-child{margin:0}
.fb strong{font-weight:700}
.pips{display:inline-flex;gap:5px;vertical-align:middle}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);background:transparent}
.pip.on{background:var(--green);border-color:var(--green)}
.celebrate{font-weight:600;color:var(--green)}

/* options + explanation */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:54px;font-size:19px;font-family:var(--serif)}
.opt:hover{border-color:var(--ink)}
.opt kbd{font:600 13px var(--sans);color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--card)}
.why{color:var(--ink);margin-top:6px}
.why span{color:var(--ink2)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:13px;color:var(--ink2)}
.tag.D{border-color:var(--ink2);color:var(--ink)}
.tag.H{background:var(--ink);border-color:var(--ink);color:var(--btntext)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 14px}
li.item .x{margin:6px 0 0;font-size:14px;color:var(--ink2)}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
/* reset buttons */
.reset-row{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 0 14px}
.reset-row p{margin:0;flex:1 1 260px}
.reset-row p b{display:block;font-weight:600}
.warnbtn{background:none;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:8px 14px;min-height:40px}
.warnbtn[disabled]{opacity:.45;cursor:default;border-color:var(--line);color:var(--ink2)}
.warnbtn[data-armed]{background:var(--red);color:var(--card)}
/* session timer */
.timerbar{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.timerbar[hidden]{display:none}
.timernum{font-family:var(--sans);font-weight:700;font-size:clamp(46px,12vw,76px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 22px}
.timerbar.paused .timernum{color:var(--ink2)}
.timerctl{display:flex;flex-direction:column;gap:6px}
.hdrbtns{display:flex;gap:8px}
.ghost[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--btntext)}
@media (max-width:520px){.timerctl{flex-direction:row;flex-wrap:wrap}}
/* insights + mock */
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 64px;gap:12px;align-items:center;margin:10px 0;font-size:15px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink2);border-radius:6px}
.bar.weak i{background:var(--red)}
.bar-row small{display:block;color:var(--ink2);font-size:13px}
.num{text-align:right;font-weight:600}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink)}
.score{font-family:var(--serif);font-size:60px;line-height:1;margin:4px 0 2px}
.callout{background:var(--redbg);border-radius:10px;padding:12px 16px;margin:0 0 18px}
.callout p{margin:0 0 8px}
.hist{margin:0;padding:0;list-style:none;font-size:15px;color:var(--ink2)}
@media (max-width:520px){.bar-row{grid-template-columns:1fr 56px}.bar-row .bar{grid-column:1/-1;order:3}}
/* lists */
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px 24px}
.empty h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 6px}
.empty p{margin:0 0 16px;color:var(--ink2);max-width:52ch}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
li.item .q{font-family:var(--serif);font-size:20px;line-height:1.5;margin:0 0 6px}
li.item .q b{color:var(--green);font-weight:600;border-bottom:2px solid var(--green)}
li.item .m{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:14px;color:var(--ink2)}
li.item .m .w{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.chips{margin:0 0 14px;font-size:14px;color:var(--ink2)}
.chips b{color:var(--ink)}
.section-note{margin:0 0 14px;color:var(--ink2);font-size:15px}

/* settings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.panel h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.row label{min-width:190px;font-weight:500}
select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.panel hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.danger{border:1px solid var(--red);color:var(--red);background:none;border-radius:8px;padding:8px 14px}
.small{font-size:14px;color:var(--ink2);margin:0 0 10px}
footer{margin-top:26px;font-size:13px;color:var(--ink2)}
@media (max-width:520px){.card{padding:20px 16px 18px}.wrap{padding:16px 12px 40px}.row label{min-width:100%}}
@media (prefers-reduced-motion:no-preference){.slot.bad ins{animation:drop .22s ease-out}@keyframes drop{from{opacity:0;top:-.6em}to{opacity:1;top:-1.15em}}}

/* info / how it works */
.info-lead{font-family:var(--serif);font-size:18px;line-height:1.6;margin:0 0 18px;color:var(--ink)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
.info-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.info-card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 8px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px}
.info-card h3 .pill-tag{font-family:var(--sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--ink)}
.info-card p{font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 8px}
.info-card p:last-child{margin-bottom:0}
.info-card ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink2);line-height:1.6}
.info-card li{margin-bottom:6px}
.info-card li:last-child{margin-bottom:0}
.info-card strong{color:var(--ink)}

/* suite switcher */
.suite-bar{background:var(--paper);border-bottom:1px solid var(--line);padding:8px 18px;margin:-20px -18px 20px}
.suite-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.suite-brand{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.suite-brand::before{content:"←";font-family:var(--sans);font-weight:400;color:var(--ink2);margin-right:2px}
.suite-brand .suite-full{font-family:var(--serif);font-weight:400;font-size:14px;color:var(--ink2)}
@media (max-width:620px){.suite-brand .suite-full{display:none}}
.suite-links{display:flex;gap:4px;overflow-x:auto}
.suite-link{font-size:12px;font-family:var(--sans);font-weight:500;color:var(--ink2);text-decoration:none;padding:4px 10px;border-radius:6px;white-space:nowrap;transition:all .15s}
.suite-link:hover{color:var(--ink);background:var(--card)}
.suite-link.is-active{color:var(--ink);background:var(--card);font-weight:600}

/* series kicker */
.series-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.series-tag .kicker-pill{color:var(--ink2);font-weight:600;font-size:11px}
.series-tag .series-sep{color:var(--line);font-size:11px}
.series-tag .series-disc{font-weight:500;color:var(--ink2)}

/* ===== bolder modernization: amplify the existing identity ===== */
h1{font-weight:600;font-size:clamp(30px,5vw,42px);letter-spacing:-.025em;line-height:1.04;text-wrap:balance}
.series-tag .kicker-pill{color:var(--brand);font-weight:700;letter-spacing:.09em}
nav.tabs{gap:4px}
nav.tabs button{transition:color .18s ease,border-color .18s ease;font-size:15px}
nav.tabs button[aria-current="true"]{border-bottom-color:var(--brand);border-bottom-width:3px;color:var(--ink);font-weight:700}
nav.tabs button:hover:not([aria-current="true"]){color:var(--ink)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 48px -30px rgba(0,0,0,.6)}
.panel h2{font-weight:600}
.btn{transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .18s ease,opacity .16s ease;box-shadow:0 2px 10px -4px rgba(0,0,0,.3);letter-spacing:.01em}
.btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 11px 24px -9px rgba(0,0,0,.45)}
.btn:active{transform:translateY(0);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.ghost{transition:border-color .16s ease,color .16s ease,background .16s ease}
.opt{transition:border-color .16s ease,background .16s ease,transform .16s ease}
.opt:hover:not([disabled]){border-color:var(--brand);transform:translateY(-1px)}
li.item{transition:border-color .16s ease,transform .16s ease}
li.item:hover{border-color:var(--ink2)}
.suite-link{transition:color .15s ease,background .15s ease}
.score{color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* articles: the empty-set mark for "no article" */
.zero{font-family:var(--sans);font-weight:700;color:var(--green);font-size:.82em;padding:0 .12em}
li.item .q b.zero{border-bottom:0}
.slot.bad del .zero{color:inherit}
.slot.bad ins .zero{color:var(--green)}
.typehint{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.rule1{font-weight:600;color:var(--ink)}
.rule1 span{color:var(--brand);font-weight:700}
li.item .rule1{font-size:15px;margin:4px 0 2px}
</style>
</head>

<script>
const BANK = [{"id":"AR001","lv":"C","c":"Z","p":"kind-of","q":"What kind of ___ phone do you have?","a":["-"],"x":"After \"kind of\", \"sort of\" and \"type of\", a singular countable noun takes no article. Common slip: \"What kind of a phone\"."},{"id":"AR002","lv":"C","c":"Z","p":"kind-of","q":"A dolphin is a kind of ___ mammal, not a fish.","a":["-"],"x":"The article goes before \"kind\", not after \"of\": \"a kind of mammal\". Common slip: \"a kind of a mammal\"."},{"id":"AR003","lv":"C","c":"Z","p":"noun-number","q":"Our flight leaves from ___ Gate 14 in about an hour.","a":["-"],"x":"A noun followed by the number or letter that identifies it takes no article: Gate 14, Room 302, page 45, Platform 2."},{"id":"AR004","lv":"C","c":"Z","p":"noun-number","q":"Please turn to ___ page 45 of your textbook.","a":["-"],"x":"\"Page + number\" takes no article. Common slip: \"the page 45\"."},{"id":"AR005","lv":"C","c":"Z","p":"noun-number","q":"The interview will be held in ___ Room 302 on the third floor.","a":["-"],"x":"\"Room + number\" works like a name: no article."},{"id":"AR006","lv":"C","c":"Z","p":"noun-number","q":"My cousin lives in ___ Flat 4B, just above the pharmacy.","a":["-"],"x":"\"Flat / Apartment + number\" takes no article."},{"id":"AR007","lv":"C","c":"Z","p":"disease","q":"My grandmother has ___ diabetes, so she watches her sugar intake.","a":["-"],"x":"Most named diseases take no article: diabetes, cancer, malaria, asthma. Compare \"a cold\" and \"a headache\", which are countable."},{"id":"AR008","lv":"C","c":"Z","p":"disease","q":"Thousands of children still die of ___ malaria every year.","a":["-"],"x":"Named diseases are uncountable: \"malaria\", not \"the malaria\"."},{"id":"AR009","lv":"C","c":"Z","p":"most-general","q":"___ most people in my village grow rice for a living.","a":["-"],"x":"\"Most + plural noun\" in a general sense takes no article. Common slip: \"The most people\"."},{"id":"AR010","lv":"C","c":"Z","p":"by-means","q":"I sent you the documents by ___ email this morning.","a":["-"],"x":"\"By + a means of communication or transport\" takes no article: by email, by post, by phone, by car."},{"id":"AR011","lv":"C","c":"Z","p":"by-means","q":"Most of the aid arrived by ___ air because the roads were flooded.","a":["-"],"x":"\"By air / by sea / by road / by rail\": no article."},{"id":"AR012","lv":"C","c":"Z","p":"media","q":"Is there anything good on ___ TV tonight?","a":["-"],"x":"\"On TV / on television\" takes no article. Compare \"on the radio\"."},{"id":"AR013","lv":"C","c":"Z","p":"fx-zero","q":"He's been in ___ love with her since they were at school.","a":["-"],"x":"\"In love\" has no article."},{"id":"AR014","lv":"C","c":"Z","p":"fx-zero","q":"You can pay in ___ cash or by card.","a":["-"],"x":"\"In cash\" and \"by card\" take no article."},{"id":"AR015","lv":"C","c":"Z","p":"fx-zero","q":"She signed the contract in ___ person instead of online.","a":["-"],"x":"\"In person\" (physically present) has no article."},{"id":"AR016","lv":"C","c":"Z","p":"unc-general","q":"The old bridge is now closed to ___ traffic.","a":["-"],"x":"\"Traffic\" in a general sense: no article."},{"id":"AR017","lv":"C","c":"Z","p":"fx-zero","q":"The house on the corner has been for ___ sale for months.","a":["-"],"x":"\"For sale\" (available to buy) has no article. Compare \"on sale\" (reduced in price)."},{"id":"AR018","lv":"C","c":"Z","p":"meals","q":"___ dinner is ready! Come and sit down.","a":["-"],"x":"Meals take no article in everyday use: \"Dinner is ready\", \"after lunch\"."},{"id":"AR019","lv":"C","c":"Z","p":"language","q":"My sister speaks fluent ___ Arabic.","a":["-"],"x":"Names of languages take no article."},{"id":"AR020","lv":"C","c":"Z","p":"company-zero","q":"We first met on ___ Facebook, years before we met in person.","a":["-"],"x":"Names of websites, apps and companies take no article."},{"id":"AR021","lv":"C","c":"Z","p":"meals","q":"___ breakfast is the most important meal of the day, or so they say.","a":["-"],"x":"A meal in general: no article."},{"id":"AR022","lv":"C","c":"Z","p":"home","q":"It started to rain, so we went ___ home early.","a":["-"],"x":"\"Go / come / get home\" takes no article and no \"to\". Common slip: \"went to the home\"."},{"id":"AR023","lv":"C","c":"Z","p":"fx-zero","q":"In ___ general, people here are friendly and helpful.","a":["-"],"x":"\"In general\" has no article."},{"id":"AR024","lv":"C","c":"Z","p":"food-zero","q":"We had ___ fish and chips on the beach.","a":["-"],"x":"Food and dishes in general are uncountable: \"fish and chips\", not \"a fish and chips\"."},{"id":"AR025","lv":"C","c":"Z","p":"games","q":"He plays ___ chess with his grandfather every Friday.","a":["-"],"x":"Games take no article. (\"A game of chess\" is countable.)"},{"id":"AR026","lv":"C","c":"Z","p":"fx-zero","q":"By the end of the film, everyone was in ___ tears.","a":["-"],"x":"\"In tears\" (crying) has no article."},{"id":"AR027","lv":"C","c":"Z","p":"fx-zero","q":"The lift is out of ___ order, so please take the stairs.","a":["-"],"x":"\"Out of order\" (not working) has no article."},{"id":"AR028","lv":"C","c":"Z","p":"fx-zero","q":"Children must be with an adult at ___ all times.","a":["-"],"x":"\"At all times\" has no article."},{"id":"AR029","lv":"D","c":"Z","p":"turn-role","q":"He turned ___ traitor and sold the plans to the enemy.","a":["-"],"x":"\"Turn + role noun\" (turn traitor, turn professional) takes no article.","t":"\"Turn traitor\": the role noun takes no article."},{"id":"AR030","lv":"D","c":"Z","p":"pairs","q":"___ husband and wife both work at the same hospital.","a":["-"],"x":"In fixed pairs (husband and wife, mother and child, teacher and student) the article is often dropped.","t":"Fixed noun pairs like \"husband and wife\" drop the article."},{"id":"AR031","lv":"D","c":"Z","p":"pairs","q":"They walked along the beach arm in ___ arm.","a":["-"],"x":"Repeated-noun phrases (arm in arm, hand in hand, side by side, face to face) take no article.","t":"Repeated-noun pairs like \"arm in arm\": no article."},{"id":"AR032","lv":"D","c":"Z","p":"pairs","q":"Day after ___ day, she practised the same three songs.","a":["-"],"x":"\"Day after day\", \"year after year\", \"step by step\": no article.","t":"\"Day after day\": repeated nouns, no article."},{"id":"AR033","lv":"D","c":"Z","p":"roles","q":"She was promoted to ___ head of sales last year.","a":["-"],"x":"After \"promote to\", \"appoint\" or \"elect\", a unique role takes no article.","t":"\"Promoted to head of sales\": unique role, no article."},{"id":"AR034","lv":"D","c":"Z","p":"fx-zero","q":"The family is in ___ danger of losing their home.","a":["-"],"x":"\"In danger (of)\" has no article.","t":"\"In danger of\": no article."},{"id":"AR035","lv":"D","c":"Z","p":"fx-zero","q":"The new hospital wing is still under ___ construction.","a":["-"],"x":"\"Under construction / under pressure / under control\": no article.","t":"\"Under construction\": no article."},{"id":"AR036","lv":"D","c":"Z","p":"fx-zero","q":"The two countries have been at ___ war for over a year.","a":["-"],"x":"\"At war / at peace\" has no article.","t":"\"At war\": no article."},{"id":"AR037","lv":"H","c":"Z","p":"space","q":"In ___ space, there is no air to carry sound.","a":["-"],"x":"\"Space\" meaning the universe beyond Earth takes no article. \"The space\" means a particular gap or area. Common slip: \"in the space\".","t":"Outer space: no article. \"The space\" is a gap."},{"id":"AR038","lv":"H","c":"Z","p":"pairs","q":"She went from ___ rags to riches in less than ten years.","a":["-"],"x":"\"From rags to riches\" is a fixed phrase with no article.","t":"\"From rags to riches\": fixed, no article."},{"id":"AR039","lv":"C","c":"S","p":"h-silent","q":"It took us ___ hour to find a parking space near the stadium.","a":["an"],"x":"Use \"an\" before a vowel SOUND, not a vowel letter. The h in \"hour\" is silent, so the word begins with /aʊ/. Common slip: \"a hour\"."},{"id":"AR040","lv":"C","c":"S","p":"h-silent","q":"She is ___ honest person, so I believe every word she says.","a":["an"],"x":"The h in \"honest\" is silent, so the word starts with a vowel sound: \"an honest\"."},{"id":"AR041","lv":"C","c":"S","p":"h-silent","q":"It's ___ honour to be invited to speak at your graduation.","a":["an"],"x":"\"Honour\" begins with a silent h, so it takes \"an\". The same goes for \"honourable\" and \"honorary\"."},{"id":"AR042","lv":"C","c":"S","p":"u-yoo","q":"My cousin wants to study at ___ university in Canada next year.","a":["a"],"x":"\"University\" begins with a /j/ (y) sound, which is a consonant sound, so it takes \"a\". Common slip: \"an university\"."},{"id":"AR043","lv":"C","c":"S","p":"u-yoo","q":"There's ___ useful app that helps you plan your weekly budget.","a":["a"],"x":"\"Useful\" is pronounced /ˈjuːs-/, starting with a y-sound, so use \"a\"."},{"id":"AR044","lv":"C","c":"S","p":"u-vowel","q":"I left ___ umbrella on the train this morning.","a":["an"],"x":"\"Umbrella\" begins with the vowel sound /ʌ/, so it takes \"an\"."},{"id":"AR045","lv":"C","c":"S","p":"u-vowel","q":"He told us ___ unusual story about his grandfather's journey from Sylhet to London.","a":["an"],"x":"\"Unusual\" starts with /ʌn/, a vowel sound, so \"an\". Compare \"a useful\", where the u is pronounced /juː/."},{"id":"AR046","lv":"C","c":"S","p":"u-vowel","q":"It was ___ uphill climb all the way to the top of the tea garden.","a":["an"],"x":"\"Uphill\" starts with /ʌ/, a vowel sound, so \"an\"."},{"id":"AR047","lv":"C","c":"S","p":"eu","q":"She holds ___ European passport, so she can work anywhere in the EU.","a":["a"],"x":"\"European\" begins with /jʊə/, a y-sound. Words starting with \"eu\" take \"a\": a European, a euro, a eulogy."},{"id":"AR048","lv":"C","c":"S","p":"one-w","q":"I'd like ___ one-way ticket to Chittagong, please.","a":["a"],"x":"\"One\" is pronounced /wʌn/, beginning with a w-sound, which is a consonant sound. So: \"a one-way ticket\", not \"an\"."},{"id":"AR049","lv":"C","c":"S","p":"h-sounded","q":"We stayed in ___ hotel overlooking the harbour.","a":["a"],"x":"The h in \"hotel\" is pronounced, so it takes \"a\". (\"An hotel\" is an old-fashioned form you may still see in older British writing.)"},{"id":"AR050","lv":"C","c":"S","p":"number-vowel","q":"We were exhausted after ___ eight-hour flight from Dhaka.","a":["an"],"x":"Read the number aloud: \"eight\" begins with /eɪ/, a vowel sound, so \"an eight-hour flight\"."},{"id":"AR051","lv":"C","c":"S","p":"y-sound","q":"I met him ___ year ago at a friend's wedding.","a":["a"],"x":"\"Year\" begins with the consonant sound /j/, so it takes \"a\"."},{"id":"AR052","lv":"C","c":"S","p":"abbr-vowel","q":"Is there ___ ATM anywhere near the station?","a":["an"],"x":"With letter abbreviations, follow how the first letter is SAID. \"A\" is said /eɪ/, a vowel sound: \"an ATM\"."},{"id":"AR053","lv":"D","c":"S","p":"h-silent","q":"As the eldest son, he was ___ heir to the family's tea estate.","a":["an"],"x":"The h in \"heir\" is silent (it sounds like \"air\"), so it takes \"an\".","t":"Silent h, so a vowel sound: an heir."},{"id":"AR054","lv":"D","c":"S","p":"h-variety","q":"She added ___ herb from the garden to the soup.","a":["a","an"],"x":"British speakers pronounce the h in \"herb\" (a herb); most American speakers drop it (an herb). Both are correct for their variety.","t":"UK says the h (a herb); US drops it (an herb)."},{"id":"AR055","lv":"D","c":"S","p":"h-variety","q":"The signing of the peace agreement was ___ historic moment for both countries.","a":["a","an"],"x":"\"A historic\" is standard today because the h is pronounced. \"An historic\" is a traditional British form some writers still use. Both are accepted.","t":"The h is pronounced, so a; \"an historic\" is old British style."},{"id":"AR056","lv":"D","c":"S","p":"abbr-vowel","q":"She completed ___ MBA at a business school in Singapore.","a":["an"],"x":"\"MBA\" is read letter by letter, and \"M\" is said /em/, which starts with a vowel sound: \"an MBA\".","t":"M is said \"em\", a vowel sound: an MBA."},{"id":"AR057","lv":"D","c":"S","p":"abbr-vowel","q":"The man claiming to be ___ FBI agent turned out to be a fraud.","a":["an"],"x":"\"F\" is pronounced /ef/, a vowel sound, so \"an FBI agent\". Judge by sound, not by the letter.","t":"F is said \"ef\", a vowel sound: an FBI agent."},{"id":"AR058","lv":"D","c":"S","p":"abbr-cons","q":"He insists that he saw ___ UFO over the paddy fields last night.","a":["a"],"x":"\"U\" is said /juː/, beginning with a y-sound, so \"a UFO\".","t":"U is said \"you\", a consonant sound: a UFO."},{"id":"AR059","lv":"D","c":"S","p":"abbr-cons","q":"Copy ___ URL from your browser and paste it into the form.","a":["a"],"x":"\"URL\" is read as \"you-are-el\", starting with /j/, so it takes \"a\".","t":"URL is said \"you-are-el\": a URL."},{"id":"AR060","lv":"D","c":"S","p":"abbr-vowel","q":"After graduating, she joined ___ NGO working on clean water in rural areas.","a":["an"],"x":"\"N\" is said /en/, beginning with a vowel sound: \"an NGO\".","t":"N is said \"en\", a vowel sound: an NGO."},{"id":"AR061","lv":"D","c":"S","p":"abbr-vowel","q":"The doctor sent him for ___ X-ray to check whether his wrist was broken.","a":["an"],"x":"The letter X is said /eks/, starting with a vowel sound: \"an X-ray\".","t":"X is said \"eks\", a vowel sound: an X-ray."},{"id":"AR062","lv":"D","c":"S","p":"u-yoo","q":"After three hours of discussion, the jury reached ___ unanimous verdict.","a":["a"],"x":"\"Unanimous\" is pronounced /juːˈnæn-/, so it begins with a y-sound and takes \"a\", even though \"un-\" usually sounds like /ʌn/.","t":"\"Unanimous\" starts with a \"you\" sound: a."},{"id":"AR063","lv":"D","c":"S","p":"eu","q":"\"Passed away\" is ___ euphemism for \"died\".","a":["a"],"x":"\"Euphemism\" begins with /juː/, a consonant sound: \"a euphemism\".","t":"\"Eu-\" sounds like \"you\": a euphemism."},{"id":"AR064","lv":"D","c":"S","p":"one-w","q":"The bonus was ___ one-off payment, so don't expect it again next year.","a":["a"],"x":"\"One\" starts with a /w/ sound: \"a one-off\".","t":"\"One\" starts with a w-sound: a one-off."},{"id":"AR065","lv":"D","c":"S","p":"abbr-vowel","q":"They hired ___ SUV for the trip through the hills.","a":["an"],"x":"\"S\" is said /es/, a vowel sound, so \"an SUV\".","t":"S is said \"es\", a vowel sound: an SUV."},{"id":"AR066","lv":"D","c":"S","p":"u-yoo","q":"The novel imagines ___ utopian society in which nobody owns property.","a":["a"],"x":"\"Utopian\" begins with /juː/, a consonant sound: \"a utopian society\".","t":"\"Utopian\" starts with a \"you\" sound: a."},{"id":"AR067","lv":"H","c":"S","p":"number-vowel","q":"They restored ___ 18th-century mansion on the edge of the old city.","a":["an"],"x":"Read \"18th\" aloud as \"eighteenth\": it begins with a vowel sound, so it takes \"an\". Writers often slip by looking at the digit \"1\".","t":"Say it aloud: \"eighteenth\" starts with a vowel sound."},{"id":"AR068","lv":"H","c":"S","p":"abbr-variety","q":"The database returned ___ SQL error when we ran the query.","a":["an","a"],"x":"It depends on pronunciation. Said letter by letter (\"ess-cue-el\"), it takes \"an\"; said as \"sequel\", it takes \"a\". Both are accepted.","t":"Letter by letter: an SQL. Said as \"sequel\": a SQL."},{"id":"AR069","lv":"H","c":"S","p":"eu","q":"The farmer sold ___ ewe and two lambs at the market.","a":["a"],"x":"\"Ewe\" (a female sheep) is pronounced /juː/, exactly like \"you\", so it takes \"a\".","t":"\"Ewe\" is said \"you\": a ewe."},{"id":"AR070","lv":"H","c":"S","p":"letter-name","q":"You've written ___ \"h\" where you meant to write an \"n\".","a":["an","a"],"x":"Most speakers call the letter \"aitch\", which begins with a vowel sound, so \"an h\". Speakers who say \"haitch\" use \"a\". Both are accepted.","t":"Said \"aitch\": an h. Said \"haitch\": a h."},{"id":"AR071","lv":"C","c":"M","p":"first-mention","q":"I bought ___ new laptop last week, and I'm already regretting it.","a":["a"],"x":"First mention of one laptop among many: use \"a\". Common slip: \"I bought new laptop\"."},{"id":"AR072","lv":"C","c":"M","p":"associative","q":"I bought a new laptop last week, but ___ screen is already cracked.","a":["the"],"x":"\"The screen\" means the screen of that laptop. Once something is mentioned, its parts are known and take \"the\"."},{"id":"AR073","lv":"C","c":"M","p":"associative","q":"We watched a horror film last night, but ___ ending was so silly that we laughed.","a":["the"],"x":"A film has one ending, so after mentioning the film, \"the ending\" is understood."},{"id":"AR074","lv":"C","c":"M","p":"first-mention","q":"There's ___ man at the door asking for you.","a":["a"],"x":"The man has not been identified for the listener, so use \"a\"."},{"id":"AR075","lv":"C","c":"M","p":"situation","q":"Could you close ___ window? It's freezing in here.","a":["the"],"x":"Both speakers can see which window is meant, so \"the\". The situation alone can make something specific."},{"id":"AR076","lv":"C","c":"M","p":"second-mention","q":"I had a sandwich and an apple for lunch, but ___ sandwich was stale.","a":["the"],"x":"Second mention: the sandwich already introduced takes \"the\"."},{"id":"AR077","lv":"C","c":"M","p":"first-mention","q":"She grew up in ___ small village on the edge of the Sundarbans.","a":["a"],"x":"First mention of one village among many: \"a\"."},{"id":"AR078","lv":"C","c":"M","p":"first-mention","q":"On the train home, I met ___ interesting woman who used to be a pilot.","a":["an"],"x":"First mention, and \"interesting\" begins with a vowel sound: \"an\"."},{"id":"AR079","lv":"C","c":"M","p":"second-mention","q":"I met an interesting woman on the train. ___ woman turned out to be my new manager.","a":["the"],"x":"Second mention: now the listener knows which woman, so \"the\"."},{"id":"AR080","lv":"C","c":"M","p":"associative","q":"We stayed at a lovely guest house in Srimangal, and ___ owner cooked for us every night.","a":["the"],"x":"The guest house has an owner, so once it is mentioned, \"the owner\" is understood."},{"id":"AR081","lv":"C","c":"M","p":"existential","q":"Is there ___ pharmacy near here?","a":["a"],"x":"\"Is there a ...?\" asks about something not yet identified: use \"a\". Common slip: \"Is there the pharmacy\"."},{"id":"AR082","lv":"C","c":"M","p":"existential","q":"There was ___ accident on the highway, so we were two hours late.","a":["an"],"x":"\"There was / There is\" introduces new information: \"an accident\"."},{"id":"AR083","lv":"C","c":"M","p":"defined","q":"Who is ___ woman standing next to your father?","a":["the"],"x":"The phrase \"standing next to your father\" points to one specific woman: \"the\"."},{"id":"AR084","lv":"C","c":"M","p":"nonspecific","q":"I'm looking for ___ job with flexible hours.","a":["a"],"x":"Any job of that kind, not a particular one: \"a\"."},{"id":"AR085","lv":"C","c":"M","p":"first-mention","q":"Our neighbours have ___ dog that barks all night.","a":["a"],"x":"First mention. A relative clause does not automatically make a noun specific: \"a dog that barks\"."},{"id":"AR086","lv":"C","c":"M","p":"defined","q":"Sorry, I didn't catch ___ name of the street you mentioned.","a":["the"],"x":"\"Of the street\" identifies which name: \"the name of\"."},{"id":"AR087","lv":"C","c":"M","p":"defined","q":"Let's meet at ___ café where we first met.","a":["the"],"x":"The relative clause identifies one particular café: \"the café where\"."},{"id":"AR088","lv":"D","c":"M","p":"nonspecific","q":"She's looking for ___ flat near her office, but she hasn't found one yet.","a":["a"],"x":"\"Hasn't found one yet\" shows she means any suitable flat, not a particular one: \"a\".","t":"Any flat, not a particular one: a."},{"id":"AR089","lv":"D","c":"M","p":"defined","q":"She wanted to rent ___ flat she saw on Monday, but by Wednesday it had already been let.","a":["the"],"x":"\"She saw on Monday\" and \"it\" point to one known flat: \"the\".","t":"The flat she saw: one known flat, so the."},{"id":"AR090","lv":"D","c":"M","p":"nonspecific","q":"My car broke down on the way to the airport, so I had to take ___ taxi.","a":["a"],"x":"Any taxi, not a particular one: \"a\".","t":"Any taxi will do: a."},{"id":"AR091","lv":"D","c":"M","p":"defined","q":"I've just read ___ article you sent me, and I completely agree with it.","a":["the"],"x":"\"You sent me\" identifies a specific article both speakers know: \"the\".","t":"The one you sent me: the."},{"id":"AR092","lv":"D","c":"M","p":"defined","q":"He's ___ man I told you about, the one who fixed my car for free.","a":["the"],"x":"The relative clause identifies a specific person both speakers have discussed: \"the\".","t":"The one I told you about: the."},{"id":"AR093","lv":"D","c":"M","p":"classify-clause","q":"He's ___ man you can trust completely, so don't worry about the money.","a":["a"],"x":"Here the clause describes what kind of man he is (one of the class of trustworthy people), not which man. Describing clauses take \"a\".","t":"Describes a type of man, not which man: a."},{"id":"AR094","lv":"D","c":"M","p":"situation","q":"When we finally got to the station, ___ train had already left.","a":["the"],"x":"\"The train\" is the one we planned to catch, clear from context.","t":"The train we meant to catch: the."},{"id":"AR095","lv":"D","c":"M","p":"second-mention","q":"They have two children, a boy and a girl. ___ boy is nine and the girl is six.","a":["the"],"x":"Both children have been introduced, so \"the boy\".","t":"Already introduced: the boy."},{"id":"AR096","lv":"D","c":"M","p":"nonspecific","q":"Have you got ___ minute? I need to talk to you about the budget.","a":["a"],"x":"A short, unspecified amount of time: \"a minute\". Common slip: \"Have you got the minute?\"","t":"Any short time: a minute."},{"id":"AR097","lv":"D","c":"M","p":"second-mention","q":"A man and a woman walked into the shop. ___ man asked for directions, while the woman looked at the shelves.","a":["the"],"x":"Second mention of the man: \"the\".","t":"Second mention: the man."},{"id":"AR098","lv":"D","c":"M","p":"existential","q":"There's ___ letter for you on the kitchen table.","a":["a"],"x":"New information introduced with \"there's\": \"a letter\". (The table is known, so \"the kitchen table\".)","t":"There's + something new: a."},{"id":"AR099","lv":"D","c":"M","p":"associative","q":"We went to a wedding in Comilla on Saturday, and ___ bride wore a deep red sari.","a":["the"],"x":"A wedding has a bride, so after mentioning the wedding, \"the bride\" is understood.","t":"A wedding has one bride: the."},{"id":"AR100","lv":"D","c":"M","p":"nonspecific","q":"I don't have ___ car, so I cycle everywhere.","a":["a"],"x":"In negatives, a singular countable noun still needs an article: \"I don't have a car\". Common slip: \"I don't have car.\"","t":"A singular countable noun needs a/an, even in negatives."},{"id":"AR101","lv":"D","c":"M","p":"first-mention","q":"A tourist asked me to take ___ photo of her family in front of the fountain.","a":["a"],"x":"First mention, one unidentified photo: \"a\".","t":"First mention, one photo: a."},{"id":"AR102","lv":"D","c":"M","p":"associative","q":"I tried to open the jar of pickle, but ___ lid was stuck.","a":["the"],"x":"A jar has a lid; once the jar is mentioned, \"the lid\" is understood.","t":"The jar's lid, known once the jar is mentioned: the."},{"id":"AR103","lv":"D","c":"M","p":"nonspecific","q":"I'd like to make ___ complaint about the service in this restaurant.","a":["a"],"x":"An unspecified complaint, being introduced now: \"a\".","t":"A new, unspecified complaint: a."},{"id":"AR104","lv":"H","c":"M","p":"existential","q":"I'm afraid there isn't ___ easy answer to that question, and anyone who says otherwise is selling something.","a":["an"],"x":"\"There isn't + a/an\" denies that any such thing exists: \"an easy answer\". Learners often wrongly write \"the easy answer\".","t":"There isn't + any such thing: an."},{"id":"AR105","lv":"H","c":"M","p":"first-mention","q":"She married ___ Norwegian she met while skiing, and they now live just outside Oslo.","a":["a"],"x":"\"Norwegian\" here is a countable noun for a person, introduced for the first time: \"a Norwegian\".","t":"One person of that nationality, first mention: a."},{"id":"AR106","lv":"H","c":"M","p":"classify-clause","q":"\"I've just watched ___ film you recommended.\" \"Which one? I recommended three.\"","a":["a"],"x":"There were three recommended films, so \"a film you recommended\" means one of them. A relative clause does not force \"the\" if it doesn't single out one thing.","t":"One of three you recommended: a, not the."},{"id":"AR107","lv":"H","c":"M","p":"defined","q":"To be honest, that's not ___ answer I was hoping for.","a":["the"],"x":"The clause \"I was hoping for\" identifies one particular answer: \"the\".","t":"The one answer I hoped for: the."},{"id":"AR108","lv":"H","c":"M","p":"situation","q":"\"Who's that at the door?\" \"Don't worry, it's just ___ postman.\"","a":["the"],"x":"\"The postman\" is the one who delivers to this street, part of shared local knowledge.","t":"The usual postman everyone knows: the."},{"id":"AR109","lv":"C","c":"G","p":"abstract-general","q":"___ life is too short to argue about small things.","a":["-"],"x":"Abstract nouns used in a general sense take no article. Common slip: \"The life is too short\"."},{"id":"AR110","lv":"C","c":"G","p":"abstract-general","q":"I love ___ music, especially old Bengali songs.","a":["-"],"x":"\"Music\" in general: no article."},{"id":"AR111","lv":"C","c":"G","p":"plural-general","q":"___ dogs are more loyal than cats, in my opinion.","a":["-"],"x":"Plural nouns used for a whole class in general take no article. Common slip: \"The dogs are more loyal\"."},{"id":"AR112","lv":"C","c":"G","p":"abstract-general","q":"___ honesty is the best policy.","a":["-"],"x":"An abstract quality in general: no article."},{"id":"AR113","lv":"C","c":"G","p":"abstract-specific","q":"She's fascinated by ___ history of Bengal under the Mughals.","a":["the"],"x":"\"Of Bengal under the Mughals\" narrows history to one specific part: \"the history of\"."},{"id":"AR114","lv":"C","c":"G","p":"abstract-general","q":"She's fascinated by ___ history, especially the ancient world.","a":["-"],"x":"\"History\" as a subject in general takes no article."},{"id":"AR115","lv":"C","c":"G","p":"plural-general","q":"___ children need plenty of sleep to grow properly.","a":["-"],"x":"Children in general: no article."},{"id":"AR116","lv":"C","c":"G","p":"plural-specific","q":"___ children in this class are unusually good at maths.","a":["the"],"x":"\"In this class\" identifies a specific group: \"the children\"."},{"id":"AR117","lv":"C","c":"G","p":"abstract-general","q":"___ money can't buy happiness, but it certainly helps.","a":["-"],"x":"\"Money\" in general: no article."},{"id":"AR118","lv":"C","c":"G","p":"abstract-general","q":"I don't really like ___ coffee; I prefer tea.","a":["-"],"x":"An uncountable noun used for the thing in general takes no article."},{"id":"AR119","lv":"C","c":"G","p":"abstract-specific","q":"___ coffee you made this morning was delicious.","a":["the"],"x":"\"You made this morning\" identifies specific coffee: \"the\"."},{"id":"AR120","lv":"C","c":"G","p":"abstract-general","q":"___ nature is full of surprises if you look closely.","a":["-"],"x":"\"Nature\" meaning the natural world takes no article. Common slip: \"The nature is full of surprises.\""},{"id":"AR121","lv":"C","c":"G","p":"abstract-general","q":"Do you believe in ___ love at first sight?","a":["-"],"x":"Abstract noun, general sense: no article."},{"id":"AR122","lv":"C","c":"G","p":"abstract-general","q":"___ crime has fallen in most big cities over the last decade.","a":["-"],"x":"\"Crime\" in general: no article."},{"id":"AR123","lv":"C","c":"G","p":"abstract-general","q":"___ unemployment is rising again for the third year in a row.","a":["-"],"x":"\"Unemployment\" in general: no article."},{"id":"AR124","lv":"C","c":"G","p":"abstract-general","q":"___ water boils at 100 degrees Celsius at sea level.","a":["-"],"x":"A general scientific truth about water: no article."},{"id":"AR125","lv":"C","c":"G","p":"abstract-specific","q":"___ water in this bottle tastes strange; don't drink it.","a":["the"],"x":"\"In this bottle\" identifies specific water: \"the\"."},{"id":"AR126","lv":"C","c":"G","p":"plural-general","q":"___ people are generally kind if you treat them with respect.","a":["-"],"x":"People in general: no article."},{"id":"AR127","lv":"C","c":"G","p":"plural-specific","q":"___ people next door are having a party again.","a":["the"],"x":"\"Next door\" identifies specific people: \"the\"."},{"id":"AR128","lv":"C","c":"G","p":"plural-general","q":"He has always been terrified of ___ spiders.","a":["-"],"x":"Spiders as a class, in general: no article."},{"id":"AR129","lv":"C","c":"G","p":"language","q":"___ English is an official language in more than fifty countries.","a":["-"],"x":"Names of languages take no article. Common slip: \"The English is ...\". (\"The English\" means the people.)"},{"id":"AR130","lv":"C","c":"G","p":"abstract-general","q":"___ society expects too much of young people these days.","a":["-"],"x":"\"Society\" in the general sense takes no article."},{"id":"AR131","lv":"C","c":"G","p":"abstract-general","q":"___ time flies when you're having fun.","a":["-"],"x":"\"Time\" in general: no article."},{"id":"AR132","lv":"C","c":"G","p":"abstract-general","q":"___ technology is changing the way we work and study.","a":["-"],"x":"\"Technology\" in general: no article."},{"id":"AR133","lv":"C","c":"G","p":"subject","q":"She studies ___ economics at Dhaka University.","a":["-"],"x":"Academic subjects take no article."},{"id":"AR134","lv":"D","c":"G","p":"generic-species","q":"___ tiger is in danger of extinction because its habitat is shrinking.","a":["the"],"x":"\"The + singular noun\" can mean a whole species. Extinction happens to a species, not to \"a tiger\", so \"a\" is wrong here.","t":"The + singular noun can mean the whole species."},{"id":"AR135","lv":"D","c":"G","p":"generic-species","q":"___ computer has changed the way almost everyone works.","a":["the"],"x":"\"The computer\" means the computer as an invention, the whole class of machines.","t":"The + invention means the invention in general."},{"id":"AR136","lv":"D","c":"G","p":"generic-a","q":"___ whale is a mammal, not a fish.","a":["a","the"],"x":"For a definition, \"A whale\" (any typical member) and \"The whale\" (the species) both work. \"Whales are mammals\" is another option.","t":"Definitions: a whale (any one) or the whale (the species)."},{"id":"AR137","lv":"D","c":"G","p":"generic-species","q":"___ violin is harder to learn than the piano.","a":["the"],"x":"Musical instruments as a type take \"the\" when you talk about them in general.","t":"An instrument as a type: the violin."},{"id":"AR138","lv":"D","c":"G","p":"abstract-specific","q":"___ society of ancient Egypt was strictly divided by class.","a":["the"],"x":"\"Of ancient Egypt\" specifies one particular society: \"the\".","t":"The of-phrase makes it specific: the."},{"id":"AR139","lv":"D","c":"G","p":"abstract-specific","q":"___ life of a soldier on the front line was brutal and short.","a":["the"],"x":"\"Of a soldier\" narrows \"life\" to a particular kind: \"the life of\".","t":"The life of + noun: specific, so the."},{"id":"AR140","lv":"D","c":"G","p":"abstract-specific","q":"He spent his whole career studying ___ behaviour of honeybees.","a":["the"],"x":"An of-phrase that specifies the abstract noun calls for \"the\".","t":"The behaviour of + noun: specific, so the."},{"id":"AR141","lv":"D","c":"G","p":"subject","q":"I was never very good at ___ maths at school.","a":["-"],"x":"School subjects take no article.","t":"School subjects: no article."},{"id":"AR142","lv":"D","c":"G","p":"generic-species","q":"___ mobile phone has made us reachable at every moment of the day.","a":["the"],"x":"\"The mobile phone\" means the invention in general.","t":"The + invention in general: the mobile phone."},{"id":"AR143","lv":"D","c":"G","p":"abstract-general","q":"___ youth is wasted on the young, as the saying goes.","a":["-"],"x":"\"Youth\" as a period of life, in general: no article.","t":"Youth as a stage of life: no article."},{"id":"AR144","lv":"D","c":"G","p":"abstract-specific","q":"___ art of conversation seems to be dying.","a":["the"],"x":"\"The art of + noun\" is specified by the of-phrase.","t":"The art of + noun: the."},{"id":"AR145","lv":"D","c":"G","p":"abstract-general","q":"___ modern art leaves me cold, though my sister loves it.","a":["-"],"x":"An adjective does not change the rule: a general uncountable noun still takes no article. Common slip: \"The modern art\".","t":"Adjective + general uncountable noun: still no article."},{"id":"AR146","lv":"D","c":"G","p":"abstract-general","q":"___ Victorian architecture is famous for its ornate detail.","a":["-"],"x":"Adjective + general uncountable noun: no article.","t":"Adjective + general noun: no article."},{"id":"AR147","lv":"D","c":"G","p":"abstract-specific","q":"___ architecture of this building is unlike anything else in the city.","a":["the"],"x":"\"Of this building\" makes it specific: \"the\".","t":"Of this building makes it specific: the."},{"id":"AR148","lv":"D","c":"G","p":"plural-general","q":"___ women still earn less than men in many industries.","a":["-"],"x":"Women in general: no article.","t":"Women in general: no article."},{"id":"AR149","lv":"D","c":"G","p":"plural-specific","q":"___ women who work here get six months of paid maternity leave.","a":["the"],"x":"The relative clause identifies a specific group: \"the\".","t":"The women who work here: a specific group."},{"id":"AR150","lv":"D","c":"G","p":"generic-species","q":"___ human brain contains around 86 billion neurons.","a":["the"],"x":"\"The human brain\" refers to the organ in general, as a type.","t":"The human brain: the organ as a type."},{"id":"AR151","lv":"D","c":"G","p":"abstract-general","q":"Education is the most powerful weapon against ___ poverty.","a":["-"],"x":"\"Poverty\" in general: no article.","t":"An abstract noun in general: no article."},{"id":"AR152","lv":"D","c":"G","p":"generic-species","q":"___ wheel was probably invented in Mesopotamia around 3500 BC.","a":["the"],"x":"An invention as a whole: \"the wheel\".","t":"The wheel: the invention as a whole."},{"id":"AR153","lv":"D","c":"G","p":"abstract-general","q":"___ peace is more fragile than most people think.","a":["-"],"x":"Abstract noun, general sense: no article.","t":"Peace in general: no article."},{"id":"AR154","lv":"H","c":"G","p":"man-humanity","q":"As Aristotle observed, ___ man is by nature a social animal.","a":["-"],"x":"\"Man\" meaning humankind (a dated use) takes no article. \"The man\" would mean one particular man.","t":"Man meaning humankind: no article."},{"id":"AR155","lv":"H","c":"G","p":"generic-species","q":"In fifty years, ___ car as we know it may have disappeared from our cities.","a":["the"],"x":"\"The car\" here means the car as a type of machine, not one vehicle.","t":"The car here means the car as a type of machine."},{"id":"AR156","lv":"H","c":"G","p":"abstract-specific","q":"___ Indian food I tasted in Leicester was the best I've ever had.","a":["the"],"x":"Compare \"I love Indian food\" (no article). The clause \"I tasted in Leicester\" makes it specific: \"the\".","t":"General: Indian food. Specific: the Indian food I tasted."},{"id":"AR157","lv":"H","c":"G","p":"abstract-of-zero","q":"___ freedom of speech is protected by the constitution.","a":["-"],"x":"\"Freedom of speech\" is a fixed concept and normally takes no article, even with the of-phrase. Common slip: \"The freedom of speech\".","t":"Freedom of speech is a fixed concept: no article."},{"id":"AR158","lv":"H","c":"G","p":"abstract-specific","q":"___ quality of life in the city has improved since the new parks opened.","a":["the"],"x":"\"The quality of life\" is a fixed pattern: \"quality\" is specified by \"of life\".","t":"The quality of life: fixed pattern with the."},{"id":"AR159","lv":"C","c":"U","p":"unc-no-a","q":"Can you give me ___ advice about my CV?","a":["-"],"x":"\"Advice\" is uncountable, so it never takes \"a/an\". Say \"some advice\" or \"a piece of advice\". Common slip: \"an advice\"."},{"id":"AR160","lv":"C","c":"U","p":"unc-no-a","q":"I need ___ information about train times to Rajshahi.","a":["-"],"x":"\"Information\" is uncountable: no \"a\". Common slip: \"an information\"."},{"id":"AR161","lv":"C","c":"U","p":"unc-no-a","q":"We bought ___ new furniture for the living room.","a":["-"],"x":"\"Furniture\" is uncountable, even with an adjective: no \"a\"."},{"id":"AR162","lv":"C","c":"U","p":"piece-of","q":"She gave me ___ useful piece of advice: never sign anything you haven't read.","a":["a"],"x":"\"A piece of\" turns an uncountable noun into something countable, and \"useful\" starts with a y-sound: \"a useful piece\"."},{"id":"AR163","lv":"C","c":"U","p":"unc-specific","q":"Have you heard ___ news? Shirin is getting married!","a":["the"],"x":"\"News\" is uncountable; here it means specific news the speaker is about to share: \"the news\"."},{"id":"AR164","lv":"C","c":"U","p":"unc-specific","q":"___ luggage I checked in at Dhaka never arrived in Rome.","a":["the"],"x":"The relative clause identifies specific luggage: \"the\". (\"Luggage\" is uncountable, so never \"a luggage\".)"},{"id":"AR165","lv":"C","c":"U","p":"unc-no-a","q":"There's always too much ___ traffic in the city centre at rush hour.","a":["-"],"x":"\"Traffic\" is uncountable: no article in this general sense."},{"id":"AR166","lv":"C","c":"U","p":"count-portion","q":"Could I have ___ large coffee to take away, please?","a":["a"],"x":"When ordering, \"a coffee\" means one cup, so the uncountable noun is used as countable: \"a large coffee\"."},{"id":"AR167","lv":"C","c":"U","p":"count-portion","q":"I baked ___ cake for her birthday, with three layers of chocolate.","a":["a"],"x":"A whole cake is a countable thing: \"a cake\". (A slice is \"some cake\".)"},{"id":"AR168","lv":"C","c":"U","p":"meaning-shift","q":"Is there ___ room for one more person in the car?","a":["-"],"x":"\"Room\" meaning space is uncountable: no \"a\". Common slip: \"Is there a room for one more?\""},{"id":"AR169","lv":"C","c":"U","p":"meaning-shift","q":"They booked ___ room at a small hotel by the beach.","a":["a"],"x":"\"Room\" meaning a bedroom is countable: \"a room\"."},{"id":"AR170","lv":"C","c":"U","p":"meaning-shift","q":"The vase is made of ___ glass, so please be careful with it.","a":["-"],"x":"\"Glass\" as a material is uncountable: no article."},{"id":"AR171","lv":"C","c":"U","p":"meaning-shift","q":"Could I have ___ glass of water, please?","a":["a"],"x":"\"A glass\" is a container, so it is countable."},{"id":"AR172","lv":"C","c":"U","p":"meaning-shift","q":"He's only forty, but he already has ___ grey hair all over his head.","a":["-"],"x":"\"Hair\" on the head, as a mass, is uncountable: no article."},{"id":"AR173","lv":"C","c":"U","p":"meaning-shift","q":"Waiter, there's ___ hair in my soup!","a":["a"],"x":"One single strand of hair is countable: \"a hair\"."},{"id":"AR174","lv":"C","c":"U","p":"unc-adj","q":"We had ___ terrible weather for the whole holiday.","a":["-"],"x":"\"Weather\" is uncountable, so never \"a terrible weather\". Common slip: \"We had a terrible weather.\""},{"id":"AR175","lv":"C","c":"U","p":"meaning-shift","q":"Getting lost in the forest at night was ___ terrifying experience.","a":["a"],"x":"\"Experience\" meaning an event that happens to you is countable: \"a terrifying experience\"."},{"id":"AR176","lv":"C","c":"U","p":"meaning-shift","q":"She has plenty of ___ experience in marketing.","a":["-"],"x":"\"Experience\" meaning knowledge and skill is uncountable: no article."},{"id":"AR177","lv":"C","c":"U","p":"unc-no-a","q":"They're doing ___ research on how climate change affects rice yields.","a":["-"],"x":"\"Research\" is uncountable: no \"a\". Common slip: \"a research\"."},{"id":"AR178","lv":"C","c":"U","p":"meaning-shift","q":"We need to buy more ___ paper for the printer.","a":["-"],"x":"\"Paper\" as a material is uncountable."},{"id":"AR179","lv":"C","c":"U","p":"meaning-shift","q":"Did you buy ___ paper this morning? I want to read the sports pages.","a":["a"],"x":"\"A paper\" here means a newspaper, which is countable."},{"id":"AR180","lv":"C","c":"U","p":"unc-no-a","q":"The lab needs ___ new equipment before the experiment can begin.","a":["-"],"x":"\"Equipment\" is uncountable: no \"a\"."},{"id":"AR181","lv":"C","c":"U","p":"unc-no-a","q":"I finally made ___ real progress on my thesis today.","a":["-"],"x":"\"Progress\" is uncountable: no \"a\". Common slip: \"a real progress\"."},{"id":"AR182","lv":"C","c":"U","p":"count-basic","q":"He doesn't have ___ job at the moment, so he's doing some freelance work.","a":["a"],"x":"\"Job\" is countable (\"a job\"); \"work\" is uncountable."},{"id":"AR183","lv":"D","c":"U","p":"unc-no-a","q":"After the factory closed, he spent months looking for ___ work.","a":["-"],"x":"\"Work\" meaning employment is uncountable: no \"a\". Use \"a job\" if you want a countable noun.","t":"Work (employment) is uncountable: no a."},{"id":"AR184","lv":"D","c":"U","p":"abstract-a","q":"She has ___ good knowledge of Arabic and Persian.","a":["a"],"x":"\"Knowledge\" is uncountable, but it takes \"a\" in the pattern \"a good / thorough knowledge of\".","t":"A good knowledge of: a special pattern with a."},{"id":"AR185","lv":"D","c":"U","p":"abstract-a","q":"Her parents worked hard to give her ___ excellent education.","a":["an"],"x":"\"Education\" is usually uncountable, but it takes \"a/an\" when an adjective describes one particular kind: \"an excellent education\".","t":"Adjective + one kind of education: an excellent education."},{"id":"AR186","lv":"D","c":"U","p":"abstract-a","q":"___ education is the key to escaping poverty.","a":["-"],"x":"\"Education\" in the general sense takes no article.","t":"Education in general: no article."},{"id":"AR187","lv":"D","c":"U","p":"abstract-a","q":"We had ___ wonderful time at the beach in Cox's Bazar.","a":["a"],"x":"\"Have a good/wonderful time\" treats \"time\" as an experience: \"a\".","t":"Have a good time: time as an experience takes a."},{"id":"AR188","lv":"D","c":"U","p":"meaning-shift","q":"Sorry, I haven't got ___ time to talk right now.","a":["-"],"x":"\"Time\" meaning duration is uncountable: no article.","t":"Time as duration: no article."},{"id":"AR189","lv":"D","c":"U","p":"count-portion","q":"Two teas and ___ orange juice, please.","a":["an"],"x":"When ordering, \"an orange juice\" means one glass of it.","t":"Ordering one glass: an orange juice."},{"id":"AR190","lv":"D","c":"U","p":"abstract-a","q":"There was ___ deafening silence after the results were announced.","a":["a"],"x":"\"Silence\" is uncountable in general, but takes \"a\" when an adjective describes one particular instance.","t":"One particular silence, described: a."},{"id":"AR191","lv":"D","c":"U","p":"abstract-a","q":"___ silence is golden, as the proverb says.","a":["-"],"x":"\"Silence\" in general: no article.","t":"Silence in general: no article."},{"id":"AR192","lv":"D","c":"U","p":"abstract-a","q":"The concert was ___ huge success, and they've added two more dates.","a":["a"],"x":"\"Success\" meaning a successful event or person is countable: \"a huge success\".","t":"A success means a successful event: a."},{"id":"AR193","lv":"D","c":"U","p":"abstract-a","q":"Hard work is the key to ___ success.","a":["-"],"x":"\"Success\" in general: no article.","t":"Success in general: no article."},{"id":"AR194","lv":"D","c":"U","p":"meaning-shift","q":"The professor gave ___ fascinating talk on the ethics of AI.","a":["a"],"x":"\"A talk\" means a lecture, so it is countable.","t":"A talk means a lecture: a."},{"id":"AR195","lv":"D","c":"U","p":"meaning-shift","q":"There's been too much ___ talk and not enough action.","a":["-"],"x":"\"Talk\" meaning speaking in general is uncountable.","t":"Talk meaning speaking in general: no article."},{"id":"AR196","lv":"D","c":"U","p":"piece-of","q":"Could you pick up ___ loaf of bread on the way home?","a":["a"],"x":"\"Bread\" is uncountable; \"a loaf of\" makes it countable.","t":"A loaf of bread: the loaf is countable."},{"id":"AR197","lv":"D","c":"U","p":"unc-adj","q":"They served ___ delicious Indian food at the wedding.","a":["-"],"x":"\"Food\" is uncountable here, even with adjectives: no \"a\".","t":"Food stays uncountable even with adjectives."},{"id":"AR198","lv":"D","c":"U","p":"meaning-shift","q":"We're having ___ chicken for dinner tonight.","a":["-"],"x":"An animal eaten as meat is uncountable: no article.","t":"An animal as meat: no article."},{"id":"AR199","lv":"D","c":"U","p":"meaning-shift","q":"There's ___ chicken wandering around in our garden!","a":["a"],"x":"A live animal is countable: \"a chicken\".","t":"A live animal: a chicken."},{"id":"AR200","lv":"H","c":"U","p":"abstract-a","q":"The new tax rules have been ___ great help to small businesses.","a":["a"],"x":"\"Help\" is usually uncountable, but \"a help\" means a person or thing that helps: \"a great help\".","t":"A help means someone or something that helps."},{"id":"AR201","lv":"H","c":"U","p":"unc-adj","q":"The firefighters showed ___ remarkable courage during the rescue.","a":["-"],"x":"\"Courage\" stays uncountable even with an adjective: no \"a\". Compare \"a remarkable knowledge of\", which is a special pattern.","t":"Courage stays uncountable, even with an adjective."},{"id":"AR202","lv":"H","c":"U","p":"plural-irregular","q":"Divers saw ___ fish of every colour on the reef.","a":["-"],"x":"\"Fish\" is plural here (same form as the singular), and plural nouns used generally take no article.","t":"Fish here is plural, used generally: no article."},{"id":"AR203","lv":"H","c":"U","p":"police","q":"___ police are investigating the robbery at the jewellery shop.","a":["the","-"],"x":"\"The police\" is the standard form, always with a plural verb. News reports often drop \"the\" (\"Police are investigating\"), so both are accepted.","t":"\"The police\" is standard; headlines drop the."},{"id":"AR204","lv":"H","c":"U","p":"plural-irregular","q":"The court awarded her £50,000 in ___ damages.","a":["-"],"x":"\"Damages\" (plural) means money paid as compensation; here it is general, so no article. Don't confuse it with uncountable \"damage\" (harm).","t":"Damages (money) in general: no article."},{"id":"AR205","lv":"C","c":"R","p":"unique","q":"___ sun rises in the east and sets in the west.","a":["the"],"x":"There is only one sun in our sky, so \"the sun\"."},{"id":"AR206","lv":"C","c":"R","p":"planets","q":"Is there life on ___ Mars?","a":["-"],"x":"Planet names (Mars, Venus, Jupiter) take no article. Earth is the exception that often takes \"the\"."},{"id":"AR207","lv":"C","c":"R","p":"unique","q":"___ moon looks enormous tonight.","a":["the"],"x":"One moon in our sky: \"the\"."},{"id":"AR208","lv":"C","c":"R","p":"superlative","q":"She's ___ best student in the class.","a":["the"],"x":"Superlatives normally take \"the\"."},{"id":"AR209","lv":"C","c":"R","p":"ordinal","q":"He was ___ first person to arrive at the party.","a":["the"],"x":"Ordinal numbers (first, second, last) normally take \"the\"."},{"id":"AR210","lv":"C","c":"R","p":"same-only","q":"We live on ___ same street as my cousins.","a":["the"],"x":"\"Same\" always takes \"the\". Common slip: \"a same street\"."},{"id":"AR211","lv":"C","c":"R","p":"same-only","q":"You're ___ only person who really understands me.","a":["the"],"x":"\"The only\" singles out one person."},{"id":"AR212","lv":"C","c":"R","p":"unique","q":"I found the recipe on ___ internet.","a":["the"],"x":"\"The internet\" is unique and takes \"the\"."},{"id":"AR213","lv":"C","c":"R","p":"ordinal","q":"Who was ___ last person to leave the office yesterday?","a":["the"],"x":"\"Last\" in a sequence takes \"the\"."},{"id":"AR214","lv":"C","c":"R","p":"unique","q":"___ world is getting warmer every decade.","a":["the"],"x":"\"The world\" is unique."},{"id":"AR215","lv":"C","c":"R","p":"unique","q":"___ sky was clear and full of stars.","a":["the"],"x":"\"The sky\" is unique from where we stand."},{"id":"AR216","lv":"C","c":"R","p":"unique","q":"We all have a duty to protect ___ environment.","a":["the"],"x":"\"The environment\" means the natural world around us, which is unique."},{"id":"AR217","lv":"C","c":"R","p":"ordinal","q":"My aunt lives on ___ top floor of an old building in Old Dhaka.","a":["the"],"x":"\"Top\" works like a superlative here: \"the top floor\"."},{"id":"AR218","lv":"C","c":"R","p":"ordinal","q":"___ next train to Sylhet leaves at 9.40.","a":["the"],"x":"\"The next\" in a timetable refers to one specific train."},{"id":"AR219","lv":"C","c":"R","p":"unique-of","q":"___ capital of Bangladesh is Dhaka.","a":["the"],"x":"A country has one capital, and the of-phrase identifies it: \"the capital of\"."},{"id":"AR220","lv":"D","c":"R","p":"unique","q":"Mars is often called ___ Red Planet.","a":["the"],"x":"A unique nickname takes \"the\", even though \"Mars\" itself takes no article.","t":"A unique nickname: the Red Planet."},{"id":"AR221","lv":"D","c":"R","p":"a-ordinal","q":"The first attempt failed, so they tried ___ second time.","a":["a"],"x":"\"A second time\" means \"one more time\", not the second in a ranked series.","t":"A second time means once more."},{"id":"AR222","lv":"D","c":"R","p":"a-ordinal","q":"I'd like to get ___ second opinion before I agree to the operation.","a":["a"],"x":"\"A second opinion\" means another opinion, from a different expert.","t":"A second opinion means another opinion."},{"id":"AR223","lv":"D","c":"R","p":"planets","q":"___ Earth is the third planet from the Sun.","a":["the","-"],"x":"\"The Earth\" is most common, but as a planet name \"Earth\" can also go without an article. Both are accepted.","t":"The Earth, or Earth as a planet name."},{"id":"AR224","lv":"D","c":"R","p":"superlative","q":"It's one of ___ best restaurants in town.","a":["the"],"x":"\"One of the + superlative + plural noun\".","t":"One of the + superlative + plural noun."},{"id":"AR225","lv":"D","c":"R","p":"the-comparative","q":"Which is ___ better of the two options?","a":["the"],"x":"When comparing exactly two, use \"the + comparative\": \"the better of the two\".","t":"Choosing between two: the better."},{"id":"AR226","lv":"D","c":"R","p":"ordinal-zero","q":"She came ___ second in the 100 metres.","a":["-"],"x":"After \"come / finish\" in a race, ordinals work like adverbs: no article. Common slip: \"came the second\".","t":"Race positions after come/finish: no article."},{"id":"AR227","lv":"D","c":"R","p":"ordinal-zero","q":"Who came ___ first in the final exam?","a":["-"],"x":"\"Come first\" (win): no article.","t":"Come first means win: no article."},{"id":"AR228","lv":"D","c":"R","p":"same-only","q":"That's ___ very thing I was looking for!","a":["the"],"x":"\"The very\" means \"exactly this one\".","t":"The very means exactly this one."},{"id":"AR229","lv":"D","c":"R","p":"same-only","q":"I'm not ___ only one who thinks the plan won't work.","a":["the"],"x":"\"The only one\": one singled out.","t":"The only one: singled out."},{"id":"AR230","lv":"D","c":"R","p":"unique","q":"___ climate is changing faster than scientists predicted.","a":["the"],"x":"\"The climate\" means the world's climate system.","t":"The climate means the world's climate system."},{"id":"AR231","lv":"D","c":"R","p":"unique","q":"___ universe is around 13.8 billion years old.","a":["the"],"x":"\"The universe\" is unique.","t":"There is only one universe: the."},{"id" 253","lv":"C","c":"P","p":"country-the","q":"Have you ever been to ___ Philippines?","a":["the"],"x":"A plural country name (a group of islands): \"the\"."},{"id":"AR254","lv":"C","c":"P","p":"water-the","q":"We walked along ___ Thames from Westminster to Tower Bridge.","a":["the"],"x":"Rivers take \"the\"."},{"id":"AR255","lv":"C","c":"P","p":"street-zero","q":"Sherlock Holmes lived on ___ Baker Street.","a":["-"],"x":"Street names take no article."},{"id":"AR256","lv":"C","c":"P","p":"transport-zero","q":"We landed at ___ Heathrow Airport just after midnight.","a":["-"],"x":"Airports named after a place take no article."},{"id":"AR257","lv":"C","c":"P","p":"country-zero","q":"___ Bangladesh is one of the most densely populated countries on earth.","a":["-"],"x":"Single-word country names take no article."},{"id":"AR258","lv":"C","c":"P","p":"water-the","q":"___ Mediterranean is warm enough to swim in until October.","a":["the"],"x":"Seas take \"the\"."},{"id":"AR259","lv":"C","c":"P","p":"range-the","q":"___ Himalayas stretch across five countries.","a":["the"],"x":"Mountain ranges take \"the\"."},{"id":"AR260","lv":"C","c":"P","p":"islands-the","q":"___ Canary Islands are popular with European tourists.","a":["the"],"x":"Island groups take \"the\"."},{"id":"AR261","lv":"C","c":"P","p":"mountain-zero","q":"She has climbed ___ Kilimanjaro twice.","a":["-"],"x":"Single mountains take no article."},{"id":"AR262","lv":"C","c":"P","p":"building-the","q":"We stayed at ___ Hilton for two nights.","a":["the"],"x":"Hotels usually take \"the\"."},{"id":"AR263","lv":"C","c":"P","p":"country-zero","q":"___ Japan is made up of thousands of islands.","a":["-"],"x":"\"Japan\" takes no article, even though it is an island nation."},{"id":"AR264","lv":"C","c":"P","p":"water-the","q":"They crossed ___ English Channel by ferry.","a":["the"],"x":"Channels take \"the\"."},{"id":"AR265","lv":"C","c":"P","p":"company-zero","q":"I ordered the book from ___ Amazon.","a":["-"],"x":"Company 85","lv":"D","c":"P","p":"islands-the","q":"They took the ferry to ___ Isle of Wight.","a":["the"],"x":"\"Isle of\" names take \"the\".","t":"The Isle of ...: the."},{"id":"AR286","lv":"D","c":"P","p":"islands-the","q":"They spent a week touring ___ Sicily.","a":["-"],"x":"Single islands take no article.","t":"A single island: no article."},{"id":"AR287","lv":"D","c":"P","p":"water-the","q":"___ Suez Canal links the Mediterranean and the Red Sea.","a":["the"],"x":"Canals take \"the\".","t":"Canals: the."},{"id":"AR288","lv":"D","c":"P","p":"building-the","q":"She works at ___ British Museum.","a":["the"],"x":"Many museums and galleries take \"the\".","t":"Most museums: the."},{"id":"AR289","lv":"D","c":"P","p":"possessive-zero","q":"We grabbed a burger at ___ McDonald's near the station.","a":["-"],"x":"Names with a possessive 's take no article.","t":"Possessive 's names: no article."},{"id":"AR290","lv":"D","c":"P","p":"possessive-zero","q":"He was treated at ___ St Thomas' Hospital in London.","a":["-"],"x":"Names beginning with \"St\" or a person's name usually take no article.","t":"A saint's or person's name in a building name: no article."},{"id":"AR291","lv":"D","c":"P","p":"water-the","q":"___ Amazon carries more water than any other river.","a":["the"],"x":"The river takes \"the\". Compare the company: \"I bought it from Amazon.\"","t":"The river takes the; the company doesn't."},{"id":"AR292","lv":"D","c":"P","p":"range-the","q":"___ Andes run along the western side of South America.","a":["the"],"x":"Mountain ranges take \"the\".","t":"Mountain ranges: the."},{"id":"AR293","lv":"H","c":"P","p":"country-the-exception","q":"___ Ukraine has been in the news almost every day.","a":["-"],"x":"Modern standard English says \"Ukraine\". \"The Ukraine\" is outdated and is now considered incorrect.","t":"Modern usage: Ukraine, never the Ukraine."},{"id":"AR294","lv":"D","c":"P","p":"water-the","q":"___ Congo is the second-longest river in Africa.","a":["the"],"x":"Rivers take \"the\", including less familiar ones: the Congo, the Niger, the Zambezi.","t":"Rivers: the."},{"id":"AR295","lv":"H","c":"P","p":"mountain-exception","q":"___ Matterhorn is one of the most photographed peaks in the Alps.","a":["the"],"x":"Most single mountains take no article, but a few take \"the\": the Matterhorn, the Eiger.","t":"A few single peaks take the: the Matterhorn."},{"id":"AR296","lv":"H","c":"P","p":"city-the-exception","q":"___ Bronx is one of the five boroughs of New York City.","a":["the"],"x":"\"The Bronx\" is an exception: the article is part of the name.","t":"The Bronx: the is part of the name."},{"id":"AR297","lv":"H","c":"P","p":"acronym-org","q":"After university, she got a job at ___ BBC.","a":["the"],"x":"Organisations whose initials are said letter by letter usually take \"the\": the BBC, the UN, the EU.","t":"Initials said letter by letter: the BBC."},{"id":"AR298","lv":"H","c":"P","p":"acronym-org","q":"Norway was a founding member of ___ NATO.","a":["-"],"x":"Acronyms pronounced as words (NATO, UNESCO, OPEC) usually take no article.","t":"Acronyms said as words: no article."},{"id":"AR299","lv":"C","c":"I","p":"inst-purpose","q":"My son goes to ___ school by bus every morning.","a":["-"],"x":"\"Go to school\" for its main purpose (studying) takes no article."},{"id":"AR300","lv":"C","c":"I","p":"inst-building","q":"I went to ___ school this afternoon to pick up my son.","a":["the"],"x":"Visiting the building (not as a student) takes \"the\"."},{"id":"AR301","lv":"C","c":"I","p":"inst-purpose","q":"What time do you usually go to ___ bed?","a":["-"],"x":"\"Go to bed\" (to sleep) takes no article."},{"id":"AR302","lv":"C","c":"I","p":"inst-purpose","q":"After the accident, she was in ___ hospital for three days.","a":["-","the"],"x":"British English says \"in hospital\" (as a patient). American English says \"in the hospital\". Both are accepted."},{"id":"AR303","lv":"C","c":"I","p":"inst-purpose","q":"I'll see you at ___ wor },{"id":"AR463","lv":"C","c":"A","p":"body-part","q":"The ball hit him on ___ head.","a":["the"],"x":"After a preposition, when the person is already named, use \"the\" for the body part: hit him on the head."},{"id":"AR464","lv":"C","c":"A","p":"body-part","q":"She took me by ___ arm and led me inside.","a":["the"],"x":"\"Take someone by the arm / hand\" uses \"the\"."},{"id":"AR465","lv":"C","c":"A","p":"titles","q":"___ King gave his annual Christmas speech.","a":["the"],"x":"A unique title used alone takes \"the\"."},{"id":"AR466","lv":"C","c":"A","p":"titles","q":"___ King Charles visited Wales last month.","a":["-"],"x":"A title followed by a name takes no article."},{"id":"AR467","lv":"C","c":"A","p":"titles","q":"___ President of Bangladesh is elected by parliament.","a":["the"],"x":"\"The + title + of + country\"."},{"id":"AR468","lv":"C","c":"A","p":"titles","q":"___ Doctor Rahman will see you now.","a":["-"],"x":"Title + name takes no article."},{"id":"AR469","lv":"C","c":"A","p":"nationality","q":"___ Japanese are known for their punctuality.","a":["the"],"x":"\"The Japanese\" means Japanese people as a whole."},{"id":"AR470","lv":"C","c":"A","p":"nationality","q":"She's ___ Bangladeshi, but she was born in London.","a":["a"],"x":"A nationality noun for one person takes \"a/an\": a Bangladeshi, an American."},{"id":"AR471","lv":"C","c":"A","p":"names-special","q":"___ Smiths are coming to dinner on Saturday.","a":["the"],"x":"\"The + plural family name\" means the whole family."},{"id":"AR472","lv":"C","c":"A","p":"the-adj","q":"___ unemployed need more support from the government.","a":["the"],"x":"\"The unemployed\" means unemployed people as a group."},{"id":"AR473","lv":"C","c":"A","p":"body-part","q":"He looked me straight in ___ eye and lied.","a":["the"],"x":"\"Look someone in the eye\" uses \"the\"."},{"id":"AR474","lv":"C","c":"A","p":"body-part","q":"The soldier was shot in ___ shoulder.","a":["the"],"x":"\"Shot in the shoulder\": the person is
