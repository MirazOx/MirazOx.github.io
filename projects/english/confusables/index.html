<style>
:root{
  --paper:#EEF1F6; --card:#FFFFFF; --ink:#16213A; --ink2:#4B5775; --line:#D6DCE8;
  --red:#C41E3A; --redbg:#FCE9EC; --green:#0F7A5B; --greenbg:#E2F4EC; --mark:#FFE36B;
  --btn:#16213A; --btntext:#FFFFFF; --accent:#7A4B16; --accentbg:#F4ECE0;
  --brand:#7C3AED; --brand-bg:#F5F3FF; --brand-border:#DDD6FE; --brand-text:#FFFFFF;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1525; --card:#172038; --ink:#E9EDF7; --ink2:#9FAACB; --line:#2B3656;
    --red:#FF7487; --redbg:#3A1D28; --green:#52D0A5; --greenbg:#15332B; --mark:#6B5B00;
    --btn:#E9EDF7; --btntext:#0E1525; --accent:#E7C9A0; --accentbg:#2A2113;
    --brand:#A78BFA; --brand-bg:#2E1065; --brand-border:#5B21B6; --brand-text:#0E1525;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1525; --card:#172038; --ink:#E9EDF7; --ink2:#9FAACB; --line:#2B3656;
  --red:#FF7487; --redbg:#3A1D28; --green:#52D0A5; --greenbg:#15332B; --mark:#6B5B00;
  --btn:#E9EDF7; --btntext:#0E1525; --accent:#E7C9A0; --accentbg:#2A2113;
  --brand:#A78BFA; --brand-bg:#2E1065; --brand-border:#5B21B6; --brand-text:#0E1525;
}
:root[data-theme="dark"]{color-scheme:dark} :root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink2)}
.ghost:hover{border-color:var(--ink2);color:var(--ink)}
.ghost[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--btntext)}
.hdrbtns{display:flex;gap:8px;flex-wrap:wrap}

.strip{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.strip i{display:block;height:100%}
.strip .s-ok{background:var(--ink2)} .strip .s-err{background:var(--red)} .strip .s-fix{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;font-size:14px;color:var(--ink2)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}

nav.tabs{display:flex;gap:2px;margin:20px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--ink2);font-weight:500;white-space:nowrap;margin-bottom:-1px}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;line-height:22px;text-align:center}
.badge.green{background:var(--green)}
:root[data-theme="dark"] .badge{color:#0E1525}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0E1525}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px}
.meta{margin:0 0 16px;font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:13px;color:var(--ink2)}
.tag.E{border-color:var(--green);color:var(--green)}
.tag.M{border-color:var(--ink2);color:var(--ink)}
.tag.H{border-color:var(--accent);color:var(--accent)}
.tag.X{background:var(--ink);border-color:var(--ink);color:var(--btntext)}
.tag.reg{font-style:italic;font-family:var(--serif)}

/* faces switch */
.faces{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--paper)}
.faces button{border:0;background:none;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink2);min-height:36px}
.faces button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.prompt{font-family:var(--serif);font-size:clamp(26px,4.8vw,40px);line-height:1.35;margin:10px 0 2px;letter-spacing:-.01em}
.sentence{font-family:var(--serif);font-size:clamp(22px,4vw,32px);line-height:1.9;margin:6px 0 0;overflow-wrap:anywhere}
.sub{font-size:15px;color:var(--ink2);margin:14px 0 0}

/* gap-fill blank */
.slot{display:inline-block;position:relative;vertical-align:baseline;margin:0 .12em}
input.blank{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:3px solid var(--ink);border-radius:0;padding:0 .1em;width:7ch;min-width:5ch;max-width:100%;text-align:center;line-height:1.1;outline:none}
input.blank:focus{background:var(--mark)}
.slot.ok{color:var(--green);font-weight:500;border-bottom:3px solid var(--green);padding:0 .15em}
.slot.bad{padding:0 .15em;border-bottom:3px solid transparent}
.slot.bad del{color:var(--red);text-decoration:line-through;text-decoration-thickness:3px}
.slot.bad ins{position:absolute;left:50%;transform:translateX(-50%);top:-1.15em;font-size:.72em;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap;line-height:1}
.slot.bad ins::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:2px;border:5px solid transparent;border-top-color:var(--red);border-bottom:0}

/* meaning reveal */
.reveal{margin-top:22px;padding:2px 0 2px 18px;border-left:3px solid var(--ink);font-family:var(--serif);font-size:21px;line-height:1.5;color:var(--ink)}
.reveal.hidden-m{filter:blur(7px);user-select:none}
.examples{margin:18px 0 0;display:grid;gap:14px}
.example{margin:0;padding-left:18px;border-left:3px solid var(--line);font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.6;color:var(--ink2)}
.example b{font-style:normal;font-weight:600;color:var(--ink)}
.example-k{display:block;font-family:var(--sans);font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink2);margin-bottom:3px}
.origin-note{margin:16px 0 0;font-size:14px;line-height:1.55;color:var(--ink2)}

/* mcq options */
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:22px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-height:52px;font-size:17px;font-family:var(--serif);line-height:1.4}
.opt:hover{border-color:var(--ink)}
.opt kbd{font:600 13px var(--sans);color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--card);flex:0 0 auto;margin-top:2px}
.opt.correct{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt[disabled]{cursor:default}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.btn{background:var(--btn);color:var(--btntext);border:0;border-radius:9px;padding:11px 22px;font-weight:600;min-height:44px}
.btn:hover{opacity:.9}
.link{background:none;border:0;padding:8px 4px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.link:hover{color:var(--ink)}
.hint{font-size:14px;color:var(--ink2)}
.fb{margin-top:20px;padding:14px 16px;border-radius:10px;font-size:16px}
.fb.ok{background:var(--greenbg)} .fb.bad{background:var(--redbg)}
.fb p{margin:0 0 4px} .fb p:last-child{margin:0}
.fb strong{font-weight:700}
.fb .origin{font-style:italic;color:var(--ink2);font-family:var(--serif);font-size:15px;margin-top:8px}
.pips{display:inline-flex;gap:5px;vertical-align:middle;margin-left:4px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);background:transparent}
.pip.on{background:var(--green);border-color:var(--green)}
.celebrate{font-weight:600;color:var(--green)}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px 24px}
.empty h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 6px}
.empty p{margin:0 0 16px;color:var(--ink2);max-width:52ch}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
li.item .q{font-family:var(--serif);font-size:20px;line-height:1.5;margin:0 0 4px}
li.item .q b{color:var(--green);font-weight:600;border-bottom:2px solid var(--green)}
li.item .mn{font-size:15px;color:var(--ink2);margin:0 0 6px}
li.item .m{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:14px;color:var(--ink2)}
li.item .m .w{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.chips{margin:0 0 14px;font-size:14px;color:var(--ink2)}
.chips b{color:var(--ink)}
.section-note{margin:0 0 14px;color:var(--ink2);font-size:15px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.panel h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.row label{min-width:190px;font-weight:500}
select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.panel hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.small{font-size:14px;color:var(--ink2);margin:0 0 10px}
.warnbtn{background:none;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:8px 14px;min-height:40px}
.warnbtn[data-armed]{background:var(--red);color:var(--card)}
.reset-row{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 0 14px}
.reset-row p{margin:0;flex:1 1 260px} .reset-row p b{display:block;font-weight:600}

/* insights */
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 64px;gap:12px;align-items:center;margin:10px 0;font-size:15px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink2);border-radius:6px}
.bar.weak i{background:var(--red)}
.num{text-align:right;font-weight:600}
.score{font-family:var(--serif);font-size:60px;line-height:1;margin:4px 0 2px}

/* timer */
.timerbar{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.timerbar[hidden]{display:none}
.timernum{font-family:var(--sans);font-weight:700;font-size:clamp(46px,12vw,76px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 22px}
.timerbar.paused .timernum{color:var(--ink2)}
.timerctl{display:flex;flex-direction:column;gap:6px}

footer{margin-top:26px;font-size:13px;color:var(--ink2)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.info-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.info-card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 8px}
.info-card p{font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 8px}
.info-lead{font-family:var(--serif);font-size:18px;line-height:1.6;margin:0 0 6px}
@media (max-width:520px){.card{padding:20px 16px 18px}.wrap{padding:16px 12px 40px}.row label{min-width:100%}.bar-row{grid-template-columns:1fr 56px}.bar-row .bar{grid-column:1/-1;order:3}.timerctl{flex-direction:row}}
@media (prefers-reduced-motion:no-preference){.slot.bad ins{animation:drop .22s ease-out}@keyframes drop{from{opacity:0;top:-.6em}to{opacity:1;top:-1.15em}}}

/* suite switcher */
.suite-bar{background:var(--paper);border-bottom:1px solid var(--line);padding:8px 18px;margin:-20px -18px 20px}
.suite-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.suite-brand{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.suite-brand::before{content:"←";font-family:var(--sans);font-weight:400;color:var(--ink2);margin-right:2px}
.suite-brand .suite-full{font-family:var(--serif);font-weight:400;font-size:14px;color:var(--ink2)}
@media (max-width:620px){.suite-brand .suite-full{display:none}}
.suite-links{display:flex;gap:4px;overflow-x:auto}
.suite-link{font-size:12px;font-family:var(--sans);font-weight:500;color:var(--ink2);text-decoration:none;padding:5px 11px;border-radius:6px;white-space:nowrap;transition:all .15s}
.suite-link:hover{color:var(--ink);background:var(--card)}
.suite-link.is-active{color:var(--ink);background:var(--card);font-weight:600}

/* series kicker */
.series-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.series-tag .kicker-pill{color:var(--ink2);font-weight:600;font-size:11px}
.series-tag .series-sep{color:var(--line);font-size:11px}
.series-tag .series-disc{font-weight:500;color:var(--ink2)}

/* ===== bolder modernization: amplify the existing identity ===== */
h1{font-weight:600;font-size:clamp(30px,5vw,42px);letter-spacing:-.025em;line-height:1.04;text-wrap:balance}
header.top > div > p{font-size:13.5px}
.series-tag .kicker-pill{color:var(--brand);font-weight:700;letter-spacing:.09em}
nav.tabs{gap:4px}
nav.tabs button{transition:color .18s ease,border-color .18s ease;font-size:15px}
nav.tabs button[aria-current="true"]{border-bottom-color:var(--brand);border-bottom-width:3px;color:var(--ink);font-weight:700}
nav.tabs button:hover:not([aria-current="true"]){color:var(--ink)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 48px -30px rgba(0,0,0,.6)}
.panel h2{font-weight:600}
.btn{transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .18s ease,opacity .16s ease;box-shadow:0 2px 10px -4px rgba(0,0,0,.3);letter-spacing:.01em}
.btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 11px 24px -9px rgba(0,0,0,.45)}
.btn:active{transform:translateY(0);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.ghost{transition:border-color .16s ease,color .16s ease,background .16s ease}
.opt{transition:border-color .16s ease,background .16s ease,transform .16s ease}
.opt:hover:not([disabled]){border-color:var(--brand);transform:translateY(-1px)}
.faces button{transition:background .16s ease,color .16s ease}
li.item{transition:border-color .16s ease,transform .16s ease}
li.item:hover{border-color:var(--ink2)}
.suite-link{transition:color .15s ease,background .15s ease}
.score{color:var(--brand);font-size:clamp(56px,13vw,76px);letter-spacing:-.03em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

</style>
</head>

<script>
const BANK = [{"id":"CE1","lv":"E","ph":"affect","trap":"affect","vs":"effect","vsmean":"(noun) a result","ex":"The weather can ___ your mood.","mean":"(verb) to influence or make a difference to something","mcq":["to bring about a result","to pretend to have a feeling","to carry something out"],"note":"affect = verb (influence); effect = noun (result).","reg":"","vsex":"The special <b>effects</b> in the film were stunning."},{"id":"CE2","lv":"E","ph":"effect","trap":"effect","vs":"affect","vsmean":"(verb) to influence","ex":"The medicine had an immediate ___.","mean":"(noun) a result or consequence","mcq":["an influence on something","a pretended emotion","a plan of action"],"note":"effect = noun (result); affect = verb (influence).","reg":"","vsex":"The new policy will <b>affect</b> every department."},{"id":"CE3","lv":"E","ph":"your","trap":"your","vs":"you're","vsmean":"= you are","ex":"Is this ___ bag?","mean":"belonging to you (possessive)","mcq":["a short form of 'you are'","belonging to them","over there"],"note":"your = possessive; you're = you are.","reg":"","vsex":"<b>You're</b> going to love this surprise."},{"id":"CE4","lv":"E","ph":"you're","trap":"you're","vs":"your","vsmean":"belonging to you","ex":"___ going to love this.","mean":"the short form of 'you are'","mcq":["belonging to you","belonging to them","a place or position"],"note":"you're = you are; your = possessive.","reg":"","vsex":"Is this <b>your</b> bag on the seat?"},{"id":"CE5","lv":"E","ph":"their","trap":"their","vs":"there / they're","vsmean":"a place / they are","ex":"The students forgot ___ books.","mean":"belonging to them (possessive)","mcq":["in or at that place","a short form of 'they are'","belonging to you"],"note":"their = possessive; there = place; they're = they are.","reg":"","vsex":"Put the box over <b>there</b> by the door."},{"id":"CE6","lv":"E","ph":"there","trap":"there","vs":"their / they're","vsmean":"belonging to them / they are","ex":"Put the box over ___.","mean":"in, at, or to that place","mcq":["belonging to them","a short form of 'they are'","belonging to you"],"note":"there = place; their = possessive; they're = they are.","reg":"","vsex":"The students forgot <b>their</b> books at home."},{"id":"CE7","lv":"E","ph":"they're","trap":"they're","vs":"their / there","vsmean":"belonging to them / a place","ex":"___ coming to dinner tonight.","mean":"the short form of 'they are'","mcq":["belonging to them","in that place","belonging to you"],"note":"they're = they are.","reg":"","vsex":"The students forgot <b>their</b> books at home."},{"id":"CE8","lv":"E","ph":"its","trap":"its","vs":"it's","vsmean":"= it is / it has","ex":"The dog wagged ___ tail.","mean":"belonging to it (possessive)","mcq":["a short form of 'it is'","a short form of 'it has'","belonging to them"],"note":"its = possessive (no apostrophe); it's = it is / it has.","reg":"","vsex":"<b>It's</b> raining again this afternoon."},{"id":"CE9","lv":"E","ph":"it's","trap":"it's","vs":"its","vsmean":"belonging to it","ex":"___ raining again.","mean":"the short form of 'it is' or 'it has'","mcq":["belonging to it","belonging to them","over there"],"note":"it's = it is / it has; its = possessive.","reg":"","vsex":"The dog wagged <b>its</b> tail happily."},{"id":"CE10","lv":"E","ph":"then","trap":"then","vs":"than","vsmean":"used in comparisons","ex":"We ate, and ___ we left.","mean":"at that time; next; in that case","mcq":["used to compare two things","at this moment","in addition"],"note":"then = time/sequence; than = comparison.","reg":"","vsex":"She is taller <b>than</b> her brother."},{"id":"CE11","lv":"E","ph":"than","trap":"than","vs":"then","vsmean":"at that time / next","ex":"She is taller ___ her brother.","mean":"used to introduce the second part of a comparison","mcq":["at that time","after that","in that case"],"note":"than = comparison; then = time.","reg":"","vsex":"We ate dinner, and <b>then</b> we left."},{"id":"CE12","lv":"E","ph":"to","trap":"to","vs":"too / two","vsmean":"also / the number 2","ex":"I'm going ___ the shop.","mean":"expressing direction or a recipient; part of an infinitive","mcq":["also, or excessively","the number 2","in addition"],"note":"to = direction/infinitive; too = also/excessive; two = 2.","reg":"","vsex":"I bought <b>two</b> tickets for the show."},{"id":"CE13","lv":"E","ph":"too","trap":"too","vs":"to / two","vsmean":"direction / the number 2","ex":"It's ___ hot to go out.","mean":"also, or more than is wanted","mcq":["expressing direction","the number 2","before a verb"],"note":"too = also/excessive; to = direction; two = 2.","reg":"","vsex":"I'm going <b>to</b> the shop now."},{"id":"CE14","lv":"E","ph":"two","trap":"two","vs":"to / too","vsmean":"direction / also","ex":"I have ___ sisters.","mean":"the number 2","mcq":["also, or excessively","expressing direction","in addition"],"note":"two = 2; to = direction; too = also.","reg":"","vsex":"That dessert is <b>too</b> sweet for me."},{"id":"CE15","lv":"E","ph":"lose","trap":"lose","vs":"loose","vsmean":"not tight","ex":"Don't ___ your keys.","mean":"(verb) to no longer have something; to be defeated","mcq":["not firmly fixed; slack","to set free","to tie up"],"note":"lose = verb (mislay); loose = adjective (not tight). One 'o' vs two.","reg":"","vsex":"My shoelaces are too <b>loose</b> to run in."},{"id":"CE16","lv":"E","ph":"loose","trap":"loose","vs":"lose","vsmean":"to mislay / be defeated","ex":"This screw is ___.","mean":"not firmly fixed in place; not tight","mcq":["to no longer have something","to be defeated","to tighten"],"note":"loose = not tight (adjective); lose = verb.","reg":"","vsex":"Don't <b>lose</b> your keys again."},{"id":"CE17","lv":"E","ph":"accept","trap":"accept","vs":"except","vsmean":"apart from","ex":"I ___ your apology.","mean":"to agree to receive or take something","mcq":["not including; apart from","to object to","to leave out"],"note":"accept = receive; except = apart from.","reg":"","vsex":"Everyone came <b>except</b> Maria."},{"id":"CE18","lv":"E","ph":"except","trap":"except","vs":"accept","vsmean":"to receive willingly","ex":"Everyone came ___ Tom.","mean":"not including; apart from","mcq":["to agree to receive","to welcome","to include"],"note":"except = apart from; accept = receive.","reg":"","vsex":"I will gladly <b>accept</b> your offer."},{"id":"CE19","lv":"E","ph":"advice","trap":"advice","vs":"advise","vsmean":"(verb) to recommend","ex":"Let me give you some ___.","mean":"(noun) a suggestion about what to do","mcq":["(verb) to recommend a course of action","a warning","a decision"],"note":"advice = noun; advise = verb. (c/s)","reg":"","vsex":"Doctors <b>advise</b> rest after surgery."},{"id":"CE20","lv":"E","ph":"advise","trap":"advise","vs":"advice","vsmean":"(noun) a recommendation","ex":"I ___ you to wait.","mean":"(verb) to recommend what someone should do","mcq":["(noun) a helpful suggestion","to warn of danger","to decide for someone"],"note":"advise = verb; advice = noun.","reg":"","vsex":"She gave me excellent <b>advice</b> about the job."},{"id":"CE21","lv":"E","ph":"breath","trap":"breath","vs":"breathe","vsmean":"(verb) to take in air","ex":"Take a deep ___.","mean":"(noun) air taken into or let out of the lungs","mcq":["(verb) to inhale and exhale","a short rest","a gust of wind"],"note":"breath = noun; breathe = verb.","reg":"","vsex":"Try to <b>breathe</b> slowly and relax."},{"id":"CE22","lv":"E","ph":"breathe","trap":"breathe","vs":"breath","vsmean":"(noun) air in the lungs","ex":"Remember to ___ slowly.","mean":"(verb) to take air into the lungs and let it out","mcq":["(noun) a single intake of air","to hold still","to sigh"],"note":"breathe = verb; breath = noun.","reg":"","vsex":"Take a deep <b>breath</b> before you speak."},{"id":"CE23","lv":"E","ph":"quiet","trap":"quiet","vs":"quite","vsmean":"fairly; completely","ex":"Please be ___ in the library.","mean":"making little or no noise","mcq":["fairly; to a degree","very; completely","nearby"],"note":"quiet = silent; quite = fairly.","reg":"","vsex":"The lecture was <b>quite</b> long today."},{"id":"CE24","lv":"E","ph":"quite","trap":"quite","vs":"quiet","vsmean":"making little noise","ex":"The film was ___ good.","mean":"to a fairly or considerable degree","mcq":["making little noise","calm and peaceful","still"],"note":"quite = fairly; quiet = silent.","reg":"","vsex":"Please keep <b>quiet</b> in the library."},{"id":"CE25","lv":"E","ph":"desert","trap":"desert","vs":"dessert","vsmean":"a sweet course","ex":"Camels live in the ___.","mean":"(noun) a dry, sandy region with little rain","mcq":["a sweet dish after a meal","a tropical island","a mountain range"],"note":"desert (one s) = dry land; dessert (two s) = sweet. Also desert = abandon.","reg":"","vsex":"We had chocolate cake for <b>dessert</b>."},{"id":"CE26","lv":"E","ph":"dessert","trap":"dessert","vs":"desert","vsmean":"dry sandy land","ex":"We had ice cream for ___.","mean":"the sweet course at the end of a meal","mcq":["a dry sandy region","to abandon someone","a main course"],"note":"dessert (two s) = sweet; desert (one s) = dry land.","reg":"","vsex":"Few plants grow in the dry <b>desert</b>."},{"id":"CE27","lv":"E","ph":"principal","trap":"principal","vs":"principle","vsmean":"a rule or belief","ex":"The school ___ gave a speech.","mean":"(noun) the head of a school; (adj) main or most important","mcq":["a basic rule or belief","a moral standard","a general truth"],"note":"principal = head/main; principle = rule.","reg":"","vsex":"She acted on <b>principle</b>, not for money."},{"id":"CE28","lv":"E","ph":"principle","trap":"principle","vs":"principal","vsmean":"head of a school / main","ex":"She refused on ___.","mean":"a basic rule, belief, or moral standard","mcq":["the head of a school","the main or chief one","a sum of money"],"note":"principle = rule; principal = head/main.","reg":"","vsex":"The school <b>principal</b> gave a speech."},{"id":"CE29","lv":"E","ph":"weather","trap":"weather","vs":"whether","vsmean":"if (introducing a choice)","ex":"The ___ is lovely today.","mean":"the state of the atmosphere — rain, sun, wind and so on","mcq":["if; introducing alternatives","either of two options","despite the fact that"],"note":"weather = climate; whether = if.","reg":"","vsex":"I can't decide <b>whether</b> to stay or go."},{"id":"CE30","lv":"E","ph":"whether","trap":"whether","vs":"weather","vsmean":"rain, sun, wind","ex":"I don't know ___ to go.","mean":"used to introduce a choice between alternatives","mcq":["the state of the atmosphere","a storm","the climate"],"note":"whether = if; weather = climate.","reg":"","vsex":"The <b>weather</b> was sunny all weekend."},{"id":"CE31","lv":"E","ph":"here","trap":"here","vs":"hear","vsmean":"to perceive sound","ex":"Come ___ and sit down.","mean":"in, at, or to this place","mcq":["to perceive sound with the ears","to listen","over there"],"note":"here = place; hear = perceive sound.","reg":"","vsex":"Did you <b>hear</b> that strange noise?"},{"id":"CE32","lv":"E","ph":"hear","trap":"hear","vs":"here","vsmean":"this place","ex":"I can't ___ you clearly.","mean":"to perceive sound with your ears","mcq":["in this place","to listen on purpose","to speak"],"note":"hear = perceive sound; here = place. ('hear' has 'ear' in it.)","reg":"","vsex":"Please come over <b>here</b> for a moment."},{"id":"CE33","lv":"E","ph":"buy","trap":"buy","vs":"by / bye","vsmean":"beside / farewell","ex":"I need to ___ some milk.","mean":"to get something by paying for it","mcq":["beside or near","a short goodbye","through the agency of"],"note":"buy = purchase; by = beside/via; bye = goodbye.","reg":"","vsex":"I walked <b>by</b> the old bakery."},{"id":"CE34","lv":"E","ph":"by","trap":"by","vs":"buy / bye","vsmean":"purchase / farewell","ex":"The book was written ___ her.","mean":"beside, near, or indicating who did something","mcq":["to purchase something","a short goodbye","to sell"],"note":"by = beside/via; buy = purchase; bye = goodbye.","reg":"","vsex":"I need to <b>buy</b> some milk today."},{"id":"CE35","lv":"E","ph":"know","trap":"know","vs":"no","vsmean":"the opposite of yes","ex":"Do you ___ the answer?","mean":"to have information or understanding in your mind","mcq":["the opposite of yes","not any","a refusal"],"note":"know = understand; no = negative. (k is silent)","reg":"","vsex":"There are <b>no</b> seats left on the bus."},{"id":"CE36","lv":"E","ph":"no","trap":"no","vs":"know","vsmean":"to have knowledge","ex":"There are ___ seats left.","mean":"not any; used to give a negative answer","mcq":["to have understanding","to recognise someone","to be aware"],"note":"no = negative; know = understand.","reg":"","vsex":"Do you <b>know</b> the way to the station?"},{"id":"CE37","lv":"E","ph":"write","trap":"write","vs":"right","vsmean":"correct / a direction","ex":"Please ___ your name here.","mean":"to form letters or words on a surface","mcq":["correct; not wrong","the opposite of left","a legal entitlement"],"note":"write = put words down; right = correct/direction.","reg":"","vsex":"Turn <b>right</b> at the next corner."},{"id":"CE38","lv":"E","ph":"right","trap":"right","vs":"write","vsmean":"to put words down","ex":"You got the answer ___.","mean":"correct; or the opposite of left","mcq":["to form words on paper","to compose a letter","to spell"],"note":"right = correct/direction; write = put words down.","reg":"","vsex":"Please <b>write</b> your name at the top."},{"id":"CE39","lv":"E","ph":"peace","trap":"peace","vs":"piece","vsmean":"a portion","ex":"After the war came ___.","mean":"freedom from war or disturbance; calm","mcq":["a part or portion of something","a musical work","a coin"],"note":"peace = calm; piece = portion. ('piece of pie')","reg":"","vsex":"May I have a <b>piece</b> of cake?"},{"id":"CE40","lv":"E","ph":"piece","trap":"piece","vs":"peace","vsmean":"calm; no war","ex":"Have a ___ of cake.","mean":"a part or portion of something","mcq":["freedom from conflict","quiet and calm","harmony"],"note":"piece = portion; peace = calm.","reg":"","vsex":"The country finally found <b>peace</b> after the war."},{"id":"CE41","lv":"E","ph":"flour","trap":"flour","vs":"flower","vsmean":"a bloom","ex":"Add two cups of ___ to the dough.","mean":"powder made from ground grain, used in baking","mcq":["the coloured part of a plant","a blossom","a scent"],"note":"flour = baking powder; flower = blossom.","reg":"","vsex":"She picked a yellow <b>flower</b> from the garden."},{"id":"CE42","lv":"E","ph":"flower","trap":"flower","vs":"flour","vsmean":"baking powder","ex":"She picked a ___ from the garden.","mean":"the coloured, often scented part of a plant","mcq":["ground grain for baking","a type of bread","wheat"],"note":"flower = blossom; flour = baking powder.","reg":"","vsex":"Mix the <b>flour</b> with the eggs and sugar."},{"id":"CE43","lv":"E","ph":"whole","trap":"whole","vs":"hole","vsmean":"an opening","ex":"She ate the ___ cake.","mean":"complete; entire","mcq":["a hollow opening or gap","a pit in the ground","a tear"],"note":"whole = entire; hole = opening.","reg":"","vsex":"There was a <b>hole</b> in my sock."},{"id":"CE44","lv":"E","ph":"hole","trap":"hole","vs":"whole","vsmean":"complete; entire","ex":"There's a ___ in my sock.","mean":"a hollow space or opening in something","mcq":["complete and entire","the full amount","undivided"],"note":"hole = opening; whole = entire.","reg":"","vsex":"He ate the <b>whole</b> pizza by himself."},{"id":"CE45","lv":"E","ph":"brake","trap":"brake","vs":"break","vsmean":"to shatter / a pause","ex":"Press the ___ to stop the car.","mean":"a device for slowing or stopping a vehicle","mcq":["to separate into pieces","a short rest","an opportunity"],"note":"brake = stop a vehicle; break = shatter/pause.","reg":"","vsex":"Don't <b>break</b> the vase, it's fragile."},{"id":"CE46","lv":"E","ph":"break","trap":"break","vs":"brake","vsmean":"a car's stopping device","ex":"Be careful not to ___ /b> did you put my phone?"},{"id":"CE52","lv":"E","ph":"where","trap":"where","vs":"wear / were","vsmean":"have clothes on / past of 'be'","ex":"___ did you leave the keys?","mean":"in, at, or to what place","mcq":["to have clothing on","the past tense of 'are'","to put on"],"note":"where = place; wear = have on; were = past of 'are'.","reg":"","vsex":"I will <b>wear</b> my blue coat today."},{"id":"CE53","lv":"E","ph":"were","trap":"were","vs":"where / we're","vsmean":"in what place / we are","ex":"They ___ late again.","mean":"the past tense of 'are'","mcq":["in what place","a short form of 'we are'","to have clothes on"],"note":"were = past of 'are'; where = place; we're = we are.","reg":"","vsex":"<b>Where</b> are the other guests?"},{"id":"CE54","lv":"E","ph":"we're","trap":"we're","vs":"were / where","vsmean":"past of 'are' / a place","ex":"___ almost home now.","mean":"the short form of 'we are'","mcq":["the past tense of 'are'","in what place","belonging to us"],"note":"we're = we are; were = past of 'are'; where = place.","reg":"","vsex":"They <b>were</b> late for the meeting."},{"id":"CE55","lv":"E","ph":"made","trap":"made","vs":"maid","vsmean":"a servant","ex":"She ___ a cake for the party.","mean":"(verb) the past tense of 'make' — created or produced","mcq":["a female servant","a young woman","a cleaner"],"note":"made = created; maid = servant.","reg":"","vsex":"The hotel <b>maid</b> cleaned our room."},{"id":"CE56","lv":"E","ph":"maid","trap":"maid","vs":"made","vsmean":"created; produced","ex":"The hotel ___ cleaned the room.","mean":"a woman employed to do housework","mcq":["created something","the past tense of 'make'","produced"],"note":"maid = servant; made = created.","reg":"","vsex":"He <b>made</b> a cake for the party."},{"id":"CE57","lv":"E","ph":"meat","trap":"meat","vs":"meet","vsmean":"to come together","ex":"He doesn't eat ___.","mean":"the flesh of animals eaten as food","mcq":["to come together with someone","to be introduced","to gather"],"note":"meat = food; meet = come together. ('eat' is in meat.)","reg":"","vsex":"Let's <b>meet</b> at the cafe at noon."},{"id":"CE58","lv":"E","ph":"meet","trap":"meet","vs":"meat","vsmean":"animal flesh as food","ex":"Let's ___ at noon.","mean":"to come together with someone","mcq":["animal flesh as food","beef or chicken","a meal"],"note":"meet = come together; meat = food.","reg":"","vsex":"She doesn't eat <b>meat</b> anymore."},{"id":"CE59","lv":"E","ph":"week","trap":"week","vs":"weak","vsmean":"not strong","ex":"I'll see you next ___.","mean":"a period of seven days","mcq":["not strong; feeble","lacking power","frail"],"note":"week = seven days; weak = not strong.","reg":"","vsex":"After the flu, I still felt <b>weak</b>."},{"id":"CE60","lv":"E","ph":"weak","trap":"weak","vs":"week","vsmean":"seven days","ex":"He felt ___ after the illness.","mean":"lacking strength or power","mcq":["a period of seven days","a working period","a span of days"],"note":"weak = not strong; week = seven days.","reg":"","vsex":"We're going on holiday next <b>week</b>."},{"id":"CE61","lv":"E","ph":"bored","trap":"bored","vs":"board","vsmean":"a plank / to get on","ex":"The children were ___ during the long trip.","mean":"feeling weary because nothing interesting is happening","mcq":["a flat piece of wood","to get on a plane or ship","a committee"],"note":"bored = uninterested; board = plank / get on.","reg":"","vsex":"We need to <b>board</b> the train now."},{"id":"CE62","lv":"E","ph":"board","trap":"board","vs":"bored","vsmean":"feeling uninterested","ex":"We ___ the train at nine.","mean":"to get on a vehicle; or a flat piece of wood","mcq":["feeling weary and uninterested","tired of something","restless"],"note":"board = get on/plank; bored = uninterested.","reg":"","vsex":"The long lecture left me feeling <b>bored</b>."},{"id":"CE63","lv":"E","ph":"allowed","trap":"allowed","vs":"aloud","vsmean":"out loud","ex":"Phones are not ___ in class.","mean":"permitted; given permiss ":"The potion smelled truly <b>vile</b>."},{"id":"CX89","lv":"X","ph":"vile","trap":"vile","vs":"vial","vsmean":"a small medicine bottle","ex":"The betrayal was a ___ act.","mean":"extremely unpleasant; morally bad","mcq":["a small glass medicine container","a little phial","a specimen bottle"],"note":"vile = disgusting; vial = small bottle.","reg":"","vsex":"She filled a small glass <b>vial</b> with the serum."},{"id":"CX90","lv":"X","ph":"wraith","trap":"wraith","vs":"wreath","vsmean":"a ring of flowers or leaves","ex":"A pale ___ seemed to drift through the hall.","mean":"a ghost or ghostly apparition","mcq":["a ring of flowers or leaves","a garland for a door","a circular arrangement of foliage"],"note":"wraith = ghost; wreath = ring of flowers.","reg":"","vsex":"They hung a <b>wreath</b> of holly on the door."},{"id":"CX91","lv":"X","ph":"wreath","trap":"wreath","vs":"wraith","vsmean":"a ghost","ex":"They laid a ___ at the memorial.","mean":"an arrangement of flowers or leaves in a ring","mcq":["a ghostly apparition","a spectral figure","a phantom"],"note":"wreath = ring of flowers; wraith = ghost.","reg":"","vsex":"A pale <b>wraith</b> drifted through the hall."},{"id":"CM200","lv":"M","ph":"all together","trap":"together","vs":"altogether","vsmean":"completely; in total","ex":"The family was all ___ for the holidays.","mean":"all in one place or all at once (as a group)","mcq":["completely or entirely","in total; on the whole","wholly"],"note":"all together = as a group; altogether = completely.","reg":"","vsex":"The paint was <b>altogether</b> too dark."},{"id":"CM201","lv":"M","ph":"altogether","trap":"altogether","vs":"all together","vsmean":"as a group; in one place","ex":"That's a ___ different problem.","mean":"completely; entirely; in total","mcq":["all in one place as a group","everyone gathered","all at once together"],"note":"altogether = completely; all together = as a group.","reg":"","vsex":"The family sat <b>all together</b> at one table."},{"id":"CM202","lv":"M","ph":"everyday","trap":"everyday","vs":"every day","vsmean":"on each day (two words)","ex":"These are my ___ shoes.","mean":"(adjective) ordinary; used or happening routinely","mcq":["on each successive day","daily, as separate words","happening once a day"],"note":"everyday (one word) = ordinary (adj); every day (two words) = each day.","reg":"","vsex":"I walk to work <b>every day</b>."},{"id":"CE200","lv":"E","ph":"a lot","trap":"lot","vs":"alot","vsmean":"a common misspelling","ex":"Thanks a ___ for your help.","mean":"a large number or amount (always two words)","mcq":["the correct one-word spelling","an accepted single word","a valid compound"],"note":"'a lot' is always two words; 'alot' is not a word.","reg":""},{"id":"CE201","lv":"E","ph":"everyone","trap":"everyone","vs":"every one","vsmean":"each individual one (two words)","ex":"___ enjoyed the party.","mean":"every person; everybody (one word)","mcq":["each single one of a group of things","each item considered separately","every single thing"],"note":"everyone (one word) = everybody; every one (two words) = each individual thing.","reg":"","vsex":"I thanked <b>every one</b> of the volunteers."}];

const BY = Object.fromEntries(BANK.map(b => [b.id, b]));
const LV = {E:"Easy", M:"Medium", H:"Hard", X:"Difficult"};
const LVORDER = ["E","M","H","X"];
const DAY = 86400000, INT = [3, 10, 30];
const KEY = "confusables-500-v1";
const DEFAULTS = {need:3, reset:true, level:"all", face:"meaning", autoface:true};
const fresh = () => ({v:1, upd:0, settings:{...DEFAULTS}, q:{}, streak:{count:0,last:""}, mocks:[]});

/* ---------- storage ---------- */
function normalize(s){
  if(!s || s.v !== 1 || typeof s.q !== "object") return fresh();
  s.settings = {...DEFAULTS, ...(s.settings||{})};
  if(!s.streak || typeof s.streak!=="object") s.streak={count:0,last:""};
  if(!Array.isArray(s.mocks)) s.mocks=[];
  for(const id in s.q){
    const r = s.q[id];
    if(r.st === "fixed" && r.stage === undefined && r.due === undefined){ r.stage = 0; r.due = (r.fixedAt || Date.now()) + INT[0]*DAY; }
  }
  return s;
}
function loadLocal(){ try{ const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){} return fresh(); }
let state = loadLocal();
const remote = {doc:null, busy:false, dirty:false, timer:null};
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function persist(){ state.upd = Date.now(); saveLocal(); if(remote.doc){ remote.dirty = true; clearTimeout(remote.timer); remote.timer = setTimeout(flush, 1200); } }

/* ---------- daily streak ---------- */
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function daysBetween(a,b){ // a,b are dayKeys; returns whole days from a to b
  const pa=a.split("-").map(Number), pb=b.split("-").map(Number);
  const da=Date.UTC(pa[0],pa[1]-1,pa[2]), db=Date.UTC(pb[0],pb[1]-1,pb[2]);
  return Math.round((db-da)/86400000);
}
function touchStreak(){
  const today=dayKey(Date.now());
  const st=state.streak || (state.streak={count:0,last:""});
  if(st.last===today) return;            // already counted today
  if(!st.last){ st.count=1; }
  else{
    const gap=daysBetween(st.last, today);
    if(gap===1) st.count=(st.count||0)+1; // consecutive day
    else if(gap>1) st.count=1;            // missed a day: reset
    // gap<=0 (clock oddities): leave count, just update last
  }
  st.last=today;
  persist();
}
async function flush(){
  if(!remote.doc) return;
  if(remote.busy){ remote.dirty = true; return; }
  remote.busy = true; remote.dirty = false;
  try{ await remote.doc.set({json: JSON.stringify(state), upd: state.upd}); setStatus("Synced to your account"); }
  catch(e){ setStatus("Account sync failed; saved on this device"); }
  remote.busy = false;
  if(remote.dirty){ clearTimeout(remote.timer); remote.timer = setTimeout(flush, 1200); }
}
function setStatus(t){ const f = document.getElementById("remoteStatus"); if(f) f.textContent = t; }
(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    remote.doc = db.collection("data/users/" + id).doc("progress");
    const snap = await remote.doc.get();
    if(snap.exists){
      const d = snap.data() || {}; let rs = null;
      try{ rs = normalize(JSON.parse(d.json)); }catch(e){}
      if(rs && (rs.upd||0) > (state.upd||0)){ state = rs; saveLocal(); cur = null; render(); }
      else if((state.upd||0) > ((rs && rs.upd)||0)){ flush(); }
    }else if((state.upd||0) > 0){ flush(); }
    setStatus("Synced to your account");
  }catch(e){ setStatus("Account sync unavailable; saved on this device only"); }
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = rand(i+1); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"}) : "";
const rel = ts => { if(!ts) return ""; const d=Date.now()-ts; if(d<60000) return "just now"; if(d<3600000){ const m=Math.floor(d/60000); return m+(m===1?" min ago":" mins ago"); } const h=Math.floor(d/3600000); if(h<24) return h+(h===1?" hour ago":" hours ago"); const dd=Math.floor(d/86400000); if(dd===1) return "yesterday"; if(dd<30) return dd+" days ago"; return "on "+fmtDate(ts); };
const need = () => state.settings.need;
const inLevel = b => { const l = state.settings.level; return l==="all" || b.lv===l; };
const isDue = r => r && r.st==="fixed" && r.due && r.due <= Date.now();
const tagHtml = b => '<span class="tag '+b.lv+'">'+LV[b.lv]+'</span>' + (b.reg? ' <span class="tag reg">'+esc(b.reg)+'</span>':'');
const pips = n => '<span class="pips" aria-hidden="true">' + Array.from({length:need()},(_,i)=>'<span class="pip'+(i<n?' on':'')+'"></span>').join("") + "</span>";

const poolNew    = () => BANK.filter(b => inLevel(b) && !state.q[b.id]);
const poolReview = () => BANK.filter(b => inLevel(b) && state.q[b.id] && state.q[b.id].st !== "err");
const poolErr    = () => BANK.filter(b => state.q[b.id] && state.q[b.id].st === "err");
const poolDue    = () => BANK.filter(b => isDue(state.q[b.id]));
const poolFix    = () => poolErr().concat(poolDue());

/* ---------- MCQ distractor assembly ---------- */
/* Each item ships 3 hand-written confusable wrong meanings in b.mcq.
   We also sometimes swap in a real meaning from another word of the SAME tier,
   so the learner can't rely on "the odd one out" phrasing. */
function makeMeaningOptions(b){
  const opts = [{t:b.mean, ok:true}];
  const own = shuffle(b.mcq).slice(0,3).map(t => ({t, ok:false}));
  // 1-in-3 chance: replace one authored distractor with a real sibling meaning (same tier, different id)
  if(rand(3)===0){
    const sib = shuffle(BANK.filter(x => x.lv===b.lv && x.id!==b.id && norm(x.mean)!==norm(b.mean)));
    if(sib.length){ own[0] = {t:sib[0].mean, ok:false}; }
  }
  return shuffle(opts.concat(own));
}
/* For "reverse" gap on meaning face we don't use MCQ; meaning face = recall with reveal. */

/* ---------- variant rotation (same word, alt sentence) ---------- */
function gapSentence(b, useAlt){
  if(useAlt && b.w) return {q:b.w, a:b.wa};
  return {q:b.ex, a:[b.trap]};
}

/* ---------- session state ---------- */
let tab = "practice";
let cur = null;     // {mode,id,face,phase,q,a,options,chosen,ok,typed,revealed,retired,passed,useAlt}
let lastId = null;
let reviewMode = false;
let ui = {settings:false, confirmReset:false};

function faceFor(b){
  // auto: new & easy → meaning first; else rotate meaning/gap/mcq by what's informative
  if(!state.settings.autoface) return state.settings.face;
  const r = state.q[b.id];
  if(!r) return "meaning";                 // first contact: learn the meaning
  if(r.st === "err") return "gap";         // errors: drill the exact form
  // known items: alternate mcq and gap to keep both faces fresh
  return (r.att % 2 === 0) ? "mcq" : "gap";
}

function pickNext(){
  if(tab === "fix"){
    let p = poolFix(); if(!p.length) return null;
    if(p.length > 1) p = p.filter(b => b.id !== lastId);
    const b = p[rand(p.length)], r = state.q[b.id];
    const mode = r.st==="err" ? "fix" : "recheck";
    const face = r.st==="err" ? "gap" : "mcq";   // fix exact form by typing; recheck meaning by MCQ
    return build(b, mode, face);
  }
  const p = reviewMode ? poolReview() : poolNew();
  if(!p.length) return null;
  let pool = p.length>1 ? p.filter(b=>b.id!==lastId) : p;
  const b = pool[rand(pool.length)];
  return build(b, reviewMode?"review":"practice", faceFor(b));
}

function build(b, mode, face){
  const c = {mode, id:b.id, face, phase:"ask", revealed:false, chosen:null, typed:"", ok:null};
  if(face === "gap"){
    const useAlt = !!(b.w && rand(2)===0);
    const g = gapSentence(b, useAlt);
    c.q = g.q; c.a = g.a; c.useAlt = useAlt;
  }else if(face === "mcq"){
    c.options = makeMeaningOptions(b);
  }
  return c;
}

/* ---------- apply result (shared) ---------- */
function applyResult(b, ok, typed, mode){
  let r = state.q[b.id];
  if(!r) r = state.q[b.id] = {st:"ok", att:0, miss:0, first:ok, streak:0, wrong:[]};
  r.att++; state.lastSeen = Date.now();
  const out = {retired:false, passed:false};
  if(ok){
    if(r.st === "err" && mode === "fix"){
      r.streak++;
      if(r.streak >= need()){ r.st="fixed"; r.fixedAt=Date.now(); r.stage=0; r.due=Date.now()+INT[0]*DAY; out.retired=true; }
    }else if(r.st === "fixed" && mode === "recheck"){
      r.stage = (r.stage||0)+1;
      r.due = r.stage < INT.length ? Date.now()+INT[r.stage]*DAY : null;
      out.passed = true;
    }
  }else{
    r.miss++; r.lastMiss=Date.now();
    if(typed && !r.wrong.includes(typed)) r.wrong.push(typed);
    if(r.st==="fixed") r.relapses=(r.relapses||0)+1;
    r.st="err"; delete r.due; delete r.stage;
    if(state.settings.reset || mode!=="fix") r.streak=0;
  }
  return out;
}

/* mark a word as already known: goes straight to learned, never tested */
function markKnown(id){
  const b=BY[id]; if(!b) return;
  state.q[id]={st:"known", att:0, miss:0, first:true, streak:0, wrong:[], known:true};
  persist();
}
function unmarkKnown(id){ if(state.q[id] && state.q[id].known){ delete state.q[id]; persist(); } }


/* ---------- submit ---------- */
function gradeGap(c){
  const b = BY[c.id];
  const typed = norm(c.typed);
  const ok = c.a.map(norm).includes(typed) && typed!=="";
  c.ok = ok; c.phase = "done";
  const res = applyResult(b, ok, c.typed.trim(), c.mode); touchStreak();
  c.retired = res.retired; c.passed = res.passed;
  persist(); render();
}
function chooseMcq(c, idx){
  if(c.phase==="done") return;
  const b = BY[c.id];
  c.chosen = idx;
  const ok = c.options[idx].ok;
  c.ok = ok; c.phase = "done";
  const res = applyResult(b, ok, ok?"":"(wrong meaning)", c.mode); touchStreak();
  c.retired = res.retired; c.passed = res.passed;
  persist(); render();
}
function fillEx(ex, word){
  const parts = String(ex).split("___");
  if(parts.length>1){ return esc(parts[0]) + '<b>' + esc(word||"") + '</b>' + esc(parts.slice(1).join("___")); }
  return esc(ex);
}
function exampleHtml(b){
  if(!b) return "";
  let rows = "";
  if(b.ex){ rows += '<p class="example"><span class="example-k">'+esc(b.ph)+'</span>'+fillEx(b.ex, b.trap||b.ph)+'</p>'; }
  if(b.vsex){ const vsw = String(b.vs||"").split("/")[0].trim(); rows += '<p class="example alt"><span class="example-k">'+esc(vsw)+'</span>'+b.vsex+'</p>'; }
  return rows ? '<div class="examples">'+rows+'</div>' : "";
}
function revealMeaning(c){
  c.revealed = true; render();
}
function gradeMeaning(c, got){
  const b = BY[c.id];
  c.ok = got; c.phase = "done";
  const res = applyResult(b, got, got?"":"(didn't recall)", c.mode); touchStreak();
  c.retired = res.retired; c.passed = res.passed;
  persist(); render();
}
function next(){ lastId = cur? cur.id : lastId; cur = pickNext(); render(); }
function skip(){ lastId = cur? cur.id : lastId; cur = pickNext(); render(); }

/* ---------- render: question faces ---------- */
function blankedHtml(q, typed, state2, answer, inputId){
  // state2: null (input) | 'ok' | 'bad'
  const parts = q.split("___");
  const pre = esc(parts[0]||""), post = esc(parts[1]||"");
  let mid;
  if(state2==="ok"){ mid = '<span class="slot ok">'+esc(typed)+'</span>'; }
  else if(state2==="bad"){ mid = '<span class="slot bad"><del>'+esc(typed||"—")+'</del><ins>'+esc(answer)+'</ins></span>'; }
  else { mid = '<span class="slot"><input class="blank" id="'+(inputId||"blankInput")+'" autocomplete="off" autocapitalize="none" spellcheck="false" value="'+esc(typed)+'"></span>'; }
  return pre + mid + post;
}

function knowBtn(){
  if(tab==="fix") return "";
  return '<button class="link" id="btnKnow" title="Mark as already known">I know it ✓</button>';
}
function faceSwitchHtml(c){
  if(tab==="fix") return "";   // fix mode dictates its own face
  const f = c.face;
  const mk = (id,lab)=>'<button data-face="'+id+'" aria-pressed="'+(f===id)+'">'+lab+'</button>';
  return '<div class="faces" role="group" aria-label="Test face">'+mk("meaning","Meaning")+mk("gap","Gap-fill")+mk("mcq","MCQ")+'</div>';
}

function renderQuestion(){
  const c = cur, b = BY[c.id];
  const r = state.q[b.id];
  const streak = r && r.st==="err" ? (r.streak||0) : 0;
  let metaRight = "";
  if(c.mode==="fix") metaRight = '<span class="hint">Recovery '+pips(streak)+'</span>';
  else if(c.mode==="recheck") metaRight = '<span class="hint">Spaced recheck</span>';

  let inner = "";
  const meta = '<div class="meta">'+tagHtml(b)+(metaRight?'<span style="margin-left:auto">'+metaRight+'</span>':'<span style="margin-left:auto">'+faceSwitchHtml(c)+'</span>')+'</div>';

  if(c.face==="meaning"){
    inner = '<p class="prompt">'+esc(b.ph)+(b.vs?' <span style="color:var(--ink2);font-size:.6em">vs '+esc(b.vs)+'</span>':'')+'</p>';
    if(!c.revealed){
      inner += '<p class="sub">Recall which is which, then reveal.</p>';
      inner += '<div class="actions"><button class="btn" id="btnReveal">Reveal meaning</button><button class="link" id="btnSkip">Skip</button>'+knowBtn()+'</div>';
    }else{
      inner += '<div class="reveal">'+esc(b.mean)+'</div>';
      inner += exampleHtml(b);
      if(b.note) inner += '<p class="origin-note">'+esc(b.note)+'</p>';
      if(c.phase!=="done"){
        inner += '<p class="sub">Did you recall it correctly?</p>';
        inner += '<div class="actions"><button class="btn" id="btnGotit">I knew it</button><button class="ghost" id="btnMissed" style="min-height:44px">I didn\'t</button></div>';
      }else{
        inner += feedbackHtml(c);
      }
    }
  }
  else if(c.face==="gap"){
    inner = '<p class="sub">Choose the correct word for the blank.</p>';
    if(c.phase!=="done"){
      inner += '<p class="sentence">'+blankedHtml(c.q, c.typed, null)+'</p>';
      inner += '<div class="actions"><button class="btn" id="btnCheck">Check</button><button class="link" id="btnSkip">Skip</button>'+knowBtn()+'</div>';
    }else{
      inner += '<p class="sentence">'+blankedHtml(c.q, c.typed, c.ok?"ok":"bad", c.a[0])+'</p>';
      inner += feedbackHtml(c);
    }
  }
  else if(c.face==="mcq"){
    inner = '<p class="prompt">'+esc(b.ph)+(b.vs?' <span style="color:var(--ink2);font-size:.6em">vs '+esc(b.vs)+'</span>':'')+'</p><p class="sub">Which meaning is correct?</p>';
    inner += '<div class="opts">';
    c.options.forEach((o,i)=>{
      let cls="opt";
      if(c.phase==="done"){
        if(o.ok) cls+=" correct";
        else if(i===c.chosen) cls+=" wrong";
      }
      const dis = c.phase==="done"?" disabled":"";
      inner += '<button class="'+cls+'" data-mcq="'+i+'"'+dis+'><kbd>'+String.fromCharCode(65+i)+'</kbd><span>'+esc(o.t)+'</span></button>';
    });
    inner += '</div>';
    if(c.phase==="done") inner += feedbackHtml(c);
    else inner += '<div class="actions"><button class="link" id="btnSkip">Skip</button>'+knowBtn()+'</div>';
  }
  return '<div class="card">'+meta+inner+'</div>';
}

function feedbackHtml(c){
  const b = BY[c.id];
  const ok = c.ok;
  let h = '<div class="fb '+(ok?"ok":"bad")+'">';
  if(c.retired){
    h += '<p class="celebrate">Recovered — back in rotation for spaced rechecks.</p>';
  }else if(c.passed){
    const r = state.q[b.id];
    h += '<p class="celebrate">'+(r.due?("Recheck passed — next in "+INT[r.stage-1]+" days."):"Fully mastered. Nice.")+'</p>';
  }else if(ok){
    h += '<p><strong>Correct.</strong></p>';
  }else{
    h += '<p><strong>Not quite.</strong></p>';
  }
  // always show the full word + meaning on completion
  h += '<p style="font-family:var(--serif);font-size:18px">'+esc(b.ph)+' — '+esc(b.mean)+'</p>';
  if(b.vs) h += '<p class="hint" style="margin-top:4px">Don\'t confuse with <b>'+esc(b.vs)+'</b>'+(b.vsmean?': '+esc(b.vsmean):'')+'.</p>';
  if(c.face!=="meaning" && b.note) h += '<p class="origin">'+esc(b.note)+'</p>';
  if(!ok && c.mode==="fix"){ const r=state.q[b.id]; h += '<p class="hint">Streak reset — '+pips(r.streak||0)+' of '+need()+' to recover.</p>'; }
  h += '</div>';
  h += '<div class="actions"><button class="btn" id="btnNext">Next word</button></div>';
  return h;
}

/* ---------- render: lists ---------- */
function listCard(b, showMeaning){
  const r = state.q[b.id] || {};
  const filled = (()=>{ const p=b.ex.split("___"); return esc(p[0])+'<b>'+esc(b.trap)+'</b>'+esc(p[1]); })();
  let m = tagHtml(b);
  if(b.vs) m += ' \u00b7 vs <i>'+esc(b.vs)+'</i>';
  if(r.known) m += ' · <span style="color:var(--green)">known</span> <button class="link" data-unknow="'+b.id+'" style="padding:0 4px;font-size:13px">undo</button>';
  if(r.wrong && r.wrong.length) m += ' · tried <span class="w">'+esc(r.wrong.join(", "))+'</span>';
  if(r.st==="err" && r.lastMiss) m += ' · missed '+rel(r.lastMiss);
  if(r.due) m += ' · recheck '+fmtDate(r.due);
  return '<li class="item"><p class="q">'+filled+'</p>'+(showMeaning?'<p class="mn">'+esc(b.mean)+'</p>':'')+'<div class="m">'+m+'</div></li>';
}


/* ================= MOCK TEST ================= */
/* A fresh 20-question test each generation. Reshuffled every time, never a fixed set.
   Mix of gap-fill and MCQ. Auto-graded. Misses go into the Fix queue. */
let mockState = null; // {qs:[{id,face,q,a,options,chosen,typed,ok}], i, done, started}
const MOCK_N = 20;

function mockPool(){
  // respect current tier filter; exclude items the user marked 'known' (they don't need testing)
  return BANK.filter(b => inLevel(b) && !(state.q[b.id] && state.q[b.id].known));
}
function buildMockQuestion(b){
  // 50/50 gap vs mcq; gap only if a clean blank exists (always true here)
  const face = rand(2)===0 ? "gap" : "mcq";
  if(face==="gap"){
    const useAlt = !!(b.w && rand(2)===0);
    const g = useAlt ? {q:b.w,a:b.wa} : {q:b.ex,a:[b.trap]};
    return {id:b.id, face:"gap", q:g.q, a:g.a, typed:"", ok:null};
  }
  return {id:b.id, face:"mcq", options:makeMeaningOptions(b), chosen:null, ok:null};
}
function generateMock(){
  const pool = shuffle(mockPool());
  const pick = pool.slice(0, Math.min(MOCK_N, pool.length));
  mockState = { qs: pick.map(buildMockQuestion), i:0, done:false, started:Date.now() };
  render();
}
function mockAnswerGap(){
  const q = mockState.qs[mockState.i];
  const inp = $("#mockBlank"); q.typed = inp ? inp.value : "";
  q.ok = q.a.map(norm).includes(norm(q.typed)) && norm(q.typed)!=="";
  mockAdvance();
}
function mockAnswerMcq(idx){
  const q = mockState.qs[mockState.i];
  if(q.ok!==null) return;
  q.chosen = idx; q.ok = q.options[idx].ok;
  render(); // show correct/wrong briefly, then user taps Next
}
function mockAdvance(){
  const q = mockState.qs[mockState.i];
  if(q.ok===null) return;
  if(mockState.i < mockState.qs.length-1){ mockState.i++; render(); }
  else finishMock();
}
function finishMock(){
  mockState.done = true;
  // feed wrong answers into the Fix queue (mark as error so they resurface)
  for(const q of mockState.qs){
    if(!q.ok){
      const b = BY[q.id];
      applyResult(b, false, q.typed? q.typed.trim() : "(mock miss)", "practice");
    }
  }
  // record this mock in history (keep last 30)
  const right=mockState.qs.filter(q=>q.ok).length;
  state.mocks=state.mocks||[];
  state.mocks.push({ts:Date.now(), right, total:mockState.qs.length, tier:state.settings.level});
  if(state.mocks.length>30) state.mocks=state.mocks.slice(-30);
  touchStreak();
  persist(); render();
}

function renderMock(){
  if(!mockState){
    const pool = mockPool().length;
    const n = Math.min(MOCK_N, pool);
    return '<div class="empty">'
      +'<h2>Mock test</h2>'
      +'<p>A fresh set of '+MOCK_N+' questions, reshuffled every time you generate one \u2014 no fixed paper. A mix of gap-fill and multiple choice, drawn from the <b>'+(state.settings.level==="all"?"whole bank":LV[state.settings.level]+" tier")+'</b>. Wrong answers are added to your Fix queue.</p>'
      +(pool<MOCK_N?'<p class="hint">Only '+pool+' words available in this tier, so the test will have '+n+' questions. Switch tier in Settings for a full set.</p>':'')
      +'<div class="actions"><button class="btn" id="mockGen"'+(pool===0?' disabled':'')+'>Generate a '+n+'-question test</button></div>'
      +'</div>';
  }
  if(mockState.done) return renderMockResult();
  // in progress
  const total = mockState.qs.length, i = mockState.i, q = mockState.qs[i], b = BY[q.id];
  let h = '<div class="chips"><b>Mock test</b> \u00b7 question '+(i+1)+' of '+total+'</div>';
  h += '<div class="prog" style="margin-bottom:14px"><i style="width:'+Math.round(i/total*100)+'%"></i></div>';
  h += '<div class="card"><div class="meta">'+tagHtml(b)+'<span style="margin-left:auto" class="hint">'+(q.face==="gap"?"Fill the blank":"Choose the meaning")+'</span></div>';
  if(q.face==="gap"){
    if(q.ok===null){
      h += '<p class="sentence">'+blankedHtml(q.q, q.typed, null, null, "mockBlank")+'</p>';
      h += '<div class="actions"><button class="btn" id="mockCheck">Answer</button></div>';
    }else{
      h += '<p class="sentence">'+blankedHtml(q.q, q.typed, q.ok?"ok":"bad", q.a[0])+'</p>';
      h += mockFeedback(q,b);
    }
  }else{
    h += '<p class="prompt">'+esc(b.ph)+'</p>';
    h += '<div class="opts">';
    q.options.forEach((o,idx)=>{
      let cls="opt";
      if(q.ok!==null){ if(o.ok) cls+=" correct"; else if(idx===q.chosen) cls+=" wrong"; }
      h += '<button class="'+cls+'" data-mockmcq="'+idx+'"'+(q.ok!==null?" disabled":"")+'><kbd>'+String.fromCharCode(65+idx)+'</kbd><span>'+esc(o.t)+'</span></button>';
    });
    h += '</div>';
    if(q.ok!==null) h += mockFeedback(q,b);
  }
  h += '</div>';
  return h;
}
function mockFeedback(q,b){
  let h = '<div class="fb '+(q.ok?"ok":"bad")+'"><p><strong>'+(q.ok?"Correct.":"Not quite.")+'</strong></p>';
  h += '<p style="font-family:var(--serif);font-size:18px">'+esc(b.ph)+' \u2014 '+esc(b.mean)+'</p></div>';
  const last = mockState.i===mockState.qs.length-1;
  h += '<div class="actions"><button class="btn" id="mockNext">'+(last?"See results":"Next question")+'</button></div>';
  return h;
}
function renderMockResult(){
  const qs = mockState.qs, right = qs.filter(q=>q.ok).length, total = qs.length;
  const pct = Math.round(right/total*100);
  const secs = Math.round((Date.now()-mockState.started)/1000);
  const mm = Math.floor(secs/60), ss = secs%60;
  let h = '<div class="card"><div class="score">'+right+'/'+total+'</div>';
  h += '<p class="hint">'+pct+'% \u00b7 taken in '+(mm?mm+"m ":"")+ss+'s. Missed words have been added to your Fix queue.</p>';
  h += '<div class="actions"><button class="btn" id="mockGen">New test</button><button class="ghost" id="mockToFix" style="min-height:44px">Go to Fix</button></div></div>';
  const wrong = qs.filter(q=>!q.ok);
  if(wrong.length){
    h += '<div class="panel"><h2>Review \u2014 '+wrong.length+' to revisit</h2><ul class="items">'+wrong.map(q=>{
      const b=BY[q.id], p=b.ex.split("___");
      const yours = q.face==="gap" ? (q.typed?('you wrote <span class="w">'+esc(q.typed)+'</span>'):'left blank')
                    : (q.chosen!=null?('you chose <span class="w">'+esc(q.options[q.chosen].t)+'</span>'):'');
      return '<li class="item"><p class="q">'+esc(p[0])+'<b>'+esc(b.trap)+'</b>'+esc(p[1])+'</p><p class="mn">'+esc(b.mean)+'</p><div class="m">'+tagHtml(b)+(yours?' \u00b7 '+yours:'')+'</div></li>';
    }).join("")+'</ul></div>';
  }else{
    h += '<div class="panel"><p class="celebrate" style="margin:0">Full marks \u2014 every answer correct.</p></div>';
  }
  return h;
}
function wireMock(){
  const on=(id,fn)=>{const e=$("#"+id); if(e) e.addEventListener("click",fn);};
  on("mockGen", generateMock);
  on("mockCheck", mockAnswerGap);
  on("mockNext", mockAdvance);
  on("mockToFix", ()=>{ tab="fix"; cur=null; mockState=null; render(); });
  document.querySelectorAll("[data-mockmcq]").forEach(btn=>btn.addEventListener("click",()=>mockAnswerMcq(+btn.dataset.mockmcq)));
  const mb=$("#mockBlank"); if(mb){ mb.focus(); mb.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); mockAnswerGap(); } }); }
}


/* ---------- overview strip ---------- */
function counts(){
  let nw=0, err=0, fixed=0, mastered=0;
  for(const b of BANK){
    const r=state.q[b.id];
    if(!r) nw++;
    else if(r.st==="err") err++;
    else if(r.st==="fixed"){ if(r.due===null) mastered++; else fixed++; }
    else fixed++;
  }
  return {nw,err,fixed,mastered,total:BANK.length};
}
function streakChip(){
  const st=state.streak||{count:0,last:""};
  const today=dayKey(Date.now());
  // show as active if last activity was today or yesterday (streak not yet broken)
  let n=st.count||0;
  if(st.last && st.last!==today && daysBetween(st.last,today)>1) n=0;
  if(n<=0) return "";
  const active = st.last===today;
  return '<span title="Day streak" style="margin-right:14px;color:'+(active?"var(--accent)":"var(--ink2)")+'">\u25C6 '+n+'-day streak'+(active?"":" (keep it up today)")+'</span>';
}
function renderOverview(){
  const c=counts();
  const seen=c.total-c.nw;
  const okw=c.fixed+c.mastered;
  const w=t=>Math.max(t>0?6:0, Math.round(t/c.total*100));
  const html = '<div class="strip" aria-hidden="true">'
    + '<i class="s-fix" style="width:'+w(okw)+'%"></i>'
    + '<i class="s-err" style="width:'+w(c.err)+'%"></i>'
    + '</div>'
    + '<div class="legend">'
    + '<span><span class="dot" style="background:var(--green)"></span><b>'+okw+'</b> learned ('+c.mastered+' mastered)</span>'
    + '<span><span class="dot" style="background:var(--red)"></span><b>'+c.err+'</b> to fix</span>'
    + '<span><span class="dot" style="background:var(--line)"></span><b>'+c.nw+'</b> new</span>'
    + '<span style="margin-left:auto">'+streakChip()+seen+' / '+c.total+' seen'+(state.lastSeen?' · last practised '+rel(state.lastSeen):'')+'</span>'
    + '</div>';
  $("#overview").innerHTML = html;
}

  if(tab==="fix"){
    const errs = poolErr();

          + '<button class="btn" id="btnPdf">Download PDF worksheet</button>'

/* ---------- Browse ---------- */
let browse = {q:"", tier:"all", open:{E:true,M:true,H:true,X:true}, status:"all"};
function browseMatch(b){
  if(browse.tier!=="all" && b.lv!==browse.tier) return false;
  if(browse.status!=="all"){
    const r=state.q[b.id];
    if(browse.status==="new" && r) return false;
    if(browse.status==="learned" && !(r && r.st!=="err")) return false;
    if(browse.status==="weak" && !(r && r.st==="err")) return false;
  }
  const q=norm(browse.q);
  if(!q) return true;
  return norm(b.ph).includes(q) || norm(b.mean).includes(q) || norm(b.ex).includes(q);
}
function renderList(){
  const all=BANK.filter(browseMatch);
  const tierBtn=(v,lab)=>'<button class="ghost" data-btier="'+v+'" aria-pressed="'+(browse.tier===v)+'">'+lab+'</button>';
  const statBtn=(v,lab)=>'<button class="ghost" data-bstat="'+v+'" aria-pressed="'+(browse.status===v)+'">'+lab+'</button>';
  let h='';
  h+='<div class="panel" style="padding:16px 18px;margin-bottom:14px">';
  h+='<input id="browseSearch" type="search" placeholder="Search words, meanings or examples…" value="'+esc(browse.q)+'" style="width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;margin-bottom:12px">';
  h+='<div class="row" style="margin-bottom:8px;gap:6px"><span class="hint" style="min-width:52px">Tier</span>'+tierBtn("all","All")+LVORDER.map(lv=>tierBtn(lv,LV[lv])).join("")+'</div>';
  h+='<div class="row" style="margin:0;gap:6px"><span class="hint" style="min-width:52px">Status</span>'+statBtn("all","All")+statBtn("new","New")+statBtn("learned","Learned")+statBtn("weak","To fix")+'</div>';
  h+='</div>';
  if(!all.length){ h+='<div class="empty"><h2>No matches</h2><p>Try a different search term or clear the filters.</p></div>'; return h; }
  h+='<p class="section-note">'+all.length+' word'+(all.length===1?'':'s')+' shown. The correct word is in green.</p>';
  for(const lv of LVORDER){
    const items=all.filter(b=>b.lv===lv); if(!items.length) continue;
    const isOpen=browse.open[lv]!==false;
    h+='<button class="ghost" data-btoggle="'+lv+'" aria-expanded="'+isOpen+'" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:20px;margin:16px 0 8px;padding:10px 14px">'
      +'<span>'+LV[lv]+' <span class="hint">('+items.length+')</span></span><span aria-hidden="true">'+(isOpen?'−':'+')+'</span></button>';
    if(isOpen) h+='<ul class="items">'+items.map(b=>listCard(b,true)).join("")+'</ul>';
  }
  return h;
}

/* ---------- Insights ---------- */
function renderInsights(){
  const c=counts();
  const pct = c.total? Math.round((c.fixed+c.mastered)/c.total*100):0;
  let h = '<div class="card"><div class="score">'+pct+'%</div><p class="hint">of the bank learned — '+c.mastered+' fully mastered, '+c.err+' needing work.</p></div>';
  // per-tier mastery
  h += '<div class="panel"><h2>Mastery by tier</h2>';
  for(const lv of LVORDER){
    const items=BANK.filter(b=>b.lv===lv); if(!items.length) continue;
    const learned=items.filter(b=>{const r=state.q[b.id];return r&&r.st!=="err";}).length;
    const weak=items.filter(b=>{const r=state.q[b.id];return r&&r.st==="err";}).length;
    const p=Math.round(learned/items.length*100);
    h += '<div class="bar-row"><span>'+LV[lv]+'</span><div class="bar'+(weak>learned?' weak':'')+'"><i style="width:'+p+'%"></i></div><span class="num">'+p+'%</span></div>';
  }
  h += '</div>';
  // most-missed
  const missed = BANK.map(b=>({b,r:state.q[b.id]})).filter(x=>x.r&&x.r.miss>0).sort((a,b)=>b.r.miss-a.r.miss).slice(0,8);
  if(missed.length){
    h += '<div class="panel"><h2>Most-missed words</h2><ul class="items">'+missed.map(x=>{
      const p=x.b.ex.split("___");
      return '<li class="item"><p class="q">'+esc(p[0])+'<b>'+esc(x.b.trap)+'</b>'+esc(p[1])+'</p><p class="mn">'+esc(x.b.mean)+'</p><div class="m">'+tagHtml(x.b)+' · missed '+x.r.miss+'×'+(x.r.lastMiss?' · last '+rel(x.r.lastMiss):'')+(x.r.wrong&&x.r.wrong.length?' · tried <span class="w">'+esc(x.r.wrong.join(", "))+'</span>':'')+'</div></li>';
    }).join("")+'</ul></div>';
  }
  // mock test history
  const mk=(state.mocks||[]).slice().reverse();
  if(mk.length){
    const best=Math.max(...mk.map(m=>Math.round(m.right/m.total*100)));
    const avg=Math.round(mk.reduce((a,m)=>a+m.right/m.total*100,0)/mk.length);
    h += '<div class="panel"><h2>Mock test history</h2>';
    h += '<p class="small">'+mk.length+' test'+(mk.length===1?'':'s')+' taken · last '+rel(mk[0].ts)+' · best '+best+'% · average '+avg+'%</p>';
    h += '<ul class="items">'+mk.slice(0,10).map(m=>{
      const pct=Math.round(m.right/m.total*100);
      const tier=m.tier&&m.tier!=="all"?LV[m.tier]:"All tiers";
      return '<li class="item"><div class="m" style="justify-content:space-between"><span><b style="color:var(--ink);font-size:17px">'+m.right+'/'+m.total+'</b> · '+pct+'%</span><span>'+esc(tier)+' · '+fmtDate(m.ts)+'</span></div></li>';
    }).join("")+'</ul></div>';
  }
  return h;
}
