    +[2,3,4].map(n=>opt(String(n),String(state.settings.need),n+"×")).join("")
  +'</select></div>'
  +'<div class="row"><label for="setReset">Reset recovery streak on a slip</label><select id="setReset">'
    +'<option value="1"'+(state.settings.reset?" selected":"")+'>Yes — start over</option>'
    +'<option value="0"'+(!state.settings.reset?" selected":"")+'>No — keep progress</option>'
  +'</select></div>'
  +'<hr>'
  +'<div class="reset-row"><p><b>Reset all progress</b>This clears every answer, streak and recheck on this device.</p><button class="warnbtn" id="btnReset">'+(ui.confirmReset?"Tap again to confirm":"Reset progress")+'</button></div>'
  +'</div>';
}

/* ---------- PDF worksheet (self-contained, no library) ---------- */
function pdfBytes(items, dateStr){
  const W = 595, H = 842, M = 56, CONTENT = W - 2*M;
  const pages = []; let page, y;
  const newPage = () => { page = []; pages.push(page); y = H - M; };
  const MAP = {"’":146,"‘":145,"“":147,"”":148,"–":150,"—":151,"…":133,"•":149};
  const enc = s => { let o = ""; for(const ch of String(s)){ let c = ch.codePointAt(0); if(MAP[ch]) c = MAP[ch]; else if(c > 255) c = 63; const x = String.fromCharCode(c); o += (x==="("||x===")"||x==="\\") ? "\\"+x : x; } return o; };
  const wrap = (s, size, indent) => {
    const max = Math.max(10, Math.floor((CONTENT - indent) / (size*0.54)));
    const words = String(s).split(/\s+/), lines = []; let line = "";
    for(const w of words){ if((line + " " + w).trim().length > max){ if(line) lines.push(line); line = w; } else line = (line + " " + w).trim(); }
    if(line) lines.push(line); return lines;
  };
  function put(s, o){
    o = o || {}; const size = o.size||11, bold = !!o.bold, indent = o.indent||0, gap = o.gap||0, first = o.first;
    const lines = wrap(s, size, indent), lh = size*1.5;
    lines.forEach((ln, i) => { if(y - lh < M + 20) newPage(); y -= lh; const x = M + indent; if(i === 0 && first != null) page.push({x:M, y, size, bold, s:first}); page.push({x, y, size, bold, s:ln}); });
    y -= gap;
  }
  newPage();
  put("Confusables error log", {size:22, bold:true, gap:2});
  put(items.length + (items.length===1?" pair":" pairs") + " to practise" + (dateStr?(" · "+dateStr):""), {size:10.5, gap:10});
  put("Fill each blank with the word that fits — not its look-alike. The answer key, with meanings and notes, starts on a new page.", {size:10.5, gap:14});
  items.forEach((b, i) => put(b.ex.replace("___","________"), {size:12.5, indent:26, first:(i+1)+".", gap:9}));
  newPage();
  put("Answer key", {size:20, bold:true, gap:10});
  items.forEach((b, i) => {
    put(b.ph + (b.vs?("  (not "+b.vs+")"):"") + "  —  " + b.mean, {size:11.5, bold:true, indent:26, first:(i+1)+"."});
    put(b.ex.replace("___", b.trap.toUpperCase()), {size:10.5, indent:26, gap: b.note?0:9});
    if(b.note) put(b.note, {size:10, indent:26, gap:9});
  });
  const objs = [null];
  const nPages = pages.length, kids = [];
  const content = [];
  pages.forEach((pg, i) => {
    const foot = {x:W/2-30, y:M-18, size:9, bold:false, s:"Page "+(i+1)+" of "+nPages};
    const all = pg.concat([foot]);
    let st = ""; all.forEach(l => { st += "BT /"+(l.bold?"F2":"F1")+" "+l.size+" Tf "+l.x.toFixed(1)+" "+l.y.toFixed(1)+" Td ("+enc(l.s)+") Tj ET\n"; });
    content.push(st);
    kids.push((6 + 2*i) + " 0 R");
  });
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[2] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + nPages + " >>";
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>";
  objs[5] = null;
  pages.forEach((pg, i) => {
    objs[5 + 2*i] = "<< /Length " + content[i].length + " >>\nstream\n" + content[i] + "endstream";
    objs[6 + 2*i] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + (5 + 2*i) + " 0 R >>";
  });
  let out = "%PDF-1.4\n"; const offs = [];
  const total = 5 + 2*nPages;
  for(let n = 1; n < total; n++){ offs[n] = out.length; out += n + " 0 obj\n" + objs[n] + "\nendobj\n"; }
  const xref = out.length;
  out += "xref\n0 " + total + "\n0000000000 65535 f \n";
  for(let n = 1; n < total; n++) out += String(offs[n]).padStart(10,"0") + " 00000 n \n";
  out += "trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  const bytes = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
}
async function downloadPdf(){
  const msg = $("#pdfMsg");
  const items = poolErr();
  if(!items.length){ if(msg) msg.textContent = "No errors logged yet."; return; }
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const filename = "confusables-error-log-" + stamp + ".pdf";
  let bytes;
  try{ bytes = pdfBytes(items, d.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})); }
  catch(e){ if(msg) msg.textContent = "Could not build the PDF."; return; }
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename, data:bytes}); if(msg) msg.textContent = "PDF ready: " + filename; }
    catch(e){ if(msg) msg.textContent = (e && e.code==="declined") ? "Download cancelled." : "This page could not save the file here."; }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if(msg) msg.textContent = "PDF ready: " + filename;
  }catch(e){ if(msg) msg.textContent = "Your browser blocked the download."; }
}

/* ---------- event wiring ---------- */
function wireQuestion(){
  const on=(id,fn)=>{const e=$("#"+id); if(e) e.addEventListener("click",fn);};
  on("btnReveal",()=>revealMeaning(cur));
  on("btnGotit",()=>gradeMeaning(cur,true));
  on("btnMissed",()=>gradeMeaning(cur,false));
  on("btnCheck",()=>{ const i=$("#blankInput"); cur.typed=i?i.value:""; gradeGap(cur); });
  on("btnKnow",()=>{ if(cur){ markKnown(cur.id); lastId=cur.id; cur=pickNext(); render(); } });
  on("btnNext",next);
  on("btnSkip",skip);
  const inp=$("#blankInput");
  if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); cur.typed=inp.value; gradeGap(cur); }});
  document.querySelectorAll("[data-mcq]").forEach(btn=>btn.addEventListener("click",()=>chooseMcq(cur,+btn.dataset.mcq)));
  document.querySelectorAll("[data-face]").forEach(btn=>btn.addEventListener("click",()=>{
    const f=btn.dataset.face; cur = build(BY[cur.id], cur.mode, f); render();
  }));
}
function wireChrome(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.tab!=="mock") mockState=null; tab=b.dataset.tab; cur=null; ui.confirmReset=false; render(); }));
  const pb=$("#btnPdf"); if(pb) pb.addEventListener("click",downloadPdf);
  const tr=$("#btnToggleReview"); if(tr) tr.addEventListener("click",()=>{ reviewMode=!reviewMode; cur=null; render(); });
  const sf=$("#setFace"); if(sf) sf.addEventListener("change",e=>{ const v=e.target.value; if(v==="auto"){state.settings.autoface=true;} else {state.settings.autoface=false; state.settings.face=v;} persist(); cur=null; render(); });
  const sl=$("#setLevel"); if(sl) sl.addEventListener("change",e=>{ state.settings.level=e.target.value; persist(); cur=null; render(); });
  const sn=$("#setNeed"); if(sn) sn.addEventListener("change",e=>{ state.settings.need=+e.target.value; persist(); render(); });
  const sr=$("#setReset"); if(sr) sr.addEventListener("change",e=>{ state.settings.reset=e.target.value==="1"; persist(); });
  const bs=$("#browseSearch"); if(bs) bs.addEventListener("input",e=>{ browse.q=e.target.value; const pos=e.target.selectionStart; renderBrowseOnly(); const n=$("#browseSearch"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } });
  document.querySelectorAll("[data-btier]").forEach(b=>b.addEventListener("click",()=>{ browse.tier=b.dataset.btier; renderBrowseOnly(); }));
  document.querySelectorAll("[data-bstat]").forEach(b=>b.addEventListener("click",()=>{ browse.status=b.dataset.bstat; renderBrowseOnly(); }));
  document.querySelectorAll("[data-unknow]").forEach(b=>b.addEventListener("click",()=>{ unmarkKnown(b.dataset.unknow); renderBrowseOnly(); }));
  document.querySelectorAll("[data-btoggle]").forEach(b=>b.addEventListener("click",()=>{ const lv=b.dataset.btoggle; browse.open[lv]=!(browse.open[lv]!==false); renderBrowseOnly(); }));
  const br=$("#btnReset"); if(br) br.addEventListener("click",()=>{
    if(!ui.confirmReset){ ui.confirmReset=true; renderSettings(); wireChrome(); return; }
    state=fresh(); persist(); cur=null; ui.confirmReset=false; render();
  });
}

/* ---------- header controls ---------- */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches); const b=$("#btnTheme"); if(b) b.textContent=dark?"Light mode":"Dark mode"; }
(function initTheme(){ let t=null; try{t=localStorage.getItem("confusables-500-theme");}catch(e){} applyTheme(t==="dark"||t==="light"?t:null); })();
$("#btnTheme").addEventListener("click",()=>{ const cur=document.documentElement.getAttribute("data-theme"); const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches); const nt=dark?"light":"dark"; try{localStorage.setItem("confusables-500-theme",nt);}catch(e){} applyTheme(nt); });
$("#btnSettings").addEventListener("click",()=>{ ui.settings=!ui.settings; $("#btnSettings").setAttribute("aria-expanded",ui.settings); renderSettings(); wireChrome(); });

/* timer */
let timer={on:false,run:false,sec:0,iv:null};
function fmtT(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function tick(){ if(timer.run){ timer.sec++; $("#timerNum").textContent=fmtT(timer.sec); } }
function showTimer(){ const bar=$("#timerBar"); bar.hidden=!timer.on; $("#btnTimer").setAttribute("aria-pressed",timer.on); if(timer.on&&!timer.iv) timer.iv=setInterval(tick,1000); }
$("#btnTimer").addEventListener("click",()=>{ timer.on=!timer.on; if(timer.on){timer.run=true;} showTimer(); });
$("#timerPause").addEventListener("click",()=>{ timer.run=!timer.run; $("#timerBar").classList.toggle("paused",!timer.run); $("#timerPause").textContent=timer.run?"Pause":"Resume"; });
$("#timerReset").addEventListener("click",()=>{ timer.sec=0; $("#timerNum").textContent="00:00"; });

/* boot */
render();

</script>
